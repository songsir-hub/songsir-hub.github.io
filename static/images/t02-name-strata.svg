<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<rect width="1080" height="560" fill="#FBF8F1"/>
<text x="46" y="52" font-size="24" font-weight="bold" fill="#3A3226">六个"莱"字地名的得名年代与来历层位</text>
<text x="46" y="78" font-size="13.5" fill="#6B6255">横轴为得名年代（非等距）；纵轴分四层——只有第一层的"莱"能用来推莱人分布</text>
<line x1="70" y1="470" x2="1010" y2="470" stroke="#4E463A" stroke-width="1.6"/>
<rect x="88.8" y="120" width="263.2" height="330" fill="#B79BC4" fill-opacity="0.20" stroke="#6E5480" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="100.8" y="146" font-size="14" font-weight="bold" fill="#6E5480">第二层　神话同名异源</text>
<text x="100.8" y="166" font-size="11.5" fill="#6B6255">"莱"取草莱义，与族称同形异义</text>
<rect x="352.0" y="120" width="338.4" height="330" fill="#7FA98C" fill-opacity="0.20" stroke="#3F6B4E" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="364.0" y="146" font-size="14" font-weight="bold" fill="#3F6B4E">第一层　先秦莱人遗存</text>
<text x="364.0" y="166" font-size="11.5" fill="#6B6255">所取之"莱"是当地旧名，可上溯</text>
<rect x="690.4" y="120" width="319.6" height="330" fill="#A9A396" fill-opacity="0.20" stroke="#6E6A5E" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="702.4" y="146" font-size="14" font-weight="bold" fill="#6E6A5E">第四层　现代派生／传说层积</text>
<text x="702.4" y="166" font-size="11.5" fill="#6B6255">得名晚，与先秦无涉</text>
<line x1="121.7" y1="250" x2="121.7" y2="470" stroke="#6E5480" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="121.7" cy="250" r="10" fill="#B79BC4" stroke="#6E5480" stroke-width="2.2"/>
<text x="121.7" y="282.0" font-size="14.5" font-weight="bold" fill="#6E5480" text-anchor="middle">蓬莱（神山名）</text>
<text x="121.7" y="300.0" font-size="11.5" fill="#6B6255" text-anchor="middle">《山海经》《列子》已见</text>
<circle cx="121.7" cy="470" r="3.5" fill="#6E5480"/>
<text x="121.7" y="494.0" font-size="12.5" fill="#4E463A" text-anchor="middle">战国</text>
<text x="121.7" y="516.0" font-size="12" fill="#8A6A3A" text-anchor="middle">可当证据：否</text>
<line x1="243.9" y1="330" x2="243.9" y2="470" stroke="#3F6B4E" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="243.9" cy="330" r="10" fill="#7FA98C" stroke="#3F6B4E" stroke-width="2.2"/>
<text x="243.9" y="308.0" font-size="14.5" font-weight="bold" fill="#3F6B4E" text-anchor="middle">莱芜</text>
<text x="243.9" y="326.0" font-size="11.5" fill="#6B6255" text-anchor="middle">置县；"莱民播流"为旧说</text>
<circle cx="243.9" cy="470" r="3.5" fill="#3F6B4E"/>
<text x="243.9" y="494.0" font-size="12.5" fill="#4E463A" text-anchor="middle">西汉</text>
<text x="243.9" y="516.0" font-size="12" fill="#3F6B4E" text-anchor="middle">可当证据：可</text>
<line x1="422.5" y1="330" x2="422.5" y2="470" stroke="#3F6B4E" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="422.5" cy="330" r="10" fill="#7FA98C" stroke="#3F6B4E" stroke-width="2.2"/>
<text x="422.5" y="362.0" font-size="14.5" font-weight="bold" fill="#3F6B4E" text-anchor="middle">莱州</text>
<text x="422.5" y="380.0" font-size="11.5" fill="#6B6255" text-anchor="middle">改光州置，取东莱郡</text>
<circle cx="422.5" cy="470" r="3.5" fill="#3F6B4E"/>
<text x="422.5" y="494.0" font-size="12.5" fill="#4E463A" text-anchor="middle">隋 585</text>
<text x="422.5" y="516.0" font-size="12" fill="#3F6B4E" text-anchor="middle">可当证据：可</text>
<line x1="591.7" y1="330" x2="591.7" y2="470" stroke="#3F6B4E" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="591.7" cy="330" r="10" fill="#7FA98C" stroke="#3F6B4E" stroke-width="2.2"/>
<text x="591.7" y="308.0" font-size="14.5" font-weight="bold" fill="#3F6B4E" text-anchor="middle">莱阳</text>
<text x="591.7" y="326.0" font-size="11.5" fill="#6B6255" text-anchor="middle">避李国昌讳改昌阳</text>
<circle cx="591.7" cy="470" r="3.5" fill="#3F6B4E"/>
<text x="591.7" y="494.0" font-size="12.5" fill="#4E463A" text-anchor="middle">后唐 923</text>
<text x="591.7" y="516.0" font-size="12" fill="#3F6B4E" text-anchor="middle">可当证据：可</text>
<line x1="751.5" y1="410" x2="751.5" y2="470" stroke="#6E6A5E" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="751.5" cy="410" r="10" fill="#A9A396" stroke="#6E6A5E" stroke-width="2.2"/>
<text x="751.5" y="442.0" font-size="14.5" font-weight="bold" fill="#6E6A5E" text-anchor="middle">莱西</text>
<text x="751.5" y="460.0" font-size="11.5" fill="#6B6255" text-anchor="middle">析莱阳县西部置</text>
<circle cx="751.5" cy="470" r="3.5" fill="#6E6A5E"/>
<text x="751.5" y="494.0" font-size="12.5" fill="#4E463A" text-anchor="middle">1941</text>
<text x="751.5" y="516.0" font-size="12" fill="#8A6A3A" text-anchor="middle">可当证据：否</text>
<line x1="911.3" y1="410" x2="911.3" y2="470" stroke="#6E6A5E" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="911.3" cy="410" r="10" fill="#A9A396" stroke="#6E6A5E" stroke-width="2.2"/>
<text x="911.3" y="388.0" font-size="14.5" font-weight="bold" fill="#6E6A5E" text-anchor="middle">烟台莱山区</text>
<text x="911.3" y="406.0" font-size="11.5" fill="#6B6255" text-anchor="middle">镇名升区；约八百年前传说</text>
<circle cx="911.3" cy="470" r="3.5" fill="#6E6A5E"/>
<text x="911.3" y="494.0" font-size="12.5" fill="#4E463A" text-anchor="middle">1994</text>
<text x="911.3" y="516.0" font-size="12" fill="#8A6A3A" text-anchor="middle">可当证据：否</text>
<rect x="70" y="496" width="940" height="46" fill="#E5A55F" fill-opacity="0.18" stroke="#B8743A" stroke-width="1.2" rx="6"/>
<text x="86" y="524" font-size="13" fill="#B8743A">另有一层不在这条轴上：第三层"方位性他称"——汉东莱郡（居齐之东而称东莱）、古"东莱山"（后世指认为今莱州大基山）。此"莱"是方位，与族名是否同源另论。</text>
<text x="1034" y="546" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗　自制示意图</text>
</svg>