<text x="540" y="156" font-size="17" fill="#1B3A6B" text-anchor="end">纳齐尔《林中之蛇》（2026年获奖小说，已澄清并平反）</text>
<rect x="560" y="136" width="580" height="34" rx="5" fill="#F2F5F9"/>
<rect x="560" y="136" width="580.0" height="34" rx="5" fill="#C0392B"/>
