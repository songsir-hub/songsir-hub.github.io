      <text x="8" y="46" font-size="11" fill="#333">CPI</text>
      <rect x="55" y="34" width="120" height="15" fill="#d62728"></rect>
      <text x="180" y="46" font-size="11" fill="#d62728">3.7%（预期3.6）</text>
      <!-- Core CPI 2.6 expected 2.5 -->
      <text x="8" y="74" font-size="11" fill="#333">核心CPI</text>
      <rect x="55" y="62" width="84" height="15" fill="#d62728"></rect>
