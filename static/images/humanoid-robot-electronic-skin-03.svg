<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="290" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">为什么压电与摩擦电天生测不了静态力：τ = R × C</text><rect x="16" y="42" width="220" height="180" rx="12" fill="#f7fafc" stroke="#cfe0f2"/><text x="126" y="64" text-anchor="middle" font-size="11.5" font-weight="700" fill="#123f6d">等效电路</text><rect x="60" y="80" width="52" height="40" rx="4" fill="#ffffff" stroke="#185FA5"/><text x="86" y="104" text-anchor="middle" font-size="10.5" fill="#23303f">电荷源</text><line x1="112" y1="100" x2="160" y2="100" stroke="#185FA5" stroke-width="2"/><line x1="160" y1="80" x2="160" y2="120" stroke="#185FA5" stroke-width="2"/><line x1="160" y1="80" x2="196" y2="80" stroke="#185FA5" stroke-width="2"/><line x1="160" y1="120" x2="196" y2="120" stroke="#185FA5" stroke-width="2"/><line x1="178" y1="76" x2="178" y2="84" stroke="#185FA5" stroke-width="2"/><line x1="186" y1="72" x2="186" y2="88" stroke="#185FA5" stroke-width="2"/><text x="200" y="104" font-size="11" fill="#123f6d">C</text><rect x="150" y="146" width="60" height="34" rx="3" fill="#ffffff" stroke="#e0a92e"/><text x="180" y="167" text-anchor="middle" font-size="10.5" fill="#47607d">R（绝缘）</text><line x1="160" y1="120" x2="160" y2="146" stroke="#e0a92e" stroke-width="2"/><line x1="160" y1="180" x2="160" y2="196" stroke="#e0a92e" stroke-width="2"/><line x1="60" y1="196" x2="200" y2="196" stroke="#dbe7f4" stroke-width="2"/><line x1="60" y1="100" x2="60" y2="196" stroke="#dbe7f4" stroke-width="2"/><text x="126" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">电荷必然经 R 泄漏</text><rect x="252" y="42" width="248" height="180" rx="12" fill="#f7fafc" stroke="#cfe0f2"/><text x="376" y="64" text-anchor="middle" font-size="11.5" font-weight="700" fill="#123f6d">阶跃力输入 → 输出衰减</text><line x1="272" y1="196" x2="484" y2="196" stroke="#7b8ca0" stroke-width="1.5"/><line x1="272" y1="80" x2="272" y2="196" stroke="#7b8ca0" stroke-width="1.5"/><text x="268" y="204" text-anchor="end" font-size="9.5" fill="#7b8ca0">0</text><text x="484" y="204" text-anchor="end" font-size="9.5" fill="#7b8ca0">时间</text><rect x="272" y="86" width="80" height="10" fill="#cbd5e1"/><text x="360" y="95" font-size="10" fill="#47607d">恒定力持续作用</text><path d="M352 176 q0 -70 60 -76 q30 -3 72 -4" fill="none" stroke="#c53030" stroke-width="2.5"/><text x="440" y="150" font-size="10" fill="#c53030">输出→0</text><text x="356" y="212" font-size="10.5" fill="#47607d">响应只出现在力「变化」的瞬间</text><rect x="516" y="42" width="228" height="180" rx="12" fill="#fffbf2" stroke="#f2e0bb"/><text x="630" y="64" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a5d0c">PVDF 典型值代入</text><text x="532" y="86" font-size="11" fill="#47607d">C</text><text x="728" y="86" text-anchor="end" font-size="11.5" font-weight="700" fill="#8a5d0c">≈ 1 nF 量级</text><text x="532" y="106" font-size="11" fill="#47607d">R</text><text x="728" y="106" text-anchor="end" font-size="11.5" font-weight="700" fill="#8a5d0c">≈ 10¹² Ω（GΩ）</text><text x="532" y="126" font-size="11" fill="#47607d">τ = RC</text><text x="728" y="126" text-anchor="end" font-size="11.5" font-weight="700" fill="#8a5d0c">≈ 1 s</text><text x="532" y="146" font-size="11" fill="#47607d">f = 1/(2πτ)</text><text x="728" y="146" text-anchor="end" font-size="11.5" font-weight="700" fill="#8a5d0c">≈ 0.16 Hz</text><text x="532" y="166" font-size="11" fill="#47607d">工程低频截止</text><text x="728" y="166" text-anchor="end" font-size="11.5" font-weight="700" fill="#8a5d0c">约 1 Hz</text><line x1="532" y1="182" x2="728" y2="182" stroke="#f2e0bb"/><text x="532" y="200" font-size="10.5" font-weight="700" fill="#8a5d0c">与厂商「1 Hz–1 kHz」完全自洽</text><text x="532" y="216" font-size="10.5" fill="#47607d">这不是巧合，是同一个 τ 的两种表述</text><rect x="16" y="234" width="728" height="44" rx="10" fill="#fff5f5" stroke="#fed7d7"/><text x="380" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c53030">工程推论：想用压电/摩擦电做「握住鸡蛋不捏碎」是错的（静力场景）</text><text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#47607d">它们对的是滑移检测、纹理识别、敲击感知 —— 要测更低频就要更大的 R·C，与「薄、小、高密度」方向相反</text></svg>
