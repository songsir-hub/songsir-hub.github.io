<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
<rect width="1200" height="620" fill="#FFFFFF"/>
<text x="30" y="42" font-size="25" font-weight="700" fill="#1B3A6B">图2　AI在写作中的位置：献策者不署名，定稿者担责任</text>
<rect x="70" y="110" width="300" height="160" rx="10" fill="#EAF1F9" stroke="#1B3A6B" stroke-width="2"/>
<text x="220" y="160" font-size="30" font-weight="700" fill="#1B3A6B" text-anchor="middle">秘　书</text>
<text x="220" y="200" font-size="16" fill="#555555" text-anchor="middle">整理材料 · 起草初稿 · 润色校对</text>
<rect x="145" y="220" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="1.5"/>
<text x="220" y="243" font-size="17" font-weight="700" fill="#1B3A6B" text-anchor="middle">写而不署名</text>
<path d="M220 270 L220 318" stroke="#1B3A6B" stroke-width="2.5" fill="none"/>
<path d="M213 310 L220 320 L227 310 Z" fill="#1B3A6B"/>
<rect x="450" y="110" width="300" height="160" rx="10" fill="#EAF1F9" stroke="#1B3A6B" stroke-width="2"/>
<text x="600" y="160" font-size="30" font-weight="700" fill="#1B3A6B" text-anchor="middle">参　谋</text>
<text x="600" y="200" font-size="16" fill="#555555" text-anchor="middle">草拟方略 · 推演利弊 · 备陈方案</text>
<rect x="525" y="220" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="1.5"/>
<text x="600" y="243" font-size="17" font-weight="700" fill="#1B3A6B" text-anchor="middle">谋而不居功</text>
<path d="M600 270 L600 318" stroke="#1B3A6B" stroke-width="2.5" fill="none"/>
<path d="M593 310 L600 320 L607 310 Z" fill="#1B3A6B"/>
<rect x="830" y="110" width="300" height="160" rx="10" fill="#FDEDEB" stroke="#C0392B" stroke-width="2"/>
<text x="980" y="160" font-size="30" font-weight="700" fill="#C0392B" text-anchor="middle">AI（模型）</text>
<text x="980" y="200" font-size="16" fill="#555555" text-anchor="middle">检索资料 · 生成草稿 · 润色改写</text>
<rect x="905" y="220" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
<text x="980" y="243" font-size="17" font-weight="700" fill="#C0392B" text-anchor="middle">生成而不负责</text>
<path d="M980 270 L980 318" stroke="#C0392B" stroke-width="2.5" fill="none"/>
<path d="M973 310 L980 320 L987 310 Z" fill="#C0392B"/>
<line x1="120" y1="320" x2="1080" y2="320" stroke="#C9D3DE" stroke-width="2"/>
<rect x="230" y="340" width="740" height="96" rx="10" fill="#FFF8E7" stroke="#D4A017" stroke-width="2"/>
<text x="600" y="378" font-size="24" font-weight="700" fill="#8A6200" text-anchor="middle">作者（人）：审阅 · 判断 · 定稿 · 担责</text>
<text x="600" y="412" font-size="16" fill="#555555" text-anchor="middle">核实事实、删改冗余、取舍观点、承担后果——这一步无法外包</text>
<path d="M600 436 L600 486" stroke="#D4A017" stroke-width="2.5" fill="none"/>
<path d="M593 478 L600 488 L607 478 Z" fill="#D4A017"/>
<rect x="330" y="496" width="540" height="80" rx="10" fill="#1B3A6B"/>
<text x="600" y="536" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">署　名　：　作 者 本 人</text>
<text x="600" y="562" font-size="15" fill="#DCE6F2" text-anchor="middle">责任的归属，决定荣誉的归属</text>
</svg>