<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="抗蠕变分子机制链条">
  <rect width="800" height="400" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
    <text x="400" y="30" font-size="14" fill="#5b7086" text-anchor="middle">抗蠕变能力递增 →</text>

    <!-- 阶梯 1 -->
    <rect x="24" y="60" width="176" height="150" rx="10" fill="#fdecec" stroke="#dc2626" stroke-width="2"/>
    <text x="112" y="86" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">UHMWPE</text>
    <text x="112" y="110" font-size="12" fill="#7f1d1d" text-anchor="middle">纯范德华力</text>
    <g>
      <line x1="60" y1="132" x2="164" y2="132" stroke="#dc2626" stroke-width="2"/>
      <line x1="60" y1="146" x2="164" y2="146" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 4"/>
      <text x="112" y="170" font-size="11" fill="#991b1b" text-anchor="middle">链间无氢键，最弱</text>
      <text x="112" y="192" font-size="12" fill="#b91c1c" text-anchor="middle">蠕变：最差</text>
    </g>

    <!-- 阶梯 2 -->
    <rect x="216" y="60" width="176" height="150" rx="10" fill="#fff3e2" stroke="#ea8a1f" stroke-width="2"/>
    <text x="304" y="86" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">芳纶</text>
    <text x="304" y="110" font-size="12" fill="#7c4a12" text-anchor="middle">氢键 + π-π 堆叠</text>
    <g>
      <line x1="248" y1="132" x2="360" y2="132" stroke="#ea8a1f" stroke-width="2"/>
      <line x1="248" y1="146" x2="360" y2="146" stroke="#ea8a1f" stroke-width="2"/>
      <line x1="270" y1="126" x2="270" y2="152" stroke="#ea8a1f" stroke-width="1.5" stroke-dasharray="2 3"/>
      <line x1="304" y1="126" x2="304" y2="152" stroke="#ea8a1f" stroke-width="1.5" stroke-dasharray="2 3"/>
      <line x1="338" y1="126" x2="338" y2="152" stroke="#ea8a1f" stroke-width="1.5" stroke-dasharray="2 3"/>
      <text x="304" y="170" font-size="11" fill="#7c4a12" text-anchor="middle">二维氢键片层锁住滑移</text>
      <text x="304" y="192" font-size="12" fill="#b45309" text-anchor="middle">蠕变：较好</text>
    </g>

    <!-- 阶梯 3 -->
    <rect x="408" y="60" width="176" height="150" rx="10" fill="#eaf6ef" stroke="#15a06a" stroke-width="2"/>
    <text x="496" y="86" font-size="15" fill="#0f6b47" text-anchor="middle" font-weight="bold">碳纤维</text>
    <text x="496" y="110" font-size="12" fill="#136b47" text-anchor="middle">sp² 共价网络</text>
    <g>
      <path d="M470 128 l16 -9 l16 9 l0 18 l-16 9 l-16 -9 z" fill="none" stroke="#15a06a" stroke-width="2"/>
      <path d="M502 128 l16 -9 l16 9 l0 18 l-16 9 l-16 -9 z" fill="none" stroke="#15a06a" stroke-width="2"/>
      <path d="M486 137 l16 -9 l16 9 l0 18 l-16 9 l-16 -9 z" fill="none" stroke="#15a06a" stroke-width="2"/>
      <text x="496" y="170" font-size="11" fill="#136b47" text-anchor="middle">面内共价，层间乱层堆垛</text>
      <text x="496" y="192" font-size="12" fill="#0f6b47" text-anchor="middle">蠕变：几乎为零</text>
    </g>

    <!-- 阶梯 4 -->
    <rect x="600" y="60" width="176" height="150" rx="10" fill="#e8f0fb" stroke="#185FA5" stroke-width="2"/>
    <text x="688" y="86" font-size="15" fill="#185FA5" text-anchor="middle" font-weight="bold">钢丝 / 钨丝</text>
    <text x="688" y="110" font-size="12" fill="#2c5282" text-anchor="middle">三维金属键</text>
    <g>
      <circle cx="660" cy="132" r="6" fill="#185FA5"/><circle cx="688" cy="132" r="6" fill="#185FA5"/>
      <circle cx="716" cy="132" r="6" fill="#185FA5"/><circle cx="674" cy="146" r="6" fill="#7aa9dd"/>
      <circle cx="702" cy="146" r="6" fill="#7aa9dd"/><circle cx="688" cy="160" r="6" fill="#185FA5"/>
      <text x="688" y="182" font-size="11" fill="#2c5282" text-anchor="middle">无方向性金属键</text>
      <text x="688" y="200" font-size="12" fill="#185FA5" text-anchor="middle">蠕变：室温下≈0</text>
    </g>

    <!-- 箭头 -->
    <path d="M200 135 L212 135" stroke="#94a3b8" stroke-width="2"/>
    <path d="M392 135 L404 135" stroke="#94a3b8" stroke-width="2"/>
    <path d="M584 135 L596 135" stroke="#94a3b8" stroke-width="2"/>

    <!-- 底部推论 -->
    <rect x="24" y="234" width="752" height="140" rx="10" fill="#f8fafc" stroke="#dbe4ee"/>
    <text x="44" y="262" font-size="14" fill="#1e4f8f" font-weight="bold">三个可直接用于工程判断的推论</text>
    <text x="44" y="288" font-size="13" fill="#47607d">1. 靠高倍拉伸「强迫取向」的柔性链（UHMWPE）必然蠕变 —— 这是熵弹性回缩，只能缓解，无法根除。</text>
    <text x="44" y="312" font-size="13" fill="#47607d">2. 「刚性棒状 + 横向强相互作用」的体系（芳纶 / LCP / PBO）天然抗蠕变，代价是密度上升、伸长下降、柔性变差。</text>
    <text x="44" y="336" font-size="13" fill="#47607d">3. 模量与比强度在此解耦：提高取向度能提强度和模量，但只要分子骨架不变，抗蠕变就不会改善。</text>
    <text x="44" y="362" font-size="13" fill="#b45309">→ 更强的 Dyneema SK99 解决不了腱绳蠕变，它优化的是另一个指标。</text>
  </g>
</svg>
