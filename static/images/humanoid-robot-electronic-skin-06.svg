<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="280" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">几何硬约束：高斯曲率非零的曲面上，平面阵列只有两种归宿</text><text x="126" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#123f6d">平面阵列（可展，高斯曲率 = 0）</text><line x1="60" y1="60" x2="60" y2="140" stroke="#dbe7f4"/><line x1="82" y1="60" x2="82" y2="140" stroke="#dbe7f4"/><line x1="104" y1="60" x2="104" y2="140" stroke="#dbe7f4"/><line x1="126" y1="60" x2="126" y2="140" stroke="#dbe7f4"/><line x1="148" y1="60" x2="148" y2="140" stroke="#dbe7f4"/><line x1="170" y1="60" x2="170" y2="140" stroke="#dbe7f4"/><line x1="60" y1="60" x2="170" y2="60" stroke="#dbe7f4"/><line x1="60" y1="80" x2="170" y2="80" stroke="#dbe7f4"/><line x1="60" y1="100" x2="170" y2="100" stroke="#dbe7f4"/><line x1="60" y1="120" x2="170" y2="120" stroke="#dbe7f4"/><line x1="60" y1="140" x2="170" y2="140" stroke="#dbe7f4"/><rect x="60" y="60" width="110" height="80" fill="none" stroke="#185FA5"/><text x="115" y="160" text-anchor="middle" font-size="10.5" fill="#2f855a">taxel 间距均匀、标定有效</text><path d="M190 100 L232 100" stroke="#185FA5" stroke-width="2" marker-end="url(#ar5)"/><defs><marker id="ar5" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#185FA5"/></marker></defs><text x="330" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#123f6d">手指 / 关节 / 面部（高斯曲率 ≠ 0）</text><path d="M250 140 q40 -80 90 -80 q50 0 90 80" fill="none" stroke="#185FA5" stroke-width="2.5"/><ellipse cx="340" cy="140" rx="90" ry="14" fill="#e7f0fc" stroke="#dbe7f4"/><text x="340" y="172" text-anchor="middle" font-size="10.5" fill="#c53030">数学上无法无损贴合</text><rect x="470" y="62" width="274" height="62" rx="10" fill="#fffbf2" stroke="#f2e0bb"/><text x="486" y="82" font-size="11.5" font-weight="700" fill="#8a5d0c">结果一：起皱（材料多余）</text><path d="M486 100 q10 -10 20 0 q10 10 20 0 q10 -10 20 0 q10 10 20 0 q10 -10 20 0 q10 10 20 0" fill="none" stroke="#e0a92e" stroke-width="2"/><text x="486" y="118" font-size="10" fill="#47607d">局部脱粘、层间空隙、外观缺陷</text><rect x="470" y="134" width="274" height="62" rx="10" fill="#fff5f5" stroke="#fed7d7"/><text x="486" y="154" font-size="11.5" font-weight="700" fill="#c53030">结果二：拉伸（材料不足）</text><text x="486" y="172" font-size="10.5" font-weight="700" fill="#c53030">传感单元位置偏移 + 预应变</text><text x="486" y="188" font-size="10.5" font-weight="700" fill="#c53030">→ 标定全盘失效</text><rect x="16" y="210" width="728" height="58" rx="10" fill="#f7fafc" stroke="#cfe0f2"/><text x="380" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#123f6d">三条解法：① 分块拼接（缝隙是盲区）　② 预变形 / 裁剪图案 kirigami（切口处力学不连续）　③ 本征可拉伸（需把应变作为标定参数）</text><text x="380" y="252" text-anchor="middle" font-size="11" fill="#47607d">判断：小面积高曲率（指尖）用本征可拉伸 + 应变补偿；大面积低曲率（躯干）用分块拼接；指关节「高曲率 + 反复弯折」目前没有成熟解</text></svg>
