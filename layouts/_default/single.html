{{/* ─── 单篇文章页：继承 Ananke 主题，底部加 Giscus 评论 ─── */}}
{{ define "main" }}

  <article class="post">
    <!-- 文章标题已由 page-header hero 显示，此处仅保留日期 -->
    <header class="post-header mb4">
      <div class="f6 mid-gray">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      </div>
    </header>

    <!-- 文章正文 -->
    <div class="post-content lh-copy">
      {{ .Content }}
    </div>
  </article>

  {{/* 听全文：纯前端浏览器朗读，无需预生成音频；?v= 版本戳强制破缓存，每次改 listen.js 后 bump 该号 */}}
  <script src="{{ "js/listen.js?v=2" | relURL }}" defer></script>

  <!-- Giscus 评论 -->
  {{- partials.Include "comments.html" . -}}

{{ end }}
