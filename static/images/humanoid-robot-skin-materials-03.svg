<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="322" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">皮肤材料的第一指标是撕裂强度，不是拉伸强度</text><text x="380" y="42" text-anchor="middle" font-size="11" fill="#7b8ca0">（按「是否决定失效」排序；条形长度表示该项对皮肤寿命与可用性的影响权重，为定性排序）</text><text x="16" y="66" font-size="12" font-weight="700" fill="#123f6d">撕裂强度</text><rect x="130" y="54" width="700" height="16" rx="4" fill="#c53030"/><text x="140" y="66" font-size="10.5" fill="#ffffff">第一失效模式：切口在反复弯折中扩展</text><text x="16" y="91" font-size="12" font-weight="700" fill="#123f6d">耐候 / 抗 UV</text><rect x="130" y="79" width="660" height="16" rx="4" fill="#d97706"/><text x="140" y="91" font-size="10.5" fill="#ffffff">黄变、粉化决定外观件寿命</text><text x="16" y="116" font-size="12" font-weight="700" fill="#123f6d">断裂伸长率</text><rect x="130" y="104" width="620" height="16" rx="4" fill="#e0a92e"/><text x="140" y="116" font-size="10.5" fill="#ffffff">关节屈曲与装配余量，面部件要求 ≥600%</text><text x="16" y="141" font-size="12" font-weight="700" fill="#123f6d">邵氏硬度</text><rect x="130" y="129" width="580" height="16" rx="4" fill="#3b82f6"/><text x="140" y="141" font-size="10.5" fill="#ffffff">手感与模量，需与传感层协调</text><text x="16" y="166" font-size="12" font-weight="700" fill="#123f6d">回弹性 / 滞后</text><rect x="130" y="154" width="540" height="16" rx="4" fill="#3b82f6"/><text x="140" y="166" font-size="10.5" fill="#ffffff">决定触觉信号保真与「橡皮感」</text><text x="16" y="191" font-size="12" font-weight="700" fill="#123f6d">耐磨</text><rect x="130" y="179" width="500" height="16" rx="4" fill="#3b82f6"/><text x="140" y="191" font-size="10.5" fill="#ffffff">抓取面与地面接触区的寿命</text><text x="16" y="216" font-size="12" font-weight="700" fill="#123f6d">压缩永久变形</text><rect x="130" y="204" width="440" height="16" rx="4" fill="#60a5fa"/><text x="140" y="216" font-size="10.5" fill="#ffffff">长期握持后的形变恢复</text><text x="16" y="241" font-size="12" font-weight="700" fill="#123f6d">阻燃 / 生物相容</text><rect x="130" y="229" width="400" height="16" rx="4" fill="#60a5fa"/><text x="140" y="241" font-size="10.5" fill="#ffffff">安规与人体接触，合规硬约束</text><text x="16" y="266" font-size="12" font-weight="700" fill="#123f6d">拉伸强度</text><rect x="130" y="254" width="300" height="16" rx="4" fill="#93c5fd"/><text x="140" y="266" font-size="10.5" fill="#ffffff"></text><text x="448" y="266" font-size="10.5" fill="#7b8ca0">次要：硅胶仅 1–7 MPa，塑料里垫底，却仍是最优解</text><text x="16" y="291" font-size="12" font-weight="700" fill="#123f6d">导热系数</text><rect x="130" y="279" width="220" height="16" rx="4" fill="#cbd5e1"/><text x="140" y="291" font-size="10.5" fill="#47607d"></text><text x="368" y="291" font-size="10.5" fill="#7b8ca0">见 §6.1：量级上并非散热瓶颈</text><rect x="16" y="314" width="728" height="30" rx="8" fill="#fffbf2" stroke="#f2e0bb"/><text x="380" y="333" text-anchor="middle" font-size="11.5" fill="#8a5d0c">结构性结论：十二项里排在最前的没有一项是「拉伸强度」—— 皮肤从来不是靠「抗拉」服役的</text></svg>
