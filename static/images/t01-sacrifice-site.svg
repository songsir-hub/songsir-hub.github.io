<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#8B7355"/></marker></defs>
<rect width="920" height="500" fill="#FBF8F1"/>
<text x="460" y="44" font-size="21" font-weight="bold" fill="#3A3226" text-anchor="middle">月主祠遗址：一座夯土台上能读出什么</text>
<text x="460" y="67" font-size="13" fill="#6B6255" text-anchor="middle">庙周家秦汉建筑基址平面示意（据公开发掘资料绘制，非实测图）</text>
<rect x="150" y="130" width="300" height="210" rx="2" fill="#EFE6CE" fill-opacity="0.6" stroke="#3A3226" stroke-width="2.6"/>
<text x="300" y="118" font-size="14" font-weight="bold" fill="#3A3226" text-anchor="middle">夯土台基 · 方形花纹砖铺地</text>
<text x="300" y="158" font-size="13" font-weight="bold" fill="#6E5480" text-anchor="middle">残存约 9.3 × 9.2 米</text>
<path d="M150,176 L450,176" stroke="#8B7355" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<path d="M200,176 L200,340" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M250,176 L250,340" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M300,176 L300,340" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M350,176 L350,340" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M400,176 L400,340" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M150,217 L450,217" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M150,258 L450,258" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<path d="M150,299 L450,299" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>
<text x="300" y="366" font-size="12" fill="#6B6255" text-anchor="middle">石砌墙基（局部存）</text>
<rect x="500" y="130" width="360" height="210" rx="9" fill="#FFFFFF" stroke="#8B7355" stroke-width="1.6"/>
<text x="520" y="158" font-size="14.5" font-weight="bold" fill="#3A3226" text-anchor="start">发掘与年代</text>
<text x="520" y="186" font-size="12.5" font-weight="bold" fill="#6E5480" text-anchor="start">1983 年</text>
<text x="588" y="186" font-size="12.5" fill="#4E463A" text-anchor="start">烟台市博物馆首次发掘，判为秦汉时期</text>
<text x="520" y="211" font-size="12.5" font-weight="bold" fill="#6E5480" text-anchor="start">2010 年</text>
<text x="588" y="211" font-size="12.5" fill="#4E463A" text-anchor="start">山东大学东方考古研究中心·中国国家博物馆</text>
<text x="520" y="236" font-size="12.2" fill="#6B6255" text-anchor="start">「齐地八主祠调查发掘和研究」项目再度发掘</text>
<text x="520" y="261" font-size="12.2" fill="#6B6255" text-anchor="start">山顶全部揭露：房址 1、人工开凿沟 1、特殊形制坑 1</text>
<text x="520" y="286" font-size="12.2" fill="#6B6255" text-anchor="start">遗物显示主要经历汉代与唐宋两大时期</text>
<text x="520" y="311" font-size="12.5" font-weight="bold" fill="#6E5480" text-anchor="start">2006 年</text>
<text x="588" y="311" font-size="12.5" fill="#4E463A" text-anchor="start">列为山东省文物保护单位</text>
<text x="300" y="404" font-size="14.5" font-weight="bold" fill="#3A3226" text-anchor="middle">出土建筑构件</text>
<rect x="100" y="418" width="168" height="46" rx="6" fill="#5E9BB8" fill-opacity="0.45" stroke="#3E7CA6" stroke-width="1.6"/>
<text x="184" y="438" font-size="12.8" font-weight="bold" fill="#3A3226" text-anchor="middle">筒瓦 · 板瓦</text>
<text x="184" y="456" font-size="11.2" fill="#6B6255" text-anchor="middle">修复大板瓦 42 × 108 厘米</text>
<rect x="290" y="418" width="168" height="46" rx="6" fill="#5E9BB8" fill-opacity="0.45" stroke="#3E7CA6" stroke-width="1.6"/>
<text x="374" y="438" font-size="12.8" font-weight="bold" fill="#3A3226" text-anchor="middle">云纹瓦当</text>
<text x="374" y="456" font-size="11.2" fill="#6B6255" text-anchor="middle">祠庙等级</text>
<rect x="480" y="418" width="168" height="46" rx="6" fill="#5E9BB8" fill-opacity="0.45" stroke="#3E7CA6" stroke-width="1.6"/>
<text x="564" y="438" font-size="12.8" font-weight="bold" fill="#3A3226" text-anchor="middle">铺地方砖</text>
<text x="564" y="456" font-size="11.2" fill="#6B6255" text-anchor="middle">几何纹 · 如意花叶纹</text>
<rect x="670" y="418" width="168" height="46" rx="6" fill="#5E9BB8" fill-opacity="0.45" stroke="#3E7CA6" stroke-width="1.6"/>
<text x="754" y="438" font-size="12.8" font-weight="bold" fill="#3A3226" text-anchor="middle">踏步砖</text>
<text x="754" y="456" font-size="11.2" fill="#6B6255" text-anchor="middle">折边 · 如意奔鹿纹</text>
<path d="M60,466 L860,466" stroke="#8B7355" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
<text x="60" y="486" font-size="11.5" fill="#6B6255" text-anchor="start">瓦件形体巨大、砖纹繁复，且配有专门烧造的窑址——非民间小祠所能有。</text>
<text x="860" y="486" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
</svg>
