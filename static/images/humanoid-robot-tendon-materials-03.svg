<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六类腱绳材料定位图">
  <rect width="800" height="440" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
    <line x1="90" y1="380" x2="740" y2="380" stroke="#94a3b8" stroke-width="2"/>
    <line x1="90" y1="380" x2="90" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <text x="740" y="404" font-size="13" fill="#5b7086" text-anchor="end">抗蠕变 / 尺寸稳定性 →</text>
    <text x="70" y="46" font-size="13" fill="#5b7086">↑ 比强度</text>
    <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4">
      <line x1="90" y1="330" x2="740" y2="330"/><line x1="90" y1="270" x2="740" y2="270"/>
      <line x1="90" y1="210" x2="740" y2="210"/><line x1="90" y1="150" x2="740" y2="150"/>
      <line x1="90" y1="90" x2="740" y2="90"/>
    </g>

    <circle cx="180" cy="108" r="42" fill="#185FA5" fill-opacity="0.18" stroke="#185FA5" stroke-width="2"/>
    <text x="180" y="106" font-size="13" fill="#185FA5" text-anchor="middle" font-weight="bold">UHMWPE</text>
    <text x="180" y="122" font-size="11" fill="#2c5282" text-anchor="middle">主力 · 蠕变差</text>

    <circle cx="400" cy="196" r="24" fill="#ea8a1f" fill-opacity="0.18" stroke="#ea8a1f" stroke-width="2"/>
    <text x="400" y="244" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">芳纶</text>
    <text x="400" y="260" font-size="11" fill="#7c4a12" text-anchor="middle">特种补位</text>

    <circle cx="530" cy="200" r="30" fill="#15a06a" fill-opacity="0.18" stroke="#15a06a" stroke-width="2"/>
    <text x="530" y="252" font-size="13" fill="#0f6b47" text-anchor="middle" font-weight="bold">LCP / Vectran</text>
    <text x="530" y="268" font-size="11" fill="#136b47" text-anchor="middle">抗蠕变最优但贵</text>

    <circle cx="556" cy="140" r="18" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="2"/>
    <text x="596" y="122" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="bold">PBO / Zylon</text>
    <text x="596" y="138" font-size="11" fill="#5b21b6" text-anchor="middle">怕紫外 · 价高</text>

    <circle cx="648" cy="168" r="16" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="2"/>
    <text x="682" y="166" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">碳纤维</text>
    <text x="682" y="182" font-size="11" fill="#991b1b" text-anchor="middle">脆 · 不容错</text>

    <circle cx="690" cy="330" r="26" fill="#475569" fill-opacity="0.20" stroke="#475569" stroke-width="2"/>
    <text x="690" y="378" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold">钢丝 / 钨丝</text>
    <text x="690" y="394" font-size="11" fill="#475569" text-anchor="middle">零蠕变 · 但重</text>

    <text x="470" y="72" font-size="12" fill="#a16207">右上角不是无人区：PBO 已在其中，</text>
    <text x="470" y="90" font-size="12" fill="#a16207">但它怕紫外、价高、弯折疲劳一般。</text>
    <path d="M620 100 L580 124" stroke="#f0c078" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="90" y="424" font-size="12" fill="#7b8ca0">气泡大小 = 弯曲疲劳寿命相对水平（示意，非等比例）</text>
  </g>
</svg>
