<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<rect width="960" height="520" fill="#FBF8F1"/>

<text x="480" y="46" font-size="25" fill="#3A3226" text-anchor="middle" font-weight="bold">金文里的「莱」：写作「釐」或「来」</text>
<text x="480" y="74" font-size="12.5" fill="#6B6255" text-anchor="middle">与莱国有关的铭文，那个字从不从艸——陈梦家、唐兰、孙诒让三家的读法</text>
<rect x="33.0" y="104" width="282" height="176" rx="10" fill="#FFFDF7" stroke="#C9BFA8" stroke-width="1.8"/>
<text x="174.0" y="136" font-size="17" fill="#3A3226" text-anchor="middle" font-weight="bold">莱伯鼎</text>
<text x="174.0" y="158" font-size="12" fill="#6B6255" text-anchor="middle">西周 · 黄县莱阴</text>
<line x1="55.0" y1="170" x2="293.0" y2="170" stroke="#C9BFA8" stroke-width="1.2"/>
<text x="174.0" y="200" font-size="15" fill="#C07830" text-anchor="middle" font-weight="bold">铭文那个字是「釐」字省写</text>
<text x="174.0" y="228" font-size="12.5" fill="#3A3226" text-anchor="middle">「釐」假作莱，乃莱国之名</text>
<text x="174.0" y="256" font-size="11.5" fill="#6B6255" text-anchor="middle">陈梦家《西周铜器断代》</text>
<rect x="339.0" y="104" width="282" height="176" rx="10" fill="#FFFDF7" stroke="#C9BFA8" stroke-width="1.8"/>
<text x="480.0" y="136" font-size="17" fill="#3A3226" text-anchor="middle" font-weight="bold">史密簋</text>
<text x="480.0" y="158" font-size="12" fill="#6B6255" text-anchor="middle">西周中期 · 《新收》636</text>
<line x1="361.0" y1="170" x2="599.0" y2="170" stroke="#C9BFA8" stroke-width="1.2"/>
<text x="480.0" y="200" font-size="15" fill="#C07830" text-anchor="middle" font-weight="bold">率族人、「釐伯」、僰、眉</text>
<text x="480.0" y="228" font-size="12.5" fill="#3A3226" text-anchor="middle">自名作「釐伯」</text>
<text x="480.0" y="256" font-size="11.5" fill="#6B6255" text-anchor="middle">释文一般隶作「莱伯」</text>
<rect x="645.0" y="104" width="282" height="176" rx="10" fill="#FFFDF7" stroke="#C9BFA8" stroke-width="1.8"/>
<text x="786.0" y="136" font-size="17" fill="#3A3226" text-anchor="middle" font-weight="bold">叔夷钟／镈</text>
<text x="786.0" y="158" font-size="12" fill="#6B6255" text-anchor="middle">春秋晚期 · 《集成》272—285</text>
<line x1="667.0" y1="170" x2="905.0" y2="170" stroke="#C9BFA8" stroke-width="1.2"/>
<text x="786.0" y="200" font-size="15" fill="#C07830" text-anchor="middle" font-weight="bold">「釐都」　「釐仆三百又五十家」</text>
<text x="786.0" y="228" font-size="12.5" fill="#3A3226" text-anchor="middle">齐灵公所赐，指被征服者</text>
<text x="786.0" y="256" font-size="11.5" fill="#6B6255" text-anchor="middle">「釐」即「莱」，不从艸</text>
<rect x="33.0" y="310" width="894" height="82" rx="8" fill="#F2EAD8" stroke="#C9BFA8" stroke-width="1.6"/>
<text x="53.0" y="338" font-size="14" fill="#3A3226" text-anchor="start" font-weight="bold">训诂上的硬对照：同一条草木训诂，两个写法</text>
<text x="53.0" y="366" font-size="15" fill="#6E9450" text-anchor="start">《尔雅·释草》：釐，蔓華。</text>
<text x="333.0" y="366" font-size="15" fill="#6E9450" text-anchor="start">《说文·艸部》：萊，蔓華也。</text>
<text x="653.0" y="366" font-size="14" fill="#6B6255" text-anchor="start" font-weight="bold">＝ 一个词</text>
<rect x="33.0" y="418" width="894" height="52" rx="8" fill="none" stroke="#C07830" stroke-width="2.0"/>
<text x="480.0" y="451" font-size="14" fill="#3A3226" text-anchor="middle" font-weight="bold">结论：判别潍淄与胶东，不看「莱」字写没写出来，而看声系——见纽（己／纪／㠱）对来纽（釐／来）</text>
<text x="904" y="506" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
</svg>