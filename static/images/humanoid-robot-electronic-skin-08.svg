<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="270" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">两笔被低估的账：带宽与标定</text><text x="190" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123f6d">① 数据搬运（1 万 taxel · 三轴 · 16 bit）</text><text x="30" y="82" font-size="10.5" fill="#47607d">全量上报 @1 kHz</text><rect x="30" y="88" width="460" height="16" rx="4" fill="#f6ad55"/><text x="480" y="100" font-size="10.5" font-weight="700" fill="#7c4a12">480 Mbit/s（60 MB/s）</text><text x="30" y="128" font-size="10.5" fill="#47607d">全量上报 @100 Hz</text><rect x="30" y="134" width="180" height="16" rx="4" fill="#fbd38d"/><text x="220" y="146" font-size="10.5" font-weight="700" fill="#23303f">48 Mbit/s</text><text x="30" y="174" font-size="10.5" fill="#47607d">SA 全量 + FA 事件驱动</text><rect x="30" y="180" width="70" height="16" rx="4" fill="#68d391"/><text x="110" y="192" font-size="10.5" font-weight="700" fill="#23303f">约 72 Mbit/s（降约 85%）</text><rect x="30" y="210" width="320" height="66" rx="8" fill="#f0fff4" stroke="#c6f6d5"/><text x="46" y="230" font-size="11" font-weight="700" fill="#2f855a">仿生依据：人体 FA 类感受器是差分 / 事件型</text><text x="46" y="250" font-size="11" fill="#47607d">只在变化时才放电 —— 照抄这套架构，</text><text x="46" y="268" font-size="11" fill="#47607d">可在不损失动态性能下降一个数量级</text><line x1="380" y1="46" x2="380" y2="250" stroke="#cfe0f2" stroke-dasharray="4 4"/><text x="570" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123f6d">② 逐点标定的时间账单</text><text x="440" y="72" font-size="11.5" font-weight="400" fill="#47607d">1 万个 taxel</text><text x="440" y="92" font-size="11.5" font-weight="400" fill="#47607d">× 5 个载荷水平</text><text x="440" y="112" font-size="11.5" font-weight="400" fill="#47607d">× 2 个温度点</text><text x="440" y="132" font-size="11.5" font-weight="400" fill="#47607d">× 3 秒 / 次（含稳定）</text><text x="440" y="152" font-size="11.5" font-weight="400" fill="#47607d"></text><text x="440" y="172" font-size="11.5" font-weight="700" fill="#c53030">= 100,000 次加载</text><text x="440" y="192" font-size="11.5" font-weight="700" fill="#c53030">≈ 300,000 秒 ≈ 83 小时 / 台</text><rect x="440" y="212" width="300" height="72" rx="8" fill="#fff5f5" stroke="#fed7d7"/><text x="456" y="232" font-size="11" font-weight="700" fill="#c53030">这在批量生产上完全不可行</text><text x="456" y="250" font-size="10.5" fill="#47607d">量产只能走：批次标定 + 归一化</text><text x="456" y="266" font-size="10.5" fill="#47607d">+ 自标定算法 / 芯片内置标定</text><text x="456" y="280" font-size="10.5" fill="#47607d">→ 要求被推回制造端一致性</text></svg>
