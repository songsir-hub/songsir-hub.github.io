<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="306" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">按人体两点辨别阈分层：全身均匀高密度是浪费</text><text x="380" y="42" text-anchor="middle" font-size="11" fill="#7b8ca0">左列为人体的有效空间分辨率（经典心理物理学数据），右列为工程建议</text><text x="16" y="64" font-size="11" font-weight="700" fill="#7b8ca0">部位</text><text x="104" y="64" font-size="11" font-weight="700" fill="#7b8ca0">人体辨别阈</text><text x="200" y="64" font-size="10" font-weight="700" fill="#7b8ca0">人体两点辨别阈（条长按比例示意）</text><text x="600" y="64" font-size="11" font-weight="700" fill="#7b8ca0">建议 taxel 间距</text><text x="744" y="64" text-anchor="end" font-size="11" font-weight="700" fill="#7b8ca0">估计数量</text><text x="16" y="95" font-size="11.5" font-weight="700" fill="#123f6d">指尖</text><text x="104" y="95" font-size="11" fill="#47607d">1–2 mm</text><rect x="200" y="84" width="40" height="14" rx="3" fill="#c53030"/><text x="508" y="95" font-size="10.5" fill="#7b8ca0">1–2 mm</text><text x="600" y="95" font-size="11" font-weight="700" fill="#123f6d">1–2 mm</text><text x="744" y="95" text-anchor="end" font-size="10" fill="#7b8ca0">1000–2000</text><text x="16" y="125" font-size="11.5" font-weight="700" fill="#123f6d">手掌</text><text x="104" y="125" font-size="11" fill="#47607d">8–10 mm</text><rect x="200" y="114" width="130" height="14" rx="3" fill="#e0a92e"/><text x="508" y="125" font-size="10.5" fill="#7b8ca0">8–10 mm</text><text x="600" y="125" font-size="11" font-weight="700" fill="#123f6d">5–8 mm</text><text x="744" y="125" text-anchor="end" font-size="10" fill="#7b8ca0">数百</text><text x="16" y="155" font-size="11.5" font-weight="700" fill="#123f6d">足底</text><text x="104" y="155" font-size="11" fill="#47607d">承重区密</text><rect x="200" y="144" width="150" height="14" rx="3" fill="#e0a92e"/><text x="508" y="155" font-size="10.5" fill="#7b8ca0">承重区密</text><text x="600" y="155" font-size="11" font-weight="700" fill="#123f6d">5–10 mm</text><text x="744" y="155" text-anchor="end" font-size="10" fill="#7b8ca0">数百</text><text x="16" y="185" font-size="11.5" font-weight="700" fill="#123f6d">前臂 / 小腿</text><text x="104" y="185" font-size="11" fill="#47607d">30–40 mm</text><rect x="200" y="174" width="260" height="14" rx="3" fill="#185FA5"/><text x="508" y="185" font-size="10.5" fill="#7b8ca0">30–40 mm</text><text x="600" y="185" font-size="11" font-weight="700" fill="#123f6d">20–30 mm</text><text x="744" y="185" text-anchor="end" font-size="10" fill="#7b8ca0">数百</text><text x="16" y="215" font-size="11.5" font-weight="700" fill="#123f6d">躯干 / 背部</text><text x="104" y="215" font-size="11" fill="#47607d">40–60 mm</text><rect x="200" y="204" width="300" height="14" rx="3" fill="#185FA5"/><text x="508" y="215" font-size="10.5" fill="#7b8ca0">40–60 mm</text><text x="600" y="215" font-size="11" font-weight="700" fill="#123f6d">30–50 mm</text><text x="744" y="215" text-anchor="end" font-size="10" fill="#7b8ca0">1000–3000</text><line x1="16" y1="236" x2="744" y2="236" stroke="#cfe0f2"/><text x="16" y="260" font-size="12" font-weight="700" fill="#c53030">按此分布倒推，全身 taxel 合计数约 1 万级 —— 这不是一个任意数字</text><text x="16" y="282" font-size="11" fill="#47607d">在躯干铺 1 mm 间距阵列，是在为一个生理上并不存在的分辨率需求付钱，同时把带宽、标定、成本三件事推向不可行</text></svg>
