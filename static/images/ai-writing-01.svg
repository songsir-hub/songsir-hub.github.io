<rect x="60" y="434" width="1080" height="52" rx="8" fill="#FDEDEB" stroke="#C0392B" stroke-width="1.5"/>
<text x="600" y="466" font-size="18" font-weight="700" fill="#C0392B" text-anchor="middle">工具既认不出AI，也认不出人 —— 却有人拿它给人定罪</text>
