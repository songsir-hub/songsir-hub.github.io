<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#4a5568"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#276749"/></marker>
  </defs>
  <style>.t{font-size:14px;fill:#1a202c;}.ts{font-size:11.5px;fill:#4a5568;}</style>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a202c">以 SINS 为骨干的舰船/水下组合导航体系</text>

  <!-- 环境分区 -->
  <rect x="20" y="52" width="580" height="150" rx="10" fill="#f0f7ff" opacity="0.65"/>
  <text class="t" x="36" y="76" font-weight="bold" fill="#2b6cb0">水面状态（卫星可见）</text>
  <rect x="20" y="216" width="580" height="310" rx="10" fill="#ebf8ff" opacity="0.55"/>
  <text class="t" x="36" y="240" font-weight="bold" fill="#2c5282">水下状态（电磁失效，声学/地球物理接力）</text>

  <!-- 传感器：水面 -->
  <rect x="44" y="92" width="120" height="44" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text class="t" x="104" y="113" text-anchor="middle" font-size="13">GNSS</text>
  <text class="ts" x="104" y="128" text-anchor="middle">米级位置（可被干扰）</text>

  <rect x="196" y="92" width="120" height="44" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text class="t" x="256" y="113" text-anchor="middle" font-size="13">天文导航</text>
  <text class="ts" x="256" y="128" text-anchor="middle">无源、隐蔽</text>

  <!-- 传感器：水下 -->
  <rect x="44" y="262" width="130" height="52" rx="6" fill="#ffffff" stroke="#2c5282" stroke-width="1.5"/>
  <text class="t" x="109" y="283" text-anchor="middle" font-size="13">多普勒计程仪 DVL</text>
  <text class="ts" x="109" y="300" text-anchor="middle">对底/对水测速</text>

  <rect x="44" y="330" width="130" height="52" rx="6" fill="#ffffff" stroke="#2c5282" stroke-width="1.5"/>
  <text class="t" x="109" y="351" text-anchor="middle" font-size="13">深度计</text>
  <text class="ts" x="109" y="368" text-anchor="middle">替代发散的垂直通道</text>

  <rect x="44" y="398" width="130" height="52" rx="6" fill="#ffffff" stroke="#2c5282" stroke-width="1.5"/>
  <text class="t" x="109" y="419" text-anchor="middle" font-size="13">声学基线 LBL/USBL</text>
  <text class="ts" x="109" y="436" text-anchor="middle">厘米—分米级绝对锚点</text>

  <rect x="44" y="466" width="130" height="52" rx="6" fill="#ffffff" stroke="#2c5282" stroke-width="1.5"/>
  <text class="t" x="109" y="481" text-anchor="middle" font-size="12.5">地球物理匹配</text>
  <text class="ts" x="109" y="496" text-anchor="middle">地形/地磁/重力指纹</text>

  <rect x="220" y="262" width="130" height="52" rx="6" fill="#ffffff" stroke="#2c5282" stroke-width="1.5"/>
  <text class="t" x="285" y="283" text-anchor="middle" font-size="13">惯性系对准</text>
  <text class="ts" x="285" y="300" text-anchor="middle">系泊/航行对准</text>

  <!-- 核心：SINS -->
  <rect x="400" y="300" width="176" height="110" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2.2"/>
  <text class="t" x="488" y="330" text-anchor="middle" font-weight="bold" font-size="16">捷联惯导 SINS</text>
  <text class="ts" x="488" y="352" text-anchor="middle">光纤/激光陀螺 + 加速度计</text>
  <text class="ts" x="488" y="370" text-anchor="middle">连续输出姿态·航向·速度·位置</text>
  <text class="ts" x="488" y="392" text-anchor="middle">短时精度极高，误差随时间累积</text>

  <!-- 卡尔曼滤波 -->
  <rect x="400" y="440" width="176" height="56" rx="8" fill="#f0fff4" stroke="#276749" stroke-width="1.8"/>
  <text class="t" x="488" y="463" text-anchor="middle" font-size="14">卡尔曼滤波器</text>
  <text class="ts" x="488" y="481" text-anchor="middle">估计并补偿误差状态</text>

  <!-- 输出 -->
  <rect x="640" y="120" width="220" height="400" rx="10" fill="#f0fff4" stroke="#276749" stroke-width="1.8"/>
  <text class="t" x="750" y="150" text-anchor="middle" font-weight="bold" fill="#276749">统一时空基准输出</text>
  <text class="ts" x="672" y="180">· 实时位置 / 速度</text>
  <text class="ts" x="672" y="206">· 航向 / 横摇 / 纵摇</text>
  <text class="ts" x="672" y="232">· 升沉与升沉速度</text>
  <text class="ts" x="672" y="258">· 角速度 / 线加速度</text>
  <line x1="660" y1="276" x2="840" y2="276" stroke="#c6f6d5" stroke-width="2"/>
  <text class="t" x="672" y="302" font-size="13">→ 舰炮与导弹火控</text>
  <text class="t" x="672" y="330" font-size="13">→ 动力定位（DP）</text>
  <text class="t" x="672" y="358" font-size="13">→ 多波束测深姿态改正</text>
  <text class="t" x="672" y="386" font-size="13">→ AUV/ROV 导航控制</text>
  <text class="t" x="672" y="414" font-size="13">→ 极区航行（网格/游移方位）</text>
  <text class="t" x="672" y="442" font-size="13">→ 潜艇水下隐蔽机动</text>

  <!-- 箭头 -->
  <path d="M164,114 L400,114 L400,300" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M316,114 L360,114 L360,120" fill="none" stroke="#2b6cb0" stroke-width="1.8"/>
  <text class="ts" x="360" y="142">水面：周期性重调</text>
  <path d="M174,288 L400,320" fill="none" stroke="#2c5282" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M174,356 L400,356" fill="none" stroke="#2c5282" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M174,424 L400,380 L576,380" fill="none" stroke="#2c5282" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M174,492 L400,420" fill="none" stroke="#2c5282" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M350,288 L400,330" fill="none" stroke="#2c5282" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M488,410 L488,440" fill="none" stroke="#276749" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M488,440 L488,410" fill="none" stroke="#276749" stroke-width="1.4" stroke-dasharray="4,3"/>
  <path d="M576,355 L640,300" fill="none" stroke="#276749" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text class="ts" x="600" y="316" fill="#276749">导航解</text>

  <text class="ts" x="450" y="556" text-anchor="middle">设计哲学：惯导提供连续高带宽"记忆"，外部源周期性"清零"——任一环节失效，系统退化为低精度而非失效</text>
  <text x="884" y="574" text-anchor="end" font-size="11" fill="#a0aec0">制图：松朗</text>
</svg>
