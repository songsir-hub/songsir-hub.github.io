<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#8A7A6A"/>
</marker>
<marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#B04A3A"/>
</marker>
<marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#4E7A52"/>
</marker>
</defs>
<rect width="1100" height="730" fill="#FBF8F1"/>

<text x="550" y="44" font-size="26" fill="#3A3226" text-anchor="middle" font-weight="bold">同一个“姜”字，两种走法</text>
<text x="550" y="74" font-size="13.5" fill="#6B6255" text-anchor="middle">左路绕一圈回到原点，什么都没有说明；右路把两层证据分开，各自站各自的证据</text>

<!-- ============ 左：循环论证 ============ -->
<rect x="50" y="100" width="480" height="470" rx="10" fill="#FDF6F4" stroke="#B04A3A" stroke-width="2"/>
<rect x="50" y="100" width="480" height="34" rx="10" fill="#B04A3A"/>
<text x="290" y="123" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">要规避的坑：循环论证</text>

<rect x="86" y="152" width="408" height="46" rx="6" fill="#FFFDF7" stroke="#D9C0BC" stroke-width="1.2"/>
<text x="104" y="180" font-size="13" fill="#3A3226" text-anchor="start">① 铜器上写着一个“姜”字</text>

<line x1="290" y1="198" x2="290" y2="216" stroke="#B04A3A" stroke-width="1.6" marker-end="url(#arb)"/>

<rect x="86" y="220" width="408" height="46" rx="6" fill="#FFFDF7" stroke="#D9C0BC" stroke-width="1.2"/>
<text x="104" y="248" font-size="13" fill="#3A3226" text-anchor="start">② 默认“纪＝姜＝莱”</text>

<line x1="290" y1="266" x2="290" y2="284" stroke="#B04A3A" stroke-width="1.6" marker-end="url(#arb)"/>

<rect x="86" y="288" width="408" height="46" rx="6" fill="#FFFDF7" stroke="#D9C0BC" stroke-width="1.2"/>
<text x="104" y="316" font-size="13" fill="#3A3226" text-anchor="start">③ 推出“莱也姓姜”</text>

<line x1="290" y1="334" x2="290" y2="352" stroke="#B04A3A" stroke-width="1.6" marker-end="url(#arb)"/>

<rect x="86" y="356" width="408" height="46" rx="6" fill="#FFFDF7" stroke="#D9C0BC" stroke-width="1.2"/>
<text x="104" y="384" font-size="13" fill="#3A3226" text-anchor="start">④ 回头拿它去支持“纪莱一脉”</text>

<path d="M 104 379 C 62 360, 62 200, 100 178" fill="none" stroke="#B04A3A" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arb)"/>
<text x="70" y="292" font-size="11.5" fill="#B04A3A" text-anchor="start" font-weight="bold">绕回</text>

<rect x="86" y="424" width="408" height="56" rx="6" fill="#F7E4E0" stroke="#B04A3A" stroke-width="1.4"/>
<text x="104" y="448" font-size="13" fill="#8A3A2C" text-anchor="start" font-weight="bold">结论已经藏在前提里</text>
<text x="104" y="470" font-size="12" fill="#8A3A2C" text-anchor="start">绕一圈，什么都没有说明</text>

<text x="290" y="510" font-size="12" fill="#6B6255" text-anchor="middle">用假说推导出结论，再用结论反证假说</text>

<!-- ============ 右：分层论证 ============ -->
<rect x="570" y="100" width="480" height="470" rx="10" fill="#F5FAF5" stroke="#4E7A52" stroke-width="2"/>
<rect x="570" y="100" width="480" height="34" rx="10" fill="#4E7A52"/>
<text x="810" y="123" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">本书的做法：两层分开</text>

<rect x="606" y="152" width="408" height="96" rx="6" fill="#FFFDF7" stroke="#C3D6C5" stroke-width="1.2"/>
<text x="624" y="178" font-size="13" fill="#4E7A52" text-anchor="start" font-weight="bold">第一层　金文直证</text>
<text x="624" y="200" font-size="12" fill="#3A3226" text-anchor="start">纪侯簋“己侯作姜萦簋”</text>
<text x="624" y="220" font-size="12" fill="#3A3226" text-anchor="start">《春秋》桓九年“纪季姜归于京师”</text>
<text x="624" y="242" font-size="12.5" fill="#4E7A52" text-anchor="start" font-weight="bold">→ 纪为姜姓，先于假说，不依赖它</text>

<rect x="606" y="262" width="408" height="80" rx="6" fill="#FFFDF7" stroke="#C3D6C5" stroke-width="1.2"/>
<text x="624" y="288" font-size="13" fill="#4E7A52" text-anchor="start" font-weight="bold">第二层　经假说连接</text>
<text x="624" y="310" font-size="12" fill="#3A3226" text-anchor="start">“纪莱一脉”成立 ↓ 潍淄之莱即纪</text>
<text x="624" y="332" font-size="12.5" fill="#8A7330" text-anchor="start" font-weight="bold">→ 莱为姜姓，是推论，强度次之</text>

<rect x="606" y="356" width="408" height="80" rx="6" fill="#FFF9EC" stroke="#D9C79A" stroke-width="1.2"/>
<text x="624" y="382" font-size="13" fill="#8A7330" text-anchor="start" font-weight="bold">独立检验　南埠墓异姓通婚</text>
<text x="624" y="404" font-size="12" fill="#3A3226" text-anchor="start">姜姓之纪嫁女于非姜姓之莱</text>
<text x="624" y="426" font-size="12" fill="#3A3226" text-anchor="start">若莱＝纪＝姜，则违同姓不婚之制</text>

<rect x="606" y="448" width="408" height="56" rx="6" fill="#E6F0E7" stroke="#4E7A52" stroke-width="1.4"/>
<text x="624" y="472" font-size="13" fill="#3A5E3E" text-anchor="start" font-weight="bold">两层各有独立的证据基础</text>
<text x="624" y="494" font-size="12" fill="#3A5E3E" text-anchor="start">不可互换，也不得相互充当前提</text>

<text x="810" y="532" font-size="12" fill="#6B6255" text-anchor="middle">前者不靠假说成立，后者须靠假说才成立</text>

<!-- ============ 底：判语 ============ -->
<rect x="50" y="596" width="1000" height="98" rx="10" fill="#F2EAD8" stroke="#C9BFA8" stroke-width="1.8"/>
<text x="74" y="626" font-size="14" fill="#3A3226" text-anchor="start" font-weight="bold">分寸只有一句</text>
<text x="74" y="654" font-size="13" fill="#3A3226" text-anchor="start">纪为姜姓，是先于假说的金文事实；莱为姜姓，是经“纪莱一脉”连过去才得到的推论。</text>
<text x="74" y="680" font-size="13" fill="#C07830" text-anchor="start" font-weight="bold">两层证据，不能拧成一股——拧成一股，就是那个坑。</text>

<text x="1050" y="718" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
</svg>
