<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="100%" font-family="Songti SC, SimSun, STSong, serif">
<defs>
  <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#DCE9F2"/>
    <stop offset="100%" stop-color="#C7DCEA"/>
  </linearGradient>
  <filter id="landShadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#7A6A50" flood-opacity="0.28"/>
  </filter>
  <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0.8" dy="1.2" stdDeviation="1.0" flood-color="#2E2418" flood-opacity="0.55"/>
  </filter>
</defs>
<rect width="1080" height="760" fill="#FBF8F1"/>
<text x="540" y="50" font-size="26" font-weight="bold" fill="#2E2820" text-anchor="middle" letter-spacing="2">斟寻·斟灌地望之争（两说对照示意）</text>
<text x="540" y="80" font-size="15" fill="#6B6255" text-anchor="middle" letter-spacing="1">夏后氏两核心同姓方国，地望聚讼；书稿两存其说，不作裁断</text>
<line x1="180" y1="94" x2="900" y2="94" stroke="#B5A98C" stroke-width="1.4"/>
<rect x="40" y="120" width="490" height="470" rx="9" fill="#FCFAF4" stroke="#2E6DA4" stroke-width="2"/>
<text x="285" y="150" font-size="18" font-weight="bold" fill="#2E6DA4" text-anchor="middle">山东说（潍淄流域）</text>
<path d="M110,180 Q160,320 120,440 Q98,505 140,532" fill="none" stroke="#3E7CA6" stroke-width="2.4" stroke-opacity="0.7"/>
<text x="90" y="172" font-size="13" fill="#2C5F80" font-style="italic">潍水</text>
<path d="M210,180 Q250,310 220,430 Q202,495 245,528" fill="none" stroke="#3E7CA6" stroke-width="2.4" stroke-opacity="0.7"/>
<text x="228" y="172" font-size="13" fill="#2C5F80" font-style="italic">淄水</text>
<circle cx="295" cy="335" r="13" fill="#2E6DA4" fill-opacity="0.9" stroke="#FBF8F1" stroke-width="2"/>
<text x="315" y="340" font-size="15" font-weight="bold" fill="#2E6DA4">平寿（潍坊西南）</text>
<text x="315" y="362" font-size="13" fill="#3A3226">汉北海郡境</text>
<text x="315" y="384" font-size="13" fill="#3A3226">杜预注、京相璠相承</text>
<text x="315" y="406" font-size="13" fill="#3A3226">叶圭绶、毕以珣主此说</text>
<text x="64" y="566" font-size="12.5" fill="#8B7D66" font-style="italic">即便在潍淄，其人为姒姓夏后氏，与莱夷（子/姜）不同族姓</text>
<rect x="550" y="120" width="490" height="470" rx="9" fill="#FCFAF4" stroke="#C0392B" stroke-width="2"/>
<text x="795" y="150" font-size="18" font-weight="bold" fill="#C0392B" text-anchor="middle">河南说（豫西）</text>
<path d="M640,180 Q700,320 660,450 Q635,530 690,568" fill="none" stroke="#B9772E" stroke-width="2.4" stroke-opacity="0.7"/>
<text x="620" y="172" font-size="13" fill="#8A5A1E" font-style="italic">洛水</text>
<circle cx="805" cy="335" r="13" fill="#C0392B" fill-opacity="0.9" stroke="#FBF8F1" stroke-width="2"/>
<text x="825" y="340" font-size="15" font-weight="bold" fill="#C0392B">巩县西南／二里头</text>
<text x="825" y="362" font-size="13" fill="#3A3226">雷学淇以下：斟寻在巩县</text>
<text x="825" y="384" font-size="13" fill="#3A3226">或径以偃师二里头当之</text>
<text x="574" y="566" font-size="12.5" fill="#8B7D66" font-style="italic">据二里头文化分布与「同姓国应在夏文化区内」之推论</text>
<text x="540" y="355" font-size="13" fill="#6B6255" text-anchor="middle" transform="rotate(-90 540 355)">两说分属不同证据层面</text>
<rect x="40" y="614" width="1000" height="126" rx="7" fill="#FCFAF4" stroke="#D8CEB6" stroke-width="1.2"/>
<text x="56" y="640" font-size="13.3" fill="#5A5245">① 材料层级须分明：山东说属「地望考订」（杜预注、京相璠与汉魏旧地名层层相承）；</text>
<text x="56" y="665" font-size="13.3" fill="#5A5245">　　河南说属「考古文化归属」的推论——二者不在同一证据层面，不能简单互证。</text>
<text x="56" y="690" font-size="13.3" fill="#5A5245">② 无论地望何在，斟寻斟灌为姒姓夏后氏，与莱夷（子姓、姜姓）不同族姓；至多说明「夏代潍淄已是夷夏交错区」，不可推衍「莱夷与夏同源」。</text>
<text x="56" y="715" font-size="13.3" fill="#8B8375">③ 两图均为示意（右图非实测底图）；书稿不作裁断。　作图：松朗</text>
</svg>