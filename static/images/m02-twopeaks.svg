<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<rect width="920" height="600" fill="#FBF8F1"/>
<text x="460.0" y="42" font-size="22" font-weight="bold" fill="#3A3226" text-anchor="middle">两莱并立：族姓证据、自名系统与终局分层</text>
<text x="460.0" y="66" font-size="13.5" fill="#6B6255" text-anchor="middle">共享若干莱夷文化背景；族姓证据强度有别，政治脉络分别检验</text>
<rect x="190.0" y="88" width="540" height="78" rx="10" fill="#EFE6CE" stroke="#8B7355" stroke-width="2"/>
<text x="460.0" y="118" font-size="16.5" font-weight="bold" fill="#3A3226" text-anchor="middle">莱夷历史文化范围</text>
<text x="460.0" y="144" font-size="12.5" fill="#4E463A" text-anchor="middle">区域考古文化序列可作背景，不等于两莱同源</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8B7355"/></marker></defs>
<path d="M340.0,166 C240.0,216 180.0,221 160.0,244" fill="none" stroke="#8B7355" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<path d="M580.0,166 C680.0,216 740.0,221 760.0,244" fill="none" stroke="#8B7355" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<rect x="60" y="260" width="360" height="190" rx="10" fill="#E8A65C" fill-opacity="0.18" stroke="#C07830" stroke-width="2.4"/>
<text x="240.0" y="294" font-size="18" font-weight="bold" fill="#3A3226" text-anchor="middle">潍淄之莱（纪系）</text>
<text x="82" y="326" font-size="13" font-weight="bold" fill="#C07830">族姓</text>
<text x="126" y="326" font-size="13" fill="#3A3226">姜姓而己氏（经传与金文相互参证）</text>
<text x="82" y="356" font-size="13" font-weight="bold" fill="#C07830">都邑</text>
<text x="126" y="356" font-size="13" fill="#3A3226">纪台（寿光）→ 前690后推定昌邑郲地</text>
<text x="82" y="386" font-size="13" font-weight="bold" fill="#C07830">自名</text>
<text x="126" y="386" font-size="13" fill="#3A3226">己 · 纪 · 㠱（目前未见莱声自名）</text>
<text x="82" y="416" font-size="13" font-weight="bold" fill="#C07830">结局</text>
<text x="126" y="416" font-size="13" fill="#3A3226">前567 齐灭莱（《左传》襄公六年）</text>
<rect x="500" y="260" width="360" height="190" rx="10" fill="#5E9BB8" fill-opacity="0.16" stroke="#3E7CA6" stroke-width="2.4"/>
<text x="680.0" y="294" font-size="18" font-weight="bold" fill="#3A3226" text-anchor="middle">东莱（胶东）</text>
<text x="522" y="326" font-size="13" font-weight="bold" fill="#3E7CA6">族姓</text>
<text x="566" y="326" font-size="13" fill="#3A3226">子姓为文献推定，非“莱子”之“子”</text>
<text x="522" y="356" font-size="13" font-weight="bold" fill="#3E7CA6">都邑</text>
<text x="566" y="356" font-size="13" fill="#3A3226">归城（龙口）——晚期区域中心</text>
<text x="522" y="386" font-size="13" font-weight="bold" fill="#3E7CA6">自名</text>
<text x="566" y="386" font-size="13" fill="#3A3226">莱伯 · 来／釐铭辞（或缀“来”族徽）</text>
<text x="522" y="416" font-size="13" font-weight="bold" fill="#3E7CA6">结局</text>
<text x="566" y="416" font-size="13" fill="#3A3226">春秋晚期逐步归并；灭年不详</text>
<path d="M420,352 L500,352" stroke="#7A5FA0" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M430,352 C450,352 450,392 440,404" fill="none" stroke="#7A5FA0" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M490,352 C470,352 470,392 480,404" fill="none" stroke="#7A5FA0" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="330.0" y="456" width="260" height="46" rx="8" fill="#FFF" stroke="#7A5FA0" stroke-width="1.6"/>
<text x="460.0" y="476" font-size="13" font-weight="bold" fill="#7A5FA0" text-anchor="middle">婚姻往来，而非政治统一</text>
<text x="460.0" y="494" font-size="11.5" fill="#4E463A" text-anchor="middle">南埠媵器：限于婚姻流向与姓属线索</text>
<line x1="70" y1="536" x2="850" y2="536" stroke="#3A3226" stroke-width="2.4"/>
<circle cx="180" cy="536" r="6" fill="#FBF8F1" stroke="#3A3226" stroke-width="2.4"/>
<text x="180" y="558" font-size="14" font-weight="bold" fill="#3A3226" text-anchor="middle">前 690</text>
<text x="180" y="575" font-size="11.5" fill="#4E463A" text-anchor="middle">纪侯大去其国——文献显隐变化，非实际改名</text>
<circle cx="460" cy="536" r="6" fill="#FBF8F1" stroke="#3A3226" stroke-width="2.4"/>
<text x="460" y="558" font-size="14" font-weight="bold" fill="#3A3226" text-anchor="middle">前 567</text>
<text x="460" y="575" font-size="11.5" fill="#4E463A" text-anchor="middle">齐灭莱——被灭的是潍淄之莱</text>
<circle cx="740" cy="536" r="6" fill="#FBF8F1" stroke="#3A3226" stroke-width="2.4"/>
<text x="740" y="558" font-size="14" font-weight="bold" fill="#3A3226" text-anchor="middle">前 522</text>
<text x="740" y="575" font-size="11.5" fill="#4E463A" text-anchor="middle">晏婴论“姑尤以西”——只限该语境所及</text>
<path d="M850,536 L838,531 L838,541 Z" fill="#3A3226"/>
<text x="70" y="524" font-size="11.5" fill="#8B8375">东周</text>
<text x="460.0" y="594" font-size="11.5" fill="#8B8375" text-anchor="middle">族姓、都邑、自名、结局分据各层材料，不作同源谱系。示意图。</text>
<text x="908" y="594" font-size="12" fill="#6B6255" text-anchor="end" font-weight="bold" letter-spacing="2">松朗制图</text>
</svg>
