<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="300" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">同样叫「皮肤」，其实是三种物理目标完全不同的产品</text><rect x="16" y="42" width="234" height="212" rx="12" fill="#fbfcfe" stroke="#cfe0f2"/><rect x="16" y="42" width="234" height="6" rx="3" fill="#8fb8e8"/><circle cx="40" cy="72" r="13" fill="#8fb8e8"/><text x="40" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text><text x="62" y="77" font-size="14.5" font-weight="700" fill="#123f6d">外观蒙皮</text><text x="62" y="93" font-size="10.5" fill="#7b8ca0">cosmetic skin</text><line x1="30" y1="104" x2="236" y2="104" stroke="#dbe7f4"/><text x="30" y="126" font-size="11.5" fill="#47607d">物理目标：看起来、摸起来像人</text><text x="30" y="148" font-size="11.5" fill="#47607d">第一指标：纹理保真、肤色稳定</text><text x="30" y="170" font-size="11.5" fill="#47607d">典型硬度：0–15 A</text><text x="30" y="192" font-size="11.5" fill="#47607d">典型厚度：0.3–1.2 mm</text><rect x="263" y="42" width="234" height="212" rx="12" fill="#fbfcfe" stroke="#cfe0f2"/><rect x="263" y="42" width="234" height="6" rx="3" fill="#7fc0a8"/><circle cx="287" cy="72" r="13" fill="#7fc0a8"/><text x="287" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text><text x="309" y="77" font-size="14.5" font-weight="700" fill="#123f6d">防护表皮</text><text x="309" y="93" font-size="10.5" fill="#7b8ca0">protective skin</text><line x1="277" y1="104" x2="483" y2="104" stroke="#dbe7f4"/><text x="277" y="126" font-size="11.5" fill="#47607d">物理目标：封闭、缓冲、耐磨</text><text x="277" y="148" font-size="11.5" fill="#47607d">第一指标：撕裂强度、耐候阻燃</text><text x="277" y="170" font-size="11.5" fill="#47607d">典型硬度：10–40 A</text><text x="277" y="192" font-size="11.5" fill="#47607d">典型厚度：1–3 mm</text><rect x="510" y="42" width="234" height="212" rx="12" fill="#fbfcfe" stroke="#cfe0f2"/><rect x="510" y="42" width="234" height="6" rx="3" fill="#e8b06a"/><circle cx="534" cy="72" r="13" fill="#e8b06a"/><text x="534" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text><text x="556" y="77" font-size="14.5" font-weight="700" fill="#123f6d">传感皮肤</text><text x="556" y="93" font-size="10.5" fill="#7b8ca0">e-skin</text><line x1="524" y1="104" x2="730" y2="104" stroke="#dbe7f4"/><text x="524" y="126" font-size="11.5" fill="#47607d">物理目标：力学信号高保真</text><text x="524" y="148" font-size="11.5" fill="#47607d">第一指标：传递保真、模量匹配</text><text x="524" y="170" font-size="11.5" fill="#47607d">典型硬度：随传感层协调</text><text x="524" y="192" font-size="11.5" fill="#47607d">典型厚度：0.1–1 mm（越薄越好）</text><rect x="16" y="266" width="728" height="26" rx="8" fill="#fffbf2" stroke="#f2e0bb"/><text x="380" y="283" text-anchor="middle" font-size="12" fill="#8a5d0c">三者对材料的要求互相冲突：皮越厚越耐造、也越不像人；越薄触感越真、也越不抗造 —— 单一方案必然妥协</text></svg>
