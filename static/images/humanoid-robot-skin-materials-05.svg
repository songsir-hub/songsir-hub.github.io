<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">一条 Si–O 主链，同时给出三个互相独立的好处</text><rect x="16" y="42" width="728" height="86" rx="10" fill="#f7fafc" stroke="#cfe0f2"/><polyline points="70,100 130,66 190,100 250,66 310,100 370,66 430,100 490,66 550,100 610,66 670,100" fill="none" stroke="#185FA5" stroke-width="3"/><circle cx="70" cy="100" r="11" fill="#ffffff"/><circle cx="70" cy="100" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="70" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">Si</text><circle cx="130" cy="66" r="11" fill="#ffffff"/><circle cx="130" cy="66" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="130" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">O</text><circle cx="190" cy="100" r="11" fill="#ffffff"/><circle cx="190" cy="100" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="190" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">Si</text><circle cx="250" cy="66" r="11" fill="#ffffff"/><circle cx="250" cy="66" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="250" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">O</text><circle cx="310" cy="100" r="11" fill="#ffffff"/><circle cx="310" cy="100" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="310" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">Si</text><circle cx="370" cy="66" r="11" fill="#ffffff"/><circle cx="370" cy="66" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="370" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">O</text><circle cx="430" cy="100" r="11" fill="#ffffff"/><circle cx="430" cy="100" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="430" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">Si</text><circle cx="490" cy="66" r="11" fill="#ffffff"/><circle cx="490" cy="66" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="490" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">O</text><circle cx="550" cy="100" r="11" fill="#ffffff"/><circle cx="550" cy="100" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="550" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">Si</text><circle cx="610" cy="66" r="11" fill="#ffffff"/><circle cx="610" cy="66" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="610" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">O</text><circle cx="670" cy="100" r="11" fill="#ffffff"/><circle cx="670" cy="100" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="670" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#123f6d">Si</text><text x="380" y="124" text-anchor="middle" font-size="11" fill="#47607d">Si–O 键能 约 452 kJ/mol（C–C 约 348）　·　键角 约 143°　·　内旋转位垒极低</text><rect x="16" y="142" width="234" height="150" rx="12" fill="#d9e8fb" stroke="#cfe0f2"/><text x="30" y="168" font-size="13.5" font-weight="700" fill="#123f6d">① 极低玻璃化温度</text><text x="30" y="190" font-size="12.5" font-weight="700" fill="#8a5d0c">Tg 约 −125 ℃</text><line x1="30" y1="200" x2="236" y2="200" stroke="#ffffff"/><text x="30" y="220" font-size="11.5" font-weight="600" fill="#23303f">天生柔软，无需增塑剂</text><text x="30" y="240" font-size="11" fill="#47607d">消除增塑剂迁移带来的老化路径</text><rect x="263" y="142" width="234" height="150" rx="12" fill="#d7f0e3" stroke="#cfe0f2"/><text x="277" y="168" font-size="13.5" font-weight="700" fill="#123f6d">② 半无机主链</text><text x="277" y="190" font-size="12.5" font-weight="700" fill="#8a5d0c">UV 打不断 Si–O</text><line x1="277" y1="200" x2="483" y2="200" stroke="#ffffff"/><text x="277" y="220" font-size="11.5" font-weight="600" fill="#23303f">最软的弹性体，却最耐 UV</text><text x="277" y="240" font-size="11" fill="#47607d">黄变主因是侧基氧化与残留催化剂</text><text x="277" y="255" font-size="11" fill="#47607d">，不是主链</text><rect x="510" y="142" width="234" height="150" rx="12" fill="#fbeedb" stroke="#cfe0f2"/><text x="524" y="168" font-size="13.5" font-weight="700" fill="#123f6d">③ 低表面能</text><text x="524" y="190" font-size="12.5" font-weight="700" fill="#8a5d0c">约 20–24 mN/m</text><line x1="524" y1="200" x2="730" y2="200" stroke="#ffffff"/><text x="524" y="220" font-size="11.5" font-weight="600" fill="#23303f">疏水抗污，但几乎粘不住</text><text x="524" y="240" font-size="11" fill="#47607d">出油沾灰与难粘接是同一件事的两</text><text x="524" y="255" font-size="11" fill="#47607d">面</text><rect x="16" y="300" width="728" height="24" rx="8" fill="#f5f8fb" stroke="#cfe0f2"/><text x="380" y="316" text-anchor="middle" font-size="11" fill="#47607d">补一条关键事实：纯 PDMS 硫化后仅约 0.3 MPa，硅胶 3–7 MPa 的强度来自气相法白炭黑补强 —— 壁垒在配方，不在牌号</text></svg>
