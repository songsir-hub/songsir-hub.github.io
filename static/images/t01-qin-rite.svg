<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#8B7355"/></marker></defs>
<rect width="920" height="520" fill="#FBF8F1"/>
<text x="460" y="44" font-size="21" font-weight="bold" fill="#3A3226" text-anchor="middle">秦始皇怎样祭这座山</text>
<text x="460" y="67" font-size="13" fill="#6B6255" text-anchor="middle">据《史记·封禅书》「皆各用一牢具祠，而巫祝所损益，珪币杂异焉」绘制的场景示意</text>
<path d="M70,418 L850,418" stroke="#8B7355" stroke-width="2.0" fill="none"/>
<path d="M300,418 L300,330 L620,330 L620,418 Z" fill="#EFE6CE" stroke="#8B7355" stroke-width="2.0"/>
<rect x="340" y="268" width="240" height="64" rx="4" fill="#A98BB0" fill-opacity="0.85" stroke="#6E5480" stroke-width="2.4"/>
<text x="460" y="300" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">月 主 祠</text>
<text x="460" y="322" font-size="11" fill="#F6EFE6" text-anchor="middle">延光月主真君祠（后世全称）</text>
<text x="460" y="250" font-size="13" font-weight="bold" fill="#6E5480" text-anchor="middle">祠坛</text>
<rect x="150" y="366" width="108" height="52" rx="5" fill="#FFFFFF" stroke="#8B7355" stroke-width="1.8"/>
<text x="204" y="388" font-size="14" font-weight="bold" fill="#3A3226" text-anchor="middle">牢 具</text>
<text x="204" y="408" font-size="11.2" fill="#6B6255" text-anchor="middle">牲一（牛·羊·豕）</text>
<path d="M258,392 L296,392" stroke="#8B7355" stroke-width="1.4" fill="none"/>
<rect x="672" y="366" width="108" height="52" rx="5" fill="#FFFFFF" stroke="#8B7355" stroke-width="1.8"/>
<text x="726" y="388" font-size="14" font-weight="bold" fill="#3A3226" text-anchor="middle">珪 币</text>
<text x="726" y="408" font-size="11.2" fill="#6B6255" text-anchor="middle">玉帛 · 各祠异制</text>
<path d="M672,392 L636,392" stroke="#8B7355" stroke-width="1.4" fill="none"/>
<circle cx="250" cy="330" r="16" fill="#5E9BB8" stroke="#3E7CA6" stroke-width="2.0"/>
<text x="250" y="334" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">巫祝</text>
<text x="250" y="366" font-size="11.2" fill="#6B6255" text-anchor="middle">损益其礼</text>
<circle cx="560" cy="330" r="16" fill="#E5A55F" stroke="#B8743A" stroke-width="2.0"/>
<text x="560" y="334" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">皇帝</text>
<text x="560" y="366" font-size="11.2" fill="#6B6255" text-anchor="middle">行礼祠八神</text>
<rect x="70" y="442" width="780" height="34" rx="9" fill="#EFE6CE" fill-opacity="0.45" stroke="#8B7355" stroke-width="1.5"/>
<text x="460" y="464" font-size="13.5" font-weight="bold" fill="#3A3226" text-anchor="middle">八神之六曰月主，祠之莱山——秦始皇前 219 年东巡海上所礼者即此</text>
<path d="M60,486 L860,486" stroke="#8B7355" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
<text x="60" y="506" font-size="11.5" fill="#6B6255" text-anchor="start">本图为礼制场景示意，非写实复原；人物、器物仅表其位，不摹其形。</text>
<text x="860" y="506" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
</svg>
