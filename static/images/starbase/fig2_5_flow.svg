<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
  <rect width="1000" height="640" fill="#FBF8F1"/>
  <text x="500" y="40" font-size="21" font-weight="bold" fill="#3A3226" text-anchor="middle">图2.5：传统航天港 vs 星际基地 运营模式</text>
  <text x="500" y="62" font-size="13" fill="#6B6255" text-anchor="middle">Figure 2.5: Traditional Spaceport vs Starbase — Operational Model</text>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 z" fill="#8B7355"/>
    </marker>
  </defs>

  <!-- ============ Left panel: traditional spaceport ============ -->
  <rect x="40" y="90" width="440" height="470" rx="10" fill="#E8A65C" fill-opacity="0.10" stroke="#C07830" stroke-width="2"/>
  <text x="260" y="120" font-size="15" font-weight="bold" fill="#C07830" text-anchor="middle">传统航天港模式 / Traditional Spaceport</text>
  <text x="260" y="140" font-size="11.5" fill="#8A8578" text-anchor="middle">多用户共享 · 需排期等待</text>

  <!-- A -->
  <rect x="80" y="170" width="360" height="56" rx="8" fill="#1e2a3a" stroke="#8892a4"/>
  <text x="260" y="192" font-size="13" fill="#e8ecf4" text-anchor="middle">A · 载荷集成商</text>
  <text x="260" y="212" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Payload Integrator</text>
  <path d="M260,226 L260,246" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- B -->
  <rect x="80" y="248" width="360" height="56" rx="8" fill="#1e2a3a" stroke="#8892a4"/>
  <text x="260" y="270" font-size="13" fill="#e8ecf4" text-anchor="middle">B · 发射服务商</text>
  <text x="260" y="290" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Launch Service Provider</text>
  <path d="M260,304 L260,324" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- C -->
  <rect x="80" y="326" width="360" height="56" rx="8" fill="#1e2a3a" stroke="#8892a4"/>
  <text x="260" y="348" font-size="13" fill="#e8ecf4" text-anchor="middle">C · 政府/军方发射场</text>
  <text x="260" y="368" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Gov/Mil Launch Site</text>
  <path d="M260,382 L260,402" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- D (queue - amber) -->
  <rect x="80" y="404" width="360" height="56" rx="8" fill="#1e2a3a" stroke="#f59e0b"/>
  <text x="260" y="426" font-size="13" fill="#f59e0b" text-anchor="middle">D · 等待排期</text>
  <text x="260" y="446" font-size="11.5" fill="#f59e0b" text-anchor="middle">Queue for Slot</text>
  <path d="M260,460 L260,480" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- E -->
  <rect x="80" y="482" width="360" height="56" rx="8" fill="#1e2a3a" stroke="#8892a4"/>
  <text x="260" y="504" font-size="13" fill="#e8ecf4" text-anchor="middle">E · 发射</text>
  <text x="260" y="524" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Launch</text>

  <!-- ============ Right panel: starbase ============ -->
  <rect x="520" y="90" width="440" height="470" rx="10" fill="#38bdf8" fill-opacity="0.08" stroke="#4A7D9C" stroke-width="2"/>
  <text x="740" y="120" font-size="15" font-weight="bold" fill="#4A7D9C" text-anchor="middle">星际基地模式 / Starbase Model</text>
  <text x="740" y="140" font-size="11.5" fill="#8A8578" text-anchor="middle">全链条自主 · 高频周转</text>

  <!-- F Design -->
  <rect x="700" y="170" width="180" height="56" rx="8" fill="#0b0f1a" stroke="#38bdf8"/>
  <text x="790" y="192" font-size="13" fill="#e8ecf4" text-anchor="middle">F · 设计</text>
  <text x="790" y="212" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Design</text>
  <path d="M790,226 L790,246" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- G Manufacture -->
  <rect x="700" y="248" width="180" height="56" rx="8" fill="#0b0f1a" stroke="#38bdf8"/>
  <text x="790" y="270" font-size="13" fill="#e8ecf4" text-anchor="middle">G · 制造</text>
  <text x="790" y="290" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Manufacture</text>
  <path d="M790,304 L790,324" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- H Test -->
  <rect x="700" y="326" width="180" height="56" rx="8" fill="#0b0f1a" stroke="#38bdf8"/>
  <text x="790" y="348" font-size="13" fill="#e8ecf4" text-anchor="middle">H · 测试</text>
  <text x="790" y="368" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Test</text>
  <path d="M790,382 L790,402" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- I Launch -->
  <rect x="700" y="404" width="180" height="56" rx="8" fill="#0b0f1a" stroke="#38bdf8"/>
  <text x="790" y="426" font-size="13" fill="#e8ecf4" text-anchor="middle">I · 发射</text>
  <text x="790" y="446" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Launch</text>
  <path d="M790,460 L790,480" stroke="#8B7355" stroke-width="2" marker-end="url(#arw)"/>
  <!-- J Recovery -->
  <rect x="700" y="482" width="180" height="56" rx="8" fill="#0b0f1a" stroke="#818cf8"/>
  <text x="790" y="504" font-size="13" fill="#e8ecf4" text-anchor="middle">J · 回收</text>
  <text x="790" y="524" font-size="11.5" fill="#e8ecf4" text-anchor="middle">Recovery</text>
  <!-- J -> G loop (right side curve) -->
  <path d="M880,510 C 950,510 950,276 880,276" stroke="#8B7355" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="958" y="395" font-size="11.5" fill="#6B6255" text-anchor="middle" transform="rotate(90 958 395)">回收后重返设计迭代</text>

  <text x="500" y="608" font-size="10.5" fill="#8A8578" text-anchor="middle">左：多用户排队；右：自主全链条 + 回收周转（J→G），支撑日发射 30 次目标</text>
<text x="98%" y="98%" text-anchor="end" font-size="11" fill="#6B6255" font-family="serif" opacity="0.75">松朗制图</text>
</svg>
