@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  text-decoration: none;
}

:root {
  color-scheme: light;
  --font-sans: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-display: "Space Grotesk", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  --ink-1: #141414;
  --ink-2: #3d3d3d;
  --ink-3: #6b6f76;
  --paper-1: #f7f3ee;
  --paper-2: #efe9e2;
  --paper-3: #e6dfd6;

  --accent-1: #e04e39;
  --accent-2: #f28f3b;
  --accent-3: rgba(224, 78, 57, 0.18);
  --accent-strong: rgba(224, 78, 57, 0.35);
  --teal: #1f8a7a;
  --blue-accent: #3b82f6;

  --glass: rgba(255, 255, 255, 0.78);
  --glass-strong: rgba(255, 255, 255, 0.92);
  --surface: rgba(255, 255, 255, 0.56);
  --border: rgba(20, 20, 20, 0.1);
  --border-strong: rgba(20, 20, 20, 0.18);

  --shadow-sm: 0 10px 24px rgba(18, 18, 18, 0.08);
  --shadow-md: 0 24px 50px rgba(18, 18, 18, 0.14);
  --shadow-xl: 0 40px 80px rgba(18, 18, 18, 0.2);

  --radius-xl: 24px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --control-h: 34px;

  --space-1: 8px;
  --space-2: 12px;
  --space-3: 16px;
  --space-4: 20px;
  --space-5: 24px;
  --space-6: 32px;

  --scroll-thumb: rgba(122, 115, 104, 0.5);
  --scroll-thumb-hover: rgba(122, 115, 104, 0.75);
}

body.dark-theme {
  color-scheme: dark;
  --ink-1: #f7f4f0;
  --ink-2: #d2cbc4;
  --ink-3: #a9a39c;
  --paper-1: #0f1317;
  --paper-2: #141a20;
  --paper-3: #1a2128;

  --accent-1: #ff6b4a;
  --accent-2: #f7a348;
  --accent-3: rgba(255, 107, 74, 0.2);
  --accent-strong: rgba(255, 107, 74, 0.4);
  --teal: #3ad8c1;
  --blue-accent: #60a5fa;

  --glass: rgba(20, 26, 32, 0.88);
  --glass-strong: rgba(20, 26, 32, 0.96);
  --surface: rgba(20, 26, 32, 0.55);
  --border: rgba(247, 244, 240, 0.12);
  --border-strong: rgba(247, 244, 240, 0.2);

  --shadow-sm: 0 12px 28px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 28px 60px rgba(0, 0, 0, 0.45);
  --shadow-xl: 0 46px 90px rgba(0, 0, 0, 0.52);

  --scroll-thumb: rgba(166, 159, 150, 0.42);
  --scroll-thumb-hover: rgba(200, 193, 184, 0.7);
}

html,
body {
  height: 100%;
}

body {
  font-family: var(--font-sans);
  min-height: 100dvh;
  height: 100dvh;
  overflow: hidden;
  color: var(--ink-1);
  line-height: 1.5;
  letter-spacing: -0.01em;
  background:
    radial-gradient(circle at 12% 8%, rgba(224, 78, 57, 0.14), transparent 40%),
    radial-gradient(circle at 88% 12%, rgba(31, 138, 122, 0.18), transparent 45%),
    linear-gradient(180deg, var(--paper-1) 0%, var(--paper-2) 100%);
  background-color: var(--paper-1);
  transition: background-color 0.35s ease, color 0.35s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

button,
select,
input,
textarea {
  font-family: inherit;
}

button:focus-visible,
select:focus-visible,
a:focus-visible,
.unit-item:focus-visible,
.lyric-line:focus-visible {
  outline: 2px solid var(--accent-1);
  outline-offset: 2px;
}

img {
  display: block;
  max-width: 100%;
}

#app {
  max-width: 1440px;
  margin: 0 auto;
  min-height: 100dvh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
    calc(8px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: 68px;
  padding: 12px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-strong);
  background: var(--glass-strong);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  animation: riseIn 0.5s ease both;
  flex-shrink: 0;
}

.header-content {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-logo {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
}

.header-title-group {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.app-header h1 {
  font-family: var(--font-display);
  font-size: clamp(24px, 2.6vw, 32px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.15;
}

.subtitle {
  color: var(--ink-3);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-family: var(--font-mono);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--paper-3);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
}

.status-pill:hover {
  border-color: var(--accent-1);
  color: var(--ink-1);
  background: var(--accent-3);
}

.theme-toggle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--paper-3);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  position: relative;
  flex-shrink: 0;
}

.theme-toggle:hover {
  background: var(--accent-3);
  border-color: var(--accent-1);
  transform: translateY(-1px);
}

.theme-toggle:active {
  transform: scale(0.95);
}

.theme-toggle svg {
  position: absolute;
  color: var(--ink-1);
  transition: opacity 0.28s ease, transform 0.28s ease;
}

.sun-icon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

.moon-icon {
  opacity: 0;
  transform: rotate(180deg) scale(0.5);
}

body.dark-theme .sun-icon {
  opacity: 0;
  transform: rotate(-180deg) scale(0.5);
}

body.dark-theme .moon-icon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

.container {
  display: grid;
  grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  gap: 12px;
  align-items: stretch;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

.unit-list {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  animation: riseIn 0.5s ease both;
  animation-delay: 0.04s;
}

.desktop-only {
  display: flex;
}

.unit-list h2 {
  color: var(--ink-3);
  margin: 0;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  border-bottom: 1px solid var(--border);
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  flex-shrink: 0;
}

#unitListContainer {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
  padding: 8px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
}

.unit-item {
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  background: transparent;
  cursor: pointer;
  transition: background-color 0.18s ease, border-color 0.18s ease;
  min-width: 0;
  border: 1px solid transparent;
}

.unit-item:hover {
  background: rgba(224, 78, 57, 0.08);
}

.unit-item.active {
  background: var(--accent-3);
  border-color: var(--accent-strong);
}

.unit-item h3 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
  color: var(--ink-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unit-item.active h3 {
  color: var(--accent-1);
}

.player-column {
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
}

.player-section {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  animation: riseIn 0.5s ease both;
  animation-delay: 0.06s;
}

.book-info {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  width: 100%;
  height: 64px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.book-cover-wrap {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background:
    linear-gradient(180deg, rgba(224, 78, 57, 0.12), transparent 70%),
    var(--paper-3);
  flex-shrink: 0;
  overflow: hidden;
}

.book-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.book-cover:not([src]) {
  display: none;
}

.book-meta {
  flex: 1;
  min-width: 0;
}

.book-name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-hint {
  margin-top: 1px;
  color: var(--ink-3);
  font-size: 11px;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-height: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-select-wrap,
.unit-select-wrap {
  display: flex;
  align-items: center;
  min-width: 0;
}

.book-select-wrap {
  flex: 0 1 240px;
  gap: 6px;
  margin-left: auto;
  padding: 2px 4px 2px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--paper-2);
}

.select-label {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: var(--font-mono);
  color: var(--ink-3);
}

.unit-select-wrap {
  flex: 1 1 auto;
}

.control-panel {
  margin: 6px 8px 0;
  padding: 6px 8px 8px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  flex-shrink: 0;
}

.navigation-buttons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-btn,
.loop-toggle-btn,
.toggle-translation-btn,
.speed-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--control-h);
  border: 1px solid var(--border);
  background: var(--paper-3);
  color: var(--ink-2);
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
}

.nav-btn,
.loop-toggle-btn,
.toggle-translation-btn {
  width: var(--control-h);
  min-width: var(--control-h);
  padding: 0;
  border-radius: var(--radius-sm);
}

.nav-btn:hover,
.loop-toggle-btn:hover,
.toggle-translation-btn:hover,
.speed-btn:hover {
  background: var(--accent-3);
  border-color: var(--accent-1);
  color: var(--accent-1);
  transform: translateY(-1px);
}

.nav-btn:active,
.loop-toggle-btn:active,
.toggle-translation-btn:active,
.speed-btn:active {
  transform: scale(0.96);
}

.nav-btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
  transform: none;
  background: var(--paper-2);
  color: var(--ink-3);
}

.unit-select,
.book-select {
  height: var(--control-h);
  padding: 0 34px 0 10px;
  background-color: var(--paper-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-1);
  outline: none;
  transition: border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
  cursor: pointer;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23636f76' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
}

.book-select {
  width: 100%;
  min-width: 0;
  border: none;
}

.unit-select {
  width: 100%;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unit-select:hover,
.unit-select:focus,
.book-select:hover,
.book-select:focus {
  border-color: var(--accent-1);
}

.unit-select:focus,
.book-select-wrap:focus-within {
  box-shadow: 0 0 0 3px var(--accent-3);
}

.book-select:focus {
  border-color: transparent;
  box-shadow: none;
}

.audio-player {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

#audioPlayer {
  display: none;
}

.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-1);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  flex-shrink: 0;
  position: relative;
  box-shadow: 0 10px 20px var(--accent-strong);
}

.play-btn:disabled {
  background: #b8bec8;
  box-shadow: none;
  cursor: not-allowed;
  opacity: 0.75;
  transform: none;
}

body.dark-theme .play-btn:disabled {
  background: #4b5563;
}

.play-btn:hover {
  background: var(--accent-2);
  transform: translateY(-1px);
}

.play-btn:disabled:hover,
.play-btn:disabled:active {
  background: #b8bec8;
  transform: none;
}

.play-btn:active {
  transform: scale(0.95);
}

.play-btn svg {
  color: #ffffff;
  position: absolute;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.play-icon {
  opacity: 1;
  transform: scale(1);
}

.pause-icon {
  opacity: 0;
  transform: scale(0.5);
}

.play-btn.playing .play-icon {
  opacity: 0;
  transform: scale(0.5);
}

.play-btn.playing .pause-icon {
  opacity: 1;
  transform: scale(1);
}

.progress-container {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.time-display {
  flex-shrink: 0;
  min-width: 2.4em;
  font-size: 12px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  white-space: nowrap;
}

#currentTime {
  text-align: right;
}

#duration {
  text-align: left;
}

.progress-bar {
  --progress: 0%;
  position: relative;
  flex: 1;
  min-width: 0;
  height: 6px;
  background: rgba(120, 110, 100, 0.24);
  border-radius: 999px;
  cursor: grab;
  transition: height 0.2s ease, box-shadow 0.2s ease;
}

.progress-bar:hover {
  height: 8px;
}

.progress-bar.dragging {
  height: 10px;
  cursor: grabbing;
  box-shadow: 0 0 0 6px rgba(120, 110, 100, 0.16);
}

.progress-fill {
  position: absolute;
  inset: 0;
  width: var(--progress);
  background: linear-gradient(90deg, var(--accent-1) 0%, var(--accent-2) 100%);
  border-radius: inherit;
  transition: width 0.1s ease;
  pointer-events: none;
}

.progress-handle {
  position: absolute;
  top: 50%;
  left: var(--progress);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid var(--accent-2);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}

.progress-bar:hover .progress-handle,
.progress-bar.dragging .progress-handle {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.speed-btn {
  width: 52px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 650;
  color: var(--ink-1);
  font-family: var(--font-mono);
}

.speed-btn.active {
  background: var(--accent-1);
  color: #ffffff;
  border-color: var(--accent-1);
  box-shadow: 0 8px 16px var(--accent-strong);
}

.loop-toggle-btn.list {
  background: var(--accent-1);
  border-color: var(--accent-1);
  color: #ffffff;

/* Toast 提示 */
.toast {
  position: fixed;
  left: 50%;
  bottom: 72px;
  transform: translate(-50%, 12px);
  z-index: 1000;
  max-width: min(88vw, 420px);
  padding: 9px 18px;
  border-radius: 999px;
  background: var(--glass-strong);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-md);
  color: var(--ink-1);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}

.toast::before {
  content: '';
  display: inline-block;
}

.toast[data-type='success'] {
  color: var(--teal);
  border-color: var(--teal);
}

.toast[data-type='success']::before {
  content: '✓';
  margin-right: 6px;
  font-weight: 700;
}

.toast[data-type='warning'] {
  color: var(--accent-2);
  border-color: var(--accent-2);
}

.toast[data-type='warning']::before {
  content: '!';
  margin-right: 6px;
  font-weight: 700;
}

.toast[data-type='error'] {
  color: var(--accent-1);
  border-color: var(--accent-1);
}

.toast[data-type='error']::before {
  content: '✕';
  margin-right: 6px;
  font-weight: 700;
}

@media (max-width: 640px) {
  .toast {
    bottom: 56px;
    font-size: 13px;
    padding: 8px 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ==== js/utils/escape.js ==== */
/**
 * HTML 转义，避免把课本/歌词文本当 markup 插入。
 * @param {*} value
 * @returns {string}
 */
function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


/* ==== js/utils/dom.js ==== */
/**
 * DOM 快捷操作
 * @module utils/dom
 */

const qs = (selector, root = document) => root.querySelector(selector);

const qsa = (selector, root = document) => Array.from(root.querySelectorAll(selector));

const addClass = (el, className) => el?.classList?.add(className);

const removeClass = (el, className) => el?.classList?.remove(className);

const toggleClass = (el, className, force) => el?.classList?.toggle(className, force);

const setText = (el, text) => {
  if (el) el.textContent = text;
};

const setHTML = (el, html) => {
  if (el) el.innerHTML = html;
};

const on = (el, event, handler, options) => {
  el?.addEventListener(event, handler, options);
};

const off = (el, event, handler, options) => {
  el?.removeEventListener(event, handler, options);
};

const delegate = (el, event, selector, handler, options) => {
  on(el, event, (e) => {
    const target = e.target.closest(selector);
    if (target && el.contains(target)) handler.call(target, e);
  }, options);
};


/* ==== js/utils/helpers.js ==== */
/**
 * 通用工具
 * @module utils/helpers
 */

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

function throttle(func, wait = 300) {
  let lastCall = 0;
  return function throttled(...args) {
    const now = Date.now();
    if (now - lastCall >= wait) {
      lastCall = now;
      return func.apply(this, args);
    }
  };
}

function debounce(func, wait = 300) {
  let timeoutId;
  function debounced(...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      timeoutId = null;
      func.apply(this, args);
    }, wait);
  }
  debounced.cancel = () => {
    clearTimeout(timeoutId);
    timeoutId = null;
  };
  return debounced;
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}


/* ==== js/utils/storage.js ==== */
/**
 * localStorage 读写
 * @module utils/storage
 */

function getStorage(key, defaultValue = null) {
  try {
    const item = localStorage.getItem(key);
    return item !== null ? item : defaultValue;
  } catch (error) {
    console.error(`Failed to read from storage (${key}):`, error);
    return defaultValue;
  }
}

function setStorage(key, value) {
  try {
    localStorage.setItem(key, String(value));
    return true;
  } catch (error) {
    console.error(`Failed to write to storage (${key}):`, error);
    return false;
  }
}

function getPlayTime(bookKey, unitIndex) {
  const value = getStorage(`${bookKey}/${unitIndex}/playTime`);
  if (!value) return 0;
  const parsed = parseFloat(value);
  return Number.isFinite(parsed) ? parsed : 0;
}

function savePlayTime(bookKey, unitIndex, time) {
  if (!bookKey || unitIndex < 0 || !Number.isFinite(time)) return;
  setStorage(`${bookKey}/${unitIndex}/playTime`, time);
}

function getCurrentUnitIndex(bookKey) {
  const value = getStorage(`${bookKey}/currentUnitIndex`);
  if (!value) return 0;
  const parsed = parseInt(value, 10);
  return Number.isFinite(parsed) ? Math.max(0, parsed) : 0;
}

function saveCurrentUnitIndex(bookKey, index) {

/* ==== js/utils/LRCParser.js ==== */
/**
 * LRC 歌词解析：`[mm:ss.xx]英文 | 中文`
 * @module utils/LRCParser
 */

class LRCParser {
  /**
   * @param {string} lrcText
   * @param {number} [timeOffset=0]
   * @returns {Array<{time: number, english: string, chinese: string, fullText: string}>}
   */
  static parse(lrcText, timeOffset = 0) {
    if (!lrcText || typeof lrcText !== 'string') return [];

    const lyrics = [];

    for (const raw of lrcText.split('\n')) {
      const line = raw.trim();
      if (!line || line.startsWith('#')) continue;

      // 建议将正则声明在循环/函数外部，避免重复编译
      const LYRIC_TIME_REGEX = /^\[(\d{1,2}):(\d{2})\.(\d{2,3})\](.*)/;

      // 循环内部代码：
      const match = line.match(LYRIC_TIME_REGEX);
      if (!match) continue;

      const minutes = Number(match[1]);
      const seconds = Number(match[2]);
      if (seconds >= 60) continue; // 校验秒数范围

      // 将 2/3 位毫秒统一转化为秒（例："4"->0.4s, "45"->0.45s, "456"->0.456s）
      const fraction = Number(`0.${match[3]}`);
      const rawTime = minutes * 60 + seconds + fraction - timeOffset;
      const time = Math.round(rawTime * 1000) / 1000;  // 保留三位小数，避免浮点数精度问题
      
      const text = match[4].trim(); // 提取后的歌词内容

      const [english = '', chinese = ''] = text.split('|').map((part) => part.trim());

      if (!english) continue;

      lyrics.push({ time, english, chinese, fullText: text });
    }

    return lyrics.sort((a, b) => a.time - b.time);
  }

  /**
   * @param {Array<{time: number}>} lyrics
   * @param {number} currentTime
   * @returns {number}
   */
  static findLyricIndexByTime(lyrics, currentTime) {
    if (!Array.isArray(lyrics) || lyrics.length === 0) return -1;

    for (let i = lyrics.length - 1; i >= 0; i--) {
      if (currentTime >= lyrics[i].time) return i;
    }
    return -1;
  }

  /**
   * @param {Array<{time: number}>} lyrics
   * @param {number} index
   * @param {number} [audioDuration=0]
   * @returns {{startTime: number, endTime: number, index: number}|null}
   */
  static getSentenceBoundaries(lyrics, index, audioDuration = 0) {
    if (!Array.isArray(lyrics) || index < 0 || index >= lyrics.length) return null;

    const startTime = lyrics[index].time;
    const endTime = index < lyrics.length - 1
      ? lyrics[index + 1].time
      : Math.max(audioDuration, startTime + 0.1);

    return { startTime, endTime, index };
  }
}


/* ==== js/managers/CacheManager.js ==== */
/**
 * 有容量上限的 LRU 缓存。Map 的插入顺序即访问顺序。
 * @module managers/CacheManager
 */

class CacheManager {
  /**
   * @param {number} [maxSize=10]
   * @param {(value: *, key: string) => void} [onEvict]
   */
  constructor(maxSize = 10, onEvict) {
    this.maxSize = Math.max(1, maxSize);
    this.cache = new Map();
    this.onEvict = typeof onEvict === 'function' ? onEvict : null;
  }

  get(key) {
    if (!this.cache.has(key)) return undefined;
    const value = this.cache.get(key);
    this.cache.delete(key);
    this.cache.set(key, value);
    return value;
  }

  set(key, value) {
    if (this.cache.has(key)) {
      this.cache.delete(key);
    }
    this.cache.set(key, value);
    this.#trim();
  }

  has(key) {
    return this.cache.has(key);
  }

  delete(key) {
    if (!this.cache.has(key)) return false;
    const value = this.cache.get(key);
    this.cache.delete(key);
    this.onEvict?.(value, key);
    return true;
  }

  clear() {
    if (this.onEvict) {
      for (const [key, value] of this.cache) {
        this.onEvict(value, key);
      }
    }
    this.cache.clear();
  }

  size() {
    return this.cache.size;
  }

  #trim() {
    while (this.cache.size > this.maxSize) {
      const oldest = this.cache.keys().next().value;
      const value = this.cache.get(oldest);
      this.cache.delete(oldest);
      this.onEvict?.(value, oldest);
    }
  }
}

/* ==== js/player/AudioController.js ==== */
/**
 * HTMLAudioElement 封装：播放、进度条、倍速、时长恢复
 * @module player/AudioController
 */


class AudioController {
  /**
   * @param {Object} options
   * @param {HTMLAudioElement} options.audio
   * @param {HTMLElement} [options.playBtn]
   * @param {HTMLElement} [options.progressBar]
   * @param {HTMLElement} [options.currentTimeEl]
   * @param {HTMLElement} [options.durationEl]
   * @param {(currentTime: number, duration: number) => void} [options.onTick]
   * @param {(currentTime: number) => void} [options.onPersist]
   * @param {() => void} [options.onEnded]
   * @param {() => void} [options.onLoaded] 音频加载完成（元数据就绪）后触发
   */
  constructor(options) {
    this.audio = options.audio;
    this.playBtn = options.playBtn;
    this.progressBar = options.progressBar;
    this.currentTimeEl = options.currentTimeEl;
    this.durationEl = options.durationEl;
    this.onTick = options.onTick;
    this.onPersist = options.onPersist;
    this.onEnded = options.onEnded;
    this.onLoaded = options.onLoaded;

    this.dragging = false;
    this.pendingTime = 0;
    this.rate = 1;
    this.abort = new AbortController();

    this.#bind();
  }

  get currentTime() {
    return this.audio?.currentTime ?? 0;
  }

  get duration() {
    return this.audio?.duration ?? 0;
  }

  get paused() {
    return this.audio?.paused ?? true;
  }

  /**
   * @param {string} url
   * @param {{loop?: boolean, playbackRate?: number, startTime?: number}} [options]
   */
  setSrc(url, options = {}) {
    if (!this.audio) return;

    const rate = Number.isFinite(options.playbackRate) ? options.playbackRate : this.rate;
    this.rate = rate;

    this.audio.pause();
    // 换源时浏览器会把 playbackRate 重置为 defaultPlaybackRate，需同步默认值
    this.audio.defaultPlaybackRate = rate;
    this.audio.src = url;
    this.audio.loop = Boolean(options.loop);
    this.#applyRate(rate);
    this.pendingTime = Number.isFinite(options.startTime) ? options.startTime : 0;
    this.setDisabled(true);
    this.setProgress(0);
    this.audio.load();
    // load() 会同步重置倍速，这里补一次
    this.#applyRate(rate);
  }

  setLoop(enabled) {
    if (this.audio) this.audio.loop = Boolean(enabled);
  }

  setRate(rate) {
    if (!Number.isFinite(rate)) return;
    this.rate = rate;
    if (!this.audio) return;
    this.audio.defaultPlaybackRate = rate;
    this.#applyRate(rate);
  }

  async play() {
    if (!this.audio) return;
    try {
      await this.audio.play();
    } catch (error) {
      if (error?.name !== 'AbortError') {
        console.warn('Audio play failed:', error);
      }
    }
  }

  pause() {
    this.audio?.pause();
  }

  toggle() {
    if (this.paused) {
      this.play();
    } else {
      this.pause();
    }
  }

  seek(time) {
    if (!this.audio || !Number.isFinite(time)) return;
    const duration = this.duration;
    const max = Number.isFinite(duration) && duration > 0 ? duration : time;
    this.audio.currentTime = clamp(time, 0, max);
    this.updateProgress(true);
  }

  reset() {
    if (!this.audio) return;
    this.audio.pause();
    this.audio.removeAttribute('src');
    this.audio.load();
    this.pendingTime = 0;
    this.setProgress(0);
    this.setDisabled(true);
    this.updatePlayButton();
    setText(this.currentTimeEl, '0:00');
    setText(this.durationEl, '0:00');
  }

  setDisabled(disabled) {
    if (!this.playBtn) return;
    this.playBtn.disabled = disabled;
    this.playBtn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
  }

  updatePlayButton() {
    if (!this.playBtn) return;
    const playing = !this.paused;
    toggleClass(this.playBtn, 'playing', playing);
    this.playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
  }

  updateProgress(force = false) {
    if (!this.audio || (this.dragging && !force)) return;
    const duration = this.duration;
    const current = this.currentTime;
    const percent = duration > 0 ? (current / duration) * 100 : 0;
    this.setProgress(percent);
    setText(this.currentTimeEl, formatTime(current));
  }

  setProgress(percent) {
    this.progressBar?.style.setProperty('--progress', `${percent}%`);
  }

  destroy() {
    this.abort.abort();
    this.reset();
  }

  #bind() {
    const signal = this.abort.signal;

    if (this.playBtn) {
      on(this.playBtn, 'click', () => this.toggle(), { signal });
    }

    if (this.progressBar) {
      const seekByClientX = (clientX) => {
        if (!this.audio || !this.duration) return;
        const rect = this.progressBar.getBoundingClientRect();
        const percent = clamp((clientX - rect.left) / rect.width, 0, 1);
        this.seek(percent * this.duration);
      };

      on(this.progressBar, 'click', (event) => seekByClientX(event.clientX), { signal });

      on(this.progressBar, 'pointerdown', (event) => {
        this.dragging = true;
        addClass(this.progressBar, 'dragging');
        this.progressBar.setPointerCapture(event.pointerId);
        seekByClientX(event.clientX);
      }, { signal, passive: true });

      on(this.progressBar, 'pointermove', (event) => {
        if (!this.dragging) return;
        seekByClientX(event.clientX);
      }, { signal, passive: true });

      const endDrag = (event) => {
        if (!this.dragging) return;
        this.dragging = false;
        removeClass(this.progressBar, 'dragging');
        if (event?.pointerId != null) {
          try {
            this.progressBar.releasePointerCapture(event.pointerId);
          } catch {
            // already released
          }
        }
        this.onPersist?.(this.currentTime);
      };

      on(this.progressBar, 'pointerup', endDrag, { signal, passive: true });
      on(this.progressBar, 'pointercancel', endDrag, { signal, passive: true });
    }

    if (!this.audio) return;

    const tick = throttle(() => {
      this.updateProgress();
      this.onTick?.(this.currentTime, this.duration);
    }, 1000 / 30);

    on(this.audio, 'timeupdate', tick, { signal });
    on(this.audio, 'loadedmetadata', () => {
      this.#applyPendingTime();
      this.setDisabled(false);
      this.onLoaded?.();
    }, { signal });
    on(this.audio, 'canplay', () => this.setDisabled(false), { signal });
    on(this.audio, 'loadstart', () => this.setDisabled(true), { signal });
    on(this.audio, 'play', () => this.updatePlayButton(), { signal });
    on(this.audio, 'pause', () => {
      this.updatePlayButton();
      this.onPersist?.(this.currentTime);
    }, { signal });
    on(this.audio, 'ended', () => {
      this.updatePlayButton();
      this.onEnded?.();
    }, { signal });
    on(this.audio, 'error', () => this.setDisabled(true), { signal });
  }

  /**
   * 写入倍速：浏览器不支持该倍速时会抛 NotSupportedError，需容错避免中断换源
   */
  #applyRate(rate) {
    if (!this.audio) return;
    try {
      this.audio.playbackRate = rate;
    } catch (error) {
      console.warn(`Failed to set playback rate ${rate}:`, error);
    }
  }

  #applyPendingTime() {
    setText(this.durationEl, formatTime(this.duration));

    if (this.pendingTime > 0 && this.duration > 0) {
      const target = Math.min(this.pendingTime, Math.max(0, this.duration - 0.05));
      if (Number.isFinite(target)) {
        this.audio.currentTime = target;
      }
      this.pendingTime = 0;
    }

    this.updateProgress();
  }
}


/* ==== js/services/BookService.js ==== */
/**
 * 课本目录与课件配置加载
 * @module services/BookService
 */

class BookService {
  /**
   * @param {string} [catalogUrl='data.json']
   */
  constructor(catalogUrl = 'data.json') {
    this.catalogUrl = catalogUrl;
    this.books = [];
  }

  /**
   * @param {AbortSignal} [signal]
   * @returns {Promise<Array>}
   */
  async loadCatalog(signal) {
    const response = await fetch(this.catalogUrl, { signal });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const data = await response.json();
    this.books = Array.isArray(data.books) ? data.books : [];
    return this.books;
  }

  /**
   * @param {string} bookKey
   * @param {string} defaultKey
   * @returns {Object|null}
   */
  resolve(bookKey, defaultKey) {
    if (!this.books.length) return null;

    const getPath = (book) => book?.path || '';

    const exact = this.books.find((book) => book?.key === bookKey && getPath(book));
    if (exact) return exact;

    const fallback = this.books.find((book) => book?.key === defaultKey && getPath(book));
    if (fallback) return fallback;

    return this.books.find((book) => getPath(book)) || null;
  }

  /**
   * @param {{key?: string, path?: string, bookPath?: string}} book
   * @param {AbortSignal} [signal]
   * @returns {Promise<{units: Array, coverUrl: string, bookName: string, bookLevel: string}>}
   */
  async loadBook(book, signal) {
    const rawPath = book.path || '';
    const bookPath = rawPath.trim().replace(/\/$/, '');
    const response = await fetch(`${bookPath}/book.json`, { signal });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const data = await response.json();
    const units = (Array.isArray(data.units) ? data.units : [])
      .filter((unit) => unit?.filename)
      .map((unit, index) => ({
        ...unit,
        id: index + 1,
        title: unit.title || `Unit ${index + 1}`,
        audio: `${bookPath}/${unit.filename}.mp3`,
        lrc: `${bookPath}/${unit.filename}.lrc`,
      }));

    return {
      units,
      coverUrl: data.cover ? `${bookPath}/${data.cover}` : '',
      bookName: data.name || book.title || '',
      bookLevel: data.level || book.key || '',
    };
  }
}


/* ==== js/services/PrefetchService.js ==== */
/**
 * 下一课歌词 / 音频预加载
 * @module services/PrefetchService
 */

function disposeAudio(audio) {
  if (!audio) return;
  try {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
  } catch {
    // ignore
  }
}

class PrefetchService {
  /**
   * @param {{maxLrc?: number, maxAudio?: number}} [options]
   */
  constructor(options = {}) {
    this.lrcCache = new CacheManager(options.maxLrc ?? 3);
    this.audioCache = new CacheManager(options.maxAudio ?? 3, disposeAudio);
  }

  /**
   * @param {string} url
   * @param {AbortSignal} [signal]
   * @returns {Promise<string>}
   */
  async loadLrc(url, signal) {
    const cached = this.lrcCache.get(url);
    if (cached !== undefined) return cached;

    const response = await fetch(url, { signal });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const text = await response.text();
    this.lrcCache.set(url, text);
    return text;
  }

  /**
   * @param {{lrc?: string, audio?: string}|null} unit
   */
  prefetch(unit) {
    if (!unit) return;

    if (unit.lrc && !this.lrcCache.has(unit.lrc)) {
      fetch(unit.lrc)
        .then((response) => (response.ok ? response.text() : Promise.reject()))
        .then((text) => this.lrcCache.set(unit.lrc, text))
        .catch(() => {});
    }

    if (unit.audio && !this.audioCache.has(unit.audio)) {
      const audio = new Audio();
      audio.preload = 'auto';
      audio.src = unit.audio;
      this.audioCache.set(unit.audio, audio);
    }
  }

  clear() {
    this.lrcCache.clear();
    this.audioCache.clear();
  }
}


/* ==== js/ui/Toast.js ==== */
/**
 * 轻量 toast 提示
 * @module ui/Toast
 */

const SHOW_CLASS = 'show';
const DEFAULT_DURATION = 2000;
const HIDE_DELAY = 300; // 与 CSS 隐藏过渡时长一致，用于过渡结束后清理

const TYPES = ['info', 'success', 'warning', 'error'];

class Toast {
  /**
   * @param {Object} [options]
   * @param {number} [options.duration=2000] 单条提示显示时长（毫秒）
   */
  constructor(options = {}) {
    this.duration = options.duration ?? DEFAULT_DURATION;
    this.timer = null;
    this.hideTimer = null;
    this.el = null;
  }

  /**
   * 显示提示；连续调用会替换当前内容并重置计时
   * @param {string} message
   * @param {Object} [options]
   * @param {'info'|'success'|'warning'|'error'} [options.type='info'] 提示类型
   * @param {number} [options.duration] 本条提示显示时长，覆盖默认值
   */
  show(message, options = {}) {
    const el = this.#ensureEl();
    const type = TYPES.includes(options.type) ? options.type : 'info';
    const duration = options.duration ?? this.duration;

    el.textContent = message;
    el.dataset.type = type;
    el.setAttribute('aria-live', 'polite');
    el.classList.add(SHOW_CLASS);

    clearTimeout(this.timer);
    clearTimeout(this.hideTimer);
    this.timer = setTimeout(() => this.hide(), duration);
  }

  /**
   * 立即隐藏当前提示
   */
  hide() {
    clearTimeout(this.timer);
    const el = this.el;
    if (!el || !el.classList.contains(SHOW_CLASS)) return;
    el.classList.remove(SHOW_CLASS);
    el.setAttribute('aria-live', 'off');
    // 过渡结束后清空文本，避免 aria-live 区域残留旧内容
    this.hideTimer = setTimeout(() => {
      if (el.classList.contains(SHOW_CLASS)) return;
      el.textContent = '';
    }, HIDE_DELAY);
  }

  destroy() {
    clearTimeout(this.timer);
    clearTimeout(this.hideTimer);
    this.timer = null;
    this.hideTimer = null;
    this.el?.remove();
    this.el = null;
  }

  #ensureEl() {
    if (this.el) return this.el;
    this.el = document.createElement('div');
    this.el.className = 'toast';
    this.el.setAttribute('role', 'status');
    this.el.setAttribute('aria-live', 'off');
    this.el.addEventListener('click', () => this.hide());
    document.body.appendChild(this.el);
    return this.el;
  }
}


/* ==== js/ui/theme.js ==== */
/**
 * 明暗主题
 * @module ui/theme
 */


const THEME_COLORS = {
  light: '#f7f3ee',
  dark: '#0f1317',
};

class ThemeManager {
  constructor(options = {}) {
    this.toggleBtn = options.toggleBtn || document.getElementById('themeToggle');
    this.prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    this.animationDuration = options.animationDuration || CONFIG.UI.THEME_ANIMATION_DURATION;
    this.currentTheme = this.#detectTheme();
  }

  init() {
    this.applyTheme(this.currentTheme);
    this.toggleBtn?.addEventListener('click', () => this.toggle());
    this.prefersDark.addEventListener('change', (event) => {
      if (getStorage(CONFIG.STORAGE_KEYS.THEME)) return;
      this.applyTheme(event.matches ? 'dark' : 'light');
    });
  }

  applyTheme(theme) {
    const isDark = theme === 'dark';
    document.body.classList.toggle('dark-theme', isDark);
    this.currentTheme = theme;
    this.#updateMetaThemeColor(isDark);
  }

  toggle() {
    const next = this.currentTheme === 'dark' ? 'light' : 'dark';
    this.applyTheme(next);
    setStorage(CONFIG.STORAGE_KEYS.THEME, next);
    this.#playToggleAnimation();
  }

  getTheme() {
    return this.currentTheme;
  }

  #detectTheme() {
    const saved = getStorage(CONFIG.STORAGE_KEYS.THEME);
    if (saved === 'light' || saved === 'dark') return saved;
    return this.prefersDark.matches ? 'dark' : 'light';
  }

  #playToggleAnimation() {
    if (!this.toggleBtn) return;
    this.toggleBtn.style.transform = 'rotate(360deg)';
    setTimeout(() => {
      this.toggleBtn.style.transform = '';
    }, this.animationDuration);
  }

  #updateMetaThemeColor(isDark) {
    const color = isDark ? THEME_COLORS.dark : THEME_COLORS.light;
    let meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      document.head.insertBefore(meta, document.head.firstChild);
    }
    meta.content = color;
  }
}


/* ==== js/ui/UnitView.js ==== */
/**
 * 课本 / 单元选择与课程列表
 * @module ui/UnitView
 */

function fillSelect(select, items, getValue, getLabel, selected) {
  if (!select) return;
  const fragment = document.createDocumentFragment();
  for (const item of items) {
    const option = document.createElement('option');
    option.value = getValue(item);
    option.textContent = getLabel(item);
    fragment.appendChild(option);
  }
  select.replaceChildren(fragment);
  if (selected !== undefined && selected !== null && selected !== '') {
    select.value = String(selected);
  }
}

class UnitView {
  /**
   * @param {Object} options
   * @param {HTMLElement} [options.unitList]
   * @param {HTMLSelectElement} [options.unitSelect]
   * @param {HTMLSelectElement[]} [options.bookSelects]
   * @param {HTMLImageElement} [options.bookCover]
   * @param {HTMLElement} [options.bookTitle]
   * @param {HTMLElement} [options.bookHint]
   * @param {HTMLElement} [options.prevBtn]
   * @param {HTMLElement} [options.nextBtn]
   * @param {(index: number) => void} [options.onUnitChange]
   * @param {(bookKey: string) => void} [options.onBookChange]
   */
  constructor(options) {
    this.unitList = options.unitList;
    this.unitSelect = options.unitSelect;
    this.bookSelects = options.bookSelects || [];
    this.bookCover = options.bookCover;
    this.bookTitle = options.bookTitle;
    this.bookHint = options.bookHint;
    this.prevBtn = options.prevBtn;
    this.nextBtn = options.nextBtn;
    this.onUnitChange = options.onUnitChange;
    this.onBookChange = options.onBookChange;
    this.abort = new AbortController();
    this.#bind();
  }

  /**
   * @param {Array<{key: string, title: string, bookPath: string}>} books
   * @param {string} selectedKey
   */
  renderBooks(books, selectedKey) {
    const valid = books.filter((book) => book?.key && book?.title && (book?.path || book?.bookPath));
    this.bookSelects.forEach((select) => {
      fillSelect(select, valid, (book) => book.key, (book) => book.title, selectedKey);
    });
  }

  /**
   * @param {Array<{title: string}>} units
   */
  renderUnits(units) {
    if (this.unitList) {
      const items = units.map((unit, index) => {
        const title = document.createElement('h3');
        title.textContent = unit.title;
        const item = document.createElement('div');
        item.className = 'unit-item';
        item.dataset.unitIndex = String(index);
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `打开 ${unit.title}`);
        item.appendChild(title);
        return item;
      });
      this.unitList.replaceChildren(...items);
    }

    fillSelect(
      this.unitSelect,
      units.map((unit, index) => ({ unit, index })),
      (item) => String(item.index),
      (item) => item.unit.title,
    );
  }

  /**
   * @param {string} coverUrl
   */
  setCover(coverUrl) {
    if (!this.bookCover) return;
    if (coverUrl) {
      this.bookCover.src = coverUrl;
    } else {
      this.bookCover.removeAttribute('src');
    }
  }

  /**
   * @param {{title?: string, key?: string, bookName?: string, bookLevel?: string}|null} book
   */
  setBookMeta(book) {
    if (this.bookTitle) {
      this.bookTitle.textContent = book?.bookName || book?.title || '选择课本';
    }
    if (this.bookHint) {
      this.bookHint.textContent = book?.bookLevel || book?.key || '';
    }
  }

  /**
   * @param {number} unitIndex
   * @param {{scroll?: boolean}} [options]
   */
  setActive(unitIndex, options = {}) {
    if (this.unitList) {
      qsa('.unit-item', this.unitList).forEach((item, index) => {
        toggleClass(item, 'active', index === unitIndex);
      });
      if (options.scroll) {
        const active = qs(`.unit-item[data-unit-index="${unitIndex}"]`, this.unitList);
        active?.scrollIntoView({ block: 'center', inline: 'nearest' });
      }
    }

    if (this.unitSelect && unitIndex >= 0) {
      this.unitSelect.value = String(unitIndex);
    }
  }

  /**
   * @param {number} currentIndex
   * @param {number} total
   */
  updateNav(currentIndex, total) {
    if (this.prevBtn) this.prevBtn.disabled = currentIndex <= 0;
    if (this.nextBtn) this.nextBtn.disabled = currentIndex >= total - 1;
  }

  resetListScroll() {
    const scroller = this.unitList?.closest('.unit-list');
    if (scroller) scroller.scrollTop = 0;
  }

  clearUnits() {
    if (this.unitList) setHTML(this.unitList, '');
    if (this.unitSelect) setHTML(this.unitSelect, '<option value="">选择 Unit</option>');
    this.resetListScroll();
  }

  destroy() {
    this.abort.abort();
  }

  #bind() {
    const signal = this.abort.signal;

    const pickUnit = (event) => {
      const item = event.target.closest('.unit-item');
      if (!item) return;
      const index = parseInt(item.dataset.unitIndex, 10);
      if (Number.isFinite(index)) this.onUnitChange?.(index);
    };

    if (this.unitList) {
      on(this.unitList, 'click', pickUnit, { signal });
      on(this.unitList, 'keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        pickUnit(event);
      }, { signal });
    }

    if (this.unitSelect) {
      on(this.unitSelect, 'change', (event) => {
        const index = parseInt(event.target.value, 10);
        if (index >= 0) this.onUnitChange?.(index);
      }, { signal });
    }

    this.bookSelects.forEach((select) => {
      on(select, 'change', (event) => {
        if (event.target.value) this.onBookChange?.(event.target.value);
      }, { signal });
    });

    if (this.prevBtn) {
      on(this.prevBtn, 'click', () => this.onUnitChange?.('prev'), { signal });
    }
    if (this.nextBtn) {
      on(this.nextBtn, 'click', () => this.onUnitChange?.('next'), { signal });
    }
  }
}


/* ==== js/ui/LyricsView.js ==== */
/**
 * 歌词列表渲染、高亮与点读
 * @module ui/LyricsView
 */


const MODE_CLASS = {
  english: 'english-translation',
  chinese: 'chinese-translation',
  blur: 'blur-translation',
};

class LyricsView {
  /**
   * @param {Object} options
   * @param {HTMLElement} options.display
   * @param {HTMLElement} [options.container]
   * @param {number} [options.scrollThreshold=0.22]
   * @param {(index: number, time: number) => void} [options.onActivate]
   */
  constructor(options) {
    this.display = options.display;
    this.container = options.container;
    this.scrollThreshold = options.scrollThreshold ?? 0.22;
    this.onActivate = options.onActivate;
    this.lineEls = [];
    this.activeIndex = -1;
    this.abort = new AbortController();
    this.#bind();
  }

  /**
   * @param {Array<{time: number, english: string, chinese?: string}>} lyrics
   */
  render(lyrics) {
    if (!this.display) return;

    if (this.container) this.container.scrollTop = 0;
    this.activeIndex = -1;

    if (!lyrics.length) {
      this.setEmpty('没有歌词数据');
      return;
    }

    const html = lyrics
      .map((lyric, index) => {
        const chinese = lyric.chinese
          ? `<div class="lyric-translation">${escapeHtml(lyric.chinese)}</div>`
          : '';
        return `<div class="lyric-line" data-index="${index}" data-time="${lyric.time}" tabindex="0" role="button" aria-label="播放第 ${index + 1} 句">
            <div class="lyric-text">${escapeHtml(lyric.english)}</div>
            ${chinese}
          </div>`;
      })
      .join('');

    setHTML(this.display, html);
    this.lineEls = qsa('.lyric-line', this.display);
  }

  setEmpty(message) {
    if (!this.display) return;
    this.lineEls = [];
    this.activeIndex = -1;
    setHTML(this.display, `<p class="placeholder">${escapeHtml(message)}</p>`);
  }

  /**
   * @param {number} index
   */
  highlight(index) {
    if (index === this.activeIndex) return;

    if (this.activeIndex >= 0) {
      removeClass(this.lineEls[this.activeIndex], 'active');
    }

    if (index >= 0) {
      const line = this.lineEls[index];
      if (line) {
        addClass(line, 'active');
        if (this.#shouldScroll(line)) {
          line.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    this.activeIndex = index;
  }

  /**
   * @param {string} mode
   * @param {HTMLElement} [toggleBtn]
   */
  applyTranslationMode(mode, toggleBtn) {
    const body = document.body;
    body.classList.toggle(MODE_CLASS.english, mode === 'english');
    body.classList.toggle(MODE_CLASS.chinese, mode === 'chinese');
    body.classList.toggle(MODE_CLASS.blur, mode === 'blur');

    if (!toggleBtn) return;

    const labels = {
      show: { text: '双', pressed: 'true', label: '显示双语' },
      blur: { text: '糊', pressed: 'mixed', label: '模糊翻译' },
      english: { text: '英', pressed: 'false', label: '仅显示英文' },
      chinese: { text: '中', pressed: 'true', label: '仅显示中文' },
    };
    const ui = labels[mode] || labels.show;
    toggleBtn.textContent = ui.text;
    toggleBtn.setAttribute('aria-pressed', ui.pressed);
    toggleBtn.setAttribute('aria-label', ui.label);
  }

  destroy() {
    this.abort.abort();
    this.lineEls = [];
  }

  #bind() {
    if (!this.display) return;
    const signal = this.abort.signal;

    const activate = (event) => {
      const line = event.target.closest('.lyric-line');
      if (!line) return;
      const index = parseInt(line.dataset.index, 10);
      const time = parseFloat(line.dataset.time);
      if (!Number.isFinite(index) || !Number.isFinite(time)) return;
      this.onActivate?.(index, time);
    };

    delegate(this.display, 'click', '.lyric-line', activate, { signal });
    delegate(this.display, 'keydown', '.lyric-line', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      activate(event);
    }, { signal });
  }

  #shouldScroll(line) {
    if (!this.container) return true;
    const containerRect = this.container.getBoundingClientRect();
    const lineRect = line.getBoundingClientRect();
    const pad = containerRect.height * this.scrollThreshold;
    return lineRect.top < containerRect.top + pad || lineRect.bottom > containerRect.bottom - pad;
  }
}


/* ==== js/ui/modal.js ==== */
/**
 * 打赏弹窗（可配置，读 sponsor.json 渲染多方式 Tab）
 * @module ui/modal
 */

class SupportModal {
  constructor(options = {}) {
    this.modal = options.modal || document.getElementById('supportModal');
    this.openBtn = options.openBtn || document.getElementById('supportBtn');
    this.closeBtn = options.closeBtn || document.getElementById('supportCloseBtn');
    this.sponsorConfig = options.sponsorConfig || 'sponsor.json';
    this.isOpen = false;
    this.animationDuration = options.animationDuration || CONFIG.UI.MODAL_ANIMATION_DURATION;
    this.tabsEl = document.getElementById('sponsorTabs');
    this.panelsEl = document.getElementById('sponsorPanels');
    this.data = null;
  }

  init() {
    if (!this.modal || !this.openBtn || !this.closeBtn) return;

    this.openBtn.addEventListener('click', () => this.open());
    this.closeBtn.addEventListener('click', () => this.close());
    this.modal.addEventListener('click', (event) => {
      if (event.target === this.modal) this.close();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && this.isOpen) this.close();
    });

    this.loadSponsor();
  }

  async loadSponsor() {
    try {
      const resp = await fetch(this.sponsorConfig);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      this.data = await resp.json();
      this.render();
    } catch (e) {
      // 配置缺失时的兜底：保留默认两张图（占位）
      console.warn('打赏配置加载失败，使用默认', e);
      this.data = {
        note: '如果内容有帮助过您，欢迎自愿支持（可选）。',
        thanks: '感谢您的认可与善意，祝您一切顺利！',
        methods: [
          { id: 'wechat', label: '微信', type: 'qr', image: 'sponsor-wechat.jpg', desc: '微信收款码' },
          { id: 'alipay', label: '支付宝', type: 'qr', image: 'sponsor-alipay.jpg', desc: '支付宝收款码' },
        ],
      };
      this.render();
    }
  }

  render() {
    if (!this.data || !this.data.methods || !this.data.methods.length) return;
    const methods = this.data.methods;
    if (this.tabsEl) {
      this.tabsEl.innerHTML = '';
      methods.forEach((m, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sponsor-tab' + (i === 0 ? ' active' : '');
        b.textContent = m.label;
        b.dataset.tab = m.id;
        b.addEventListener('click', () => this.switchTab(m.id));
        this.tabsEl.appendChild(b);
      });
    }
    if (this.panelsEl) {
      this.panelsEl.innerHTML = '';
      methods.forEach((m, i) => {
        const p = document.createElement('div');
        p.className = 'sponsor-panel' + (i === 0 ? ' active' : '');
        p.dataset.panel = m.id;
        p.innerHTML = this.buildPanel(m);
        this.panelsEl.appendChild(p);
      });
    }
    this.switchTab(methods[0].id);
  }

  buildPanel(m) {
    // 支持 qr(图) / link(按钮跳转) 两种
    if (m.type === 'link') {
      return `<a class="sponsor-link" href="${m.href || '#'}" target="_blank" rel="noopener noreferrer">${m.label || '打开支持页'} →</a>`;
    }
    // qr：图 + 说明
    return `<img class="sponsor-qr" src="${m.image}" alt="${m.label || '收款码'}" loading="lazy"/>`
      + (m.desc ? `<p class="sponsor-desc">${m.desc}</p>` : '');
  }

  switchTab(id) {
    document.querySelectorAll('.sponsor-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === id));
    document.querySelectorAll('.sponsor-panel').forEach((p) => p.classList.toggle('active', p.dataset.panel === id));
  }

  open() {
    if (!this.modal || this.isOpen) return;
    this.modal.classList.add('open');
    this.modal.setAttribute('aria-hidden', 'false');
    this.isOpen = true;
    this.closeBtn?.focus();
  }

  close() {
    if (!this.modal || !this.isOpen) return;
    this.modal.classList.remove('open');
    this.modal.setAttribute('aria-hidden', 'true');
    this.isOpen = false;
    this.openBtn?.focus();
  }
}


/* ==== js/ReadingSystem.js ==== */
/**
 * 阅读系统协调器：课本、单元、歌词、播放与偏好
 * @module ReadingSystem
 */











const LOOP_MODE_LABELS = {
  off: '关闭循环',
  click: '单句点读',
  one: '单句循环',
  list: '本课循环',
  book: '本书循环',
};

const TRANSLATION_LABELS = {
  show: '显示双语',
  english: '仅显示英文',
  chinese: '仅显示中文',
  blur: '模糊翻译',
};

class ReadingSystem {
  constructor() {
    this.config = CONFIG;
    this.state = createInitialState();
    this.bookService = new BookService();
    this.prefetch = new PrefetchService({
      maxLrc: CONFIG.PLAYER.MAX_LRC_CACHE,
      maxAudio: CONFIG.PLAYER.MAX_AUDIO_CACHE,
    });

    this.bookAbort = null;
    this.unitAbort = null;
    this.unitLoadId = 0;
    this.ready = false;
    this.persistProgress = debounce(() => this.#saveProgress(), 1500);

    this.player = new AudioController({
      audio: qs('#audioPlayer'),
      playBtn: qs('#playPauseBtn'),
      progressBar: qs('#progressBar'),
      currentTimeEl: qs('#currentTime'),
      durationEl: qs('#duration'),
      onTick: (currentTime, duration) => this.#onAudioTick(currentTime, duration),
      onPersist: () => this.#saveProgress(),
      onEnded: () => this.#onAudioEnded(),
      onLoaded: () => this.toast.show('音频已加载', { type: 'success' }),
    });

    this.lyricsView = new LyricsView({
      display: qs('#lyricsDisplay'),
      container: qs('.lyrics-container'),
      scrollThreshold: CONFIG.UI.LYRIC_SCROLL_THRESHOLD,
      onActivate: (index, time) => this.#onLyricActivate(index, time),
    });

    this.unitView = new UnitView({
      unitList: qs('#unitListContainer'),
      unitSelect: qs('#unitSelect'),
      bookSelects: qsa('.book-select'),
      bookCover: qs('#bookCover'),
      bookTitle: qs('#bookTitle'),
      bookHint: qs('#bookHint'),
      prevBtn: qs('#prevUnitBtn'),
      nextBtn: qs('#nextUnitBtn'),
      onUnitChange: (value) => this.#onUnitNavigate(value),
      onBookChange: (bookKey) => this.#onBookSelect(bookKey),
    });

    this.speedSelect = qs('#speedSelect');
    this.loopToggleBtn = qs('#loopToggleBtn');
    this.toggleTranslationBtn = qs('#toggleTranslationBtn');

    this.toast = new Toast();

    this.abort = new AbortController();
    this.#bindChrome();
    this.init();
  }

  async init() {
    try {
      this.#restorePreferences();
      this.state.books = await this.bookService.loadCatalog();
      await this.applyBookFromHash();
      await this.loadUnitFromStorage();
    } catch (error) {
      if (error?.name === 'AbortError') return;
      console.error('Failed to initialize ReadingSystem:', error);
      this.lyricsView.setEmpty(this.config.ERROR_MESSAGES.LOAD_BOOKS);
    }
  }

  async applyBookFromHash() {
    const keyFromHash = location.hash.slice(1).trim();
    const storedBookKey = getStorage(this.config.STORAGE_KEYS.BOOK_SELECTION);
    const initialBookKey = keyFromHash || storedBookKey || this.config.DEFAULT_BOOK_KEY;
    await this.applyBookChange(initialBookKey);
  }

  async applyBookChange(bookKey) {
    this.bookAbort?.abort();
    this.unitAbort?.abort();
    this.unitLoadId += 1;
    this.bookAbort = new AbortController();
    const { signal } = this.bookAbort;

    if (!this.state.books.length) {
      this.state.books = await this.bookService.loadCatalog(signal);
    }

    const resolved = this.bookService.resolve(bookKey, this.config.DEFAULT_BOOK_KEY);
    const resolvedPath = resolved?.path || resolved?.bookPath;
    if (!resolvedPath) {
      this.state.bookPath = '';
      this.state.bookKey = '';
      this.state.units = [];
      this.unitView.clearUnits();
      this.unitView.setBookMeta(null);
      this.lyricsView.setEmpty(this.config.ERROR_MESSAGES.NO_DATA);
      return;
    }

    this.state.bookKey = resolved.key || bookKey;
    this.state.bookPath = resolvedPath.trim().replace(/\/$/, '');
    setStorage(this.config.STORAGE_KEYS.BOOK_SELECTION, this.state.bookKey);
    this.unitView.renderBooks(this.state.books, this.state.bookKey);
    this.unitView.setBookMeta(resolved);

    this.persistProgress.cancel();
    this.#saveProgress();
    this.ready = false;
    this.player.reset();
    this.state.currentUnitIndex = -1;
    this.state.currentLyrics = [];
    this.lyricsView.setEmpty('加载中...');
    this.prefetch.clear();

    try {
      const { units, coverUrl, bookName, bookLevel } = await this.bookService.loadBook(resolved, signal);
      this.state.units = units;
      this.unitView.setCover(coverUrl);
      this.unitView.setBookMeta({
        ...resolved,
        bookName,
        bookLevel,
      });
      this.unitView.renderUnits(units);
      this.unitView.resetListScroll();
    } catch (error) {
      if (error?.name === 'AbortError') throw error;
      console.error(this.config.ERROR_MESSAGES.LOAD_CONFIG, error);
      this.state.units = [];
      this.unitView.clearUnits();
      this.lyricsView.setEmpty(
        `${this.config.ERROR_MESSAGES.LOAD_CONFIG}: ${this.state.bookPath}/book.json`
      );
    }
  }

  async loadUnitFromStorage() {
    if (!this.state.units.length) return;
    const unitIndex = getCurrentUnitIndex(this.state.bookKey);
    const safeIndex = clamp(unitIndex, 0, this.state.units.length - 1);
    await this.loadUnitByIndex(safeIndex, { scroll: true });
  }

  async loadUnitByIndex(unitIndex, options = {}) {
    const unit = this.state.units[unitIndex];
    if (!unit) return;
    if (unitIndex === this.state.currentUnitIndex && this.ready) return;

    this.unitAbort?.abort();
    this.unitAbort = new AbortController();
    const { signal } = this.unitAbort;
    const loadId = ++this.unitLoadId;

    this.persistProgress.cancel();
    this.#saveProgress();
    this.ready = false;
    this.state.currentUnitIndex = unitIndex;
    this.state.currentLyricIndex = -1;
    this.state.sentenceLoopIndex = -1;
    this.state.currentLyrics = [];
    saveCurrentUnitIndex(this.state.bookKey, unitIndex);

    this.player.reset();
    this.unitView.setActive(unitIndex, { scroll: options.scroll });
    this.unitView.updateNav(unitIndex, this.state.units.length);

    try {
      const lrcText = await this.prefetch.loadLrc(unit.lrc, signal);
      if (loadId !== this.unitLoadId) return;
      this.state.currentLyrics = LRCParser.parse(lrcText, this.config.PLAYER.TIME_OFFSET);
      this.lyricsView.render(this.state.currentLyrics);
    } catch (error) {
      if (error?.name === 'AbortError' || loadId !== this.unitLoadId) return;
      console.error(this.config.ERROR_MESSAGES.LOAD_LYRIC, error);
      this.lyricsView.setEmpty(this.config.ERROR_MESSAGES.LOAD_FAILED);
    }

    if (loadId !== this.unitLoadId) return;

    this.player.setSrc(unit.audio, {
      loop: this.state.loopMode === 'list',
      playbackRate: this.state.playbackRate,
      startTime: getPlayTime(this.state.bookKey, unitIndex),
    });
    this.ready = true;

    this.prefetch.prefetch(this.state.units[unitIndex + 1]);
  }

  destroy() {
    this.#saveProgress();
    this.bookAbort?.abort();
    this.unitAbort?.abort();
    this.abort.abort();
    this.player.destroy();
    this.lyricsView.destroy();
    this.unitView.destroy();
    this.prefetch.clear();
    this.toast.destroy();
  }

  #bindChrome() {
    const { signal } = this.abort;

    on(this.speedSelect, 'change', () => {
      const value = parseFloat(this.speedSelect.value);
      this.state.playbackRate = value;
      this.player.setRate(value);
      setStorage(this.config.STORAGE_KEYS.PLAYBACK_RATE, value);
      this.toast.show(`播放速度 ${value}x`);
    }, { signal });
    on(this.loopToggleBtn, 'click', () => this.#cycleLoopMode(), { signal });
    on(this.toggleTranslationBtn, 'click', () => this.#cycleTranslation(), { signal });

    on(window, 'hashchange', () => {
      const newKey = location.hash.slice(1).trim() || this.config.DEFAULT_BOOK_KEY;
      if (newKey === this.state.bookKey) return;
      this.applyBookChange(newKey)
        .then(() => this.loadUnitFromStorage())
        .catch((error) => {
          if (error?.name !== 'AbortError') {
            console.error('Failed to switch book:', error);
          }
        });
    }, { signal });

    on(document, 'visibilitychange', () => {
      if (document.hidden) this.#saveProgress();
    }, { signal });

    on(window, 'pagehide', () => this.#saveProgress(), { signal });
  }

  #restorePreferences() {
    const storedLoop = getStorage(this.config.STORAGE_KEYS.LOOP_MODE);
    if (this.config.LOOP_MODES.includes(storedLoop)) {
      this.state.loopMode = storedLoop;
    } else if (getStorage('loopPlaybackEnabled') === 'true') {
      this.state.loopMode = 'list';
    }

    const storedSpeed = parseFloat(getStorage(this.config.STORAGE_KEYS.PLAYBACK_RATE));
    if (this.config.AVAILABLE_SPEEDS.includes(storedSpeed)) {
      this.state.playbackRate = storedSpeed;
    }

    const storedTranslation = getStorage(this.config.STORAGE_KEYS.TRANSLATION_MODE);
    if (this.config.TRANSLATION_MODES.includes(storedTranslation)) {
      this.state.translationMode = storedTranslation;
    }

    this.player.setLoop(this.state.loopMode === 'list');
    this.player.setRate(this.state.playbackRate);
    this.#updateSpeedUI();
    this.#updateLoopUI();
    this.lyricsView.applyTranslationMode(this.state.translationMode, this.toggleTranslationBtn);
  }

  #onBookSelect(bookKey) {
    if (!bookKey || location.hash.slice(1) === bookKey) return;
    location.hash = bookKey;
  }

  #onUnitNavigate(value) {
    if (value === 'prev') {
      if (this.state.currentUnitIndex > 0) {
        this.loadUnitByIndex(this.state.currentUnitIndex - 1);
      }
      return;
    }
    if (value === 'next') {
      if (this.state.currentUnitIndex < this.state.units.length - 1) {
        this.loadUnitByIndex(this.state.currentUnitIndex + 1);
      }
      return;
    }
    if (Number.isFinite(value) && value >= 0) {
      this.loadUnitByIndex(value);
    }
  }

  #onLyricActivate(index, time) {
    if (this.state.loopMode === 'one' || this.state.loopMode === 'click') {
      this.state.sentenceLoopIndex = index;
    }
    this.#setHighlight(index);
    this.player.seek(time);
    this.player.play();
    this.#saveProgress(time);
  }

  #onAudioTick(currentTime, duration) {
    if (!this.ready) return;
    this.#handleSentence(currentTime, duration);
    this.#syncHighlight();
    this.persistProgress();
  }

  #lockedSentenceIndex() {
    if (this.state.loopMode !== 'click' && this.state.loopMode !== 'one') return -1;
    return this.state.sentenceLoopIndex;
  }

  #setHighlight(index) {
    if (index === this.state.currentLyricIndex) return;
    this.lyricsView.highlight(index);
    this.state.currentLyricIndex = index;
  }

  #syncHighlight() {
    const locked = this.#lockedSentenceIndex();
    const index = locked >= 0
      ? locked
      : LRCParser.findLyricIndexByTime(this.state.currentLyrics, this.player.currentTime);
    this.#setHighlight(index);
  }

  #handleSentence(currentTime, duration) {
    const locked = this.#lockedSentenceIndex();
    if (locked < 0 || !Number.isFinite(currentTime)) return;

    const boundaries = LRCParser.getSentenceBoundaries(
      this.state.currentLyrics,
      locked,
      duration
    );
    if (!boundaries || !Number.isFinite(boundaries.startTime)) return;

    const endTime = boundaries.endTime;
    if (currentTime < endTime) return;

    this.player.seek(boundaries.startTime);
    if (this.state.loopMode === 'click') {
      this.player.pause();
    }
    this.#setHighlight(locked);
  }

  #cycleSpeed() {
    const speeds = this.config.AVAILABLE_SPEEDS;
    const currentIndex = speeds.indexOf(this.state.playbackRate);
    this.state.playbackRate = speeds[(currentIndex + 1) % speeds.length];
    this.player.setRate(this.state.playbackRate);
    setStorage(this.config.STORAGE_KEYS.PLAYBACK_RATE, this.state.playbackRate);
    this.#updateSpeedUI();
    this.toast.show(`播放速度 ${this.state.playbackRate}x`);
  }

  #updateSpeedUI() {
    const rate = this.state.playbackRate;
    if (this.speedSelect) {
      this.speedSelect.value = String(rate);
    }
  }

  #onAudioEnded() {
    this.#saveProgress();
    if (!this.state.units.length) return;

    if (this.state.loopMode === 'book') {
      const nextIndex = (this.state.currentUnitIndex + 1) % this.state.units.length;
      this.loadUnitByIndex(nextIndex).then(() => {
        this.player.play();
      });
    }
  }

  #cycleLoopMode() {
    const modes = this.config.LOOP_MODES;
    const nextMode = modes[(modes.indexOf(this.state.loopMode) + 1) % modes.length];
    this.state.loopMode = nextMode;

    if ((nextMode === 'one' || nextMode === 'click') && this.state.currentLyricIndex >= 0) {
      this.state.sentenceLoopIndex = this.state.currentLyricIndex;
    }
    if (nextMode === 'list' || nextMode === 'off' || nextMode === 'book') {
      this.state.sentenceLoopIndex = -1;
    }

    setStorage(this.config.STORAGE_KEYS.LOOP_MODE, nextMode);
    this.player.setLoop(nextMode === 'list');
    this.#updateLoopUI();
    this.#syncHighlight();
    this.toast.show(LOOP_MODE_LABELS[nextMode]);
  }

  #updateLoopUI() {
    if (!this.loopToggleBtn) return;

    const mode = this.state.loopMode;
    const isClick = mode === 'click';
    const isOne = mode === 'one';
    const isList = mode === 'list';
    const isBook = mode === 'book';

    this.loopToggleBtn.setAttribute('aria-pressed', mode !== 'off' ? 'true' : 'false');
    toggleClass(this.loopToggleBtn, 'list', isList);
    toggleClass(this.loopToggleBtn, 'click', isClick);
    toggleClass(this.loopToggleBtn, 'one', isOne);
    toggleClass(this.loopToggleBtn, 'book', isBook);

    const label = LOOP_MODE_LABELS[mode] || '循环播放';
    this.loopToggleBtn.title = label;
    this.loopToggleBtn.setAttribute('aria-label', label);
  }

  #cycleTranslation() {
    const modes = this.config.TRANSLATION_MODES;
    const currentIndex = modes.indexOf(this.state.translationMode);
    this.state.translationMode = modes[(currentIndex + 1) % modes.length];
    setStorage(this.config.STORAGE_KEYS.TRANSLATION_MODE, this.state.translationMode);
    this.lyricsView.applyTranslationMode(this.state.translationMode, this.toggleTranslationBtn);
    this.toast.show(TRANSLATION_LABELS[this.state.translationMode]);
  }

  #saveProgress(time = this.player.currentTime) {
    if (!this.ready) return;
    if (!this.state.bookKey || this.state.currentUnitIndex < 0) return;
    if (!Number.isFinite(time) || time < 0) return;
    savePlayTime(this.state.bookKey, this.state.currentUnitIndex, time);
  }
}

/**
 * 应用入口
 * @module main
 */



function boot() {
  try {
    const themeManager = new ThemeManager({
      toggleBtn: document.getElementById('themeToggle'),
    });
    themeManager.init();

    const supportModal = new SupportModal({
      modal: document.getElementById('supportModal'),
      openBtn: document.getElementById('supportBtn'),
      closeBtn: document.getElementById('supportCloseBtn'),
    });
    supportModal.init();

    const readingSystem = new ReadingSystem();

    if (window.__DEV__) {
      Object.assign(window, { readingSystem, themeManager, supportModal });
    }

    return { readingSystem, themeManager, supportModal };
  } catch (error) {
    console.error('Failed to initialize iReader:', error);
    document.body.replaceChildren();
    const box = document.createElement('div');
    box.style.cssText = 'padding:20px;color:#b91c1c;font-family:sans-serif';
    box.innerHTML = '<h2>应用初始化失败</h2><p>请检查浏览器控制台了解详细错误信息。</p>';
    document.body.appendChild(box);
    throw error;
  }
}

if (document.readyState === 'complete') {
  boot();
} else {
  window.addEventListener('load', boot, { once: true });
}


/* 单文件模式补丁：data.json 已内联为 window.__NCE_DATA__，loadCatalog 改读全局 */
BookService.prototype.loadCatalog = async function (signal) {
  if (window.__NCE_DATA__) { this.books = Array.isArray(window.__NCE_DATA__.books) ? window.__NCE_DATA__.books : []; return this.books; }
  const response = await fetch(this.catalogUrl, { signal });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const data = await response.json();
  this.books = Array.isArray(data.books) ? data.books : [];
  return this.books;
};

    });
