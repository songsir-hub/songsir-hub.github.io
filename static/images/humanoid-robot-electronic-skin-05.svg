<svg viewBox="0 0 760 302" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="302" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">传感器「埋进皮里」的三种拓扑</text><rect x="16" y="42" width="234" height="228" rx="12" fill="#f2f7fd" stroke="#cfe0f2"/><rect x="16" y="42" width="234" height="4" rx="2" fill="#93c5fd"/><text x="30" y="66" font-size="12" font-weight="700" fill="#123f6d">表贴 surface mount</text><rect x="30" y="80" width="206" height="22" rx="3" fill="#f7fafc" stroke="#cfe0f2"/><text x="38" y="95" font-size="10.5" fill="#47607d">骨架</text><rect x="30" y="104" width="206" height="22" rx="3" fill="#ffffff" stroke="#cfe0f2"/><text x="38" y="119" font-size="10.5" fill="#23303f">传感阵列（外露）</text><rect x="30" y="128" width="206" height="22" rx="3" fill="#f7fafc" stroke="#cfe0f2"/><text x="38" y="143" font-size="10.5" fill="#47607d">薄保护层</text><text x="30" y="160" font-size="10.5" fill="#2f855a">＋ 工艺最简单、可更换</text><text x="30" y="175" font-size="10.5" fill="#2f855a">＋ 信号最直接</text><text x="30" y="190" font-size="10.5" fill="#c53030">－ 反复变形下易脱粘剥离</text><text x="30" y="205" font-size="10.5" fill="#c53030">－ 保护层直接承受磨损</text><rect x="30" y="252" width="206" height="14" rx="4" fill="#ffffff" stroke="#cfe0f2"/><text x="36" y="262" font-size="9.5" font-weight="700" fill="#185FA5">适用：样机 / 平坦区域</text><rect x="263" y="42" width="234" height="228" rx="12" fill="#f0fff4" stroke="#cfe0f2"/><rect x="263" y="42" width="234" height="4" rx="2" fill="#7fc0a8"/><text x="277" y="66" font-size="12" font-weight="700" fill="#123f6d">埋入 embedded</text><rect x="277" y="80" width="206" height="22" rx="3" fill="#f7fafc" stroke="#cfe0f2"/><text x="285" y="95" font-size="10.5" fill="#47607d">骨架</text><rect x="277" y="104" width="206" height="22" rx="3" fill="#ffffff" stroke="#cfe0f2"/><text x="285" y="119" font-size="10.5" fill="#47607d">缓冲层</text><rect x="277" y="128" width="206" height="22" rx="3" fill="#f7fafc" stroke="#cfe0f2"/><text x="285" y="143" font-size="10.5" fill="#23303f">传感层（夹层）</text><rect x="277" y="152" width="206" height="22" rx="3" fill="#ffffff" stroke="#cfe0f2"/><text x="285" y="167" font-size="10.5" fill="#47607d">表皮层 0.3–1.2 mm</text><text x="277" y="184" font-size="10.5" fill="#2f855a">＋ 受表皮保护</text><text x="277" y="199" font-size="10.5" fill="#2f855a">＋ 比表贴更抗反复变形脱粘</text><text x="277" y="214" font-size="10.5" fill="#c53030">－ 埋深直接牺牲分辨率</text><text x="277" y="229" font-size="10.5" fill="#c53030">－ 维修需破皮</text><rect x="277" y="252" width="206" height="14" rx="4" fill="#ffffff" stroke="#cfe0f2"/><text x="283" y="262" font-size="9.5" font-weight="700" fill="#185FA5">适用：量产主力（指尖）</text><rect x="510" y="42" width="234" height="228" rx="12" fill="#fffbf2" stroke="#cfe0f2"/><rect x="510" y="42" width="234" height="4" rx="2" fill="#e8b06a"/><text x="524" y="66" font-size="12" font-weight="700" fill="#123f6d">本征 intrinsic</text><rect x="524" y="80" width="206" height="22" rx="3" fill="#f7fafc" stroke="#cfe0f2"/><text x="532" y="95" font-size="10.5" fill="#47607d">骨架</text><rect x="524" y="104" width="206" height="22" rx="3" fill="#ffffff" stroke="#cfe0f2"/><text x="532" y="119" font-size="10.5" fill="#23303f">皮肤本体即传感介质</text><rect x="524" y="128" width="206" height="22" rx="3" fill="#f7fafc" stroke="#cfe0f2"/><text x="532" y="143" font-size="10.5" fill="#47607d">（导电硅胶 / 离子凝胶）</text><text x="524" y="160" font-size="10.5" fill="#2f855a">＋ 无界面、无分层</text><text x="524" y="175" font-size="10.5" fill="#2f855a">＋ 可做大面积、力学最连续</text><text x="524" y="190" font-size="10.5" fill="#c53030">－ 灵敏度与线性较弱</text><text x="524" y="205" font-size="10.5" fill="#c53030">－ 一处坏则整块换</text><rect x="524" y="252" width="206" height="14" rx="4" fill="#ffffff" stroke="#cfe0f2"/><text x="530" y="262" font-size="9.5" font-weight="700" fill="#185FA5">适用：大面积低密度区域</text><rect x="16" y="278" width="728" height="18" rx="6" fill="#f5f8fb" stroke="#cfe0f2"/><text x="380" y="291" text-anchor="middle" font-size="10.5" fill="#47607d">2026 年的现实格局：指尖用埋入式离散阵列（要精度）+ 躯干用本征蒙皮（要面积）的混合架构</text></svg>
