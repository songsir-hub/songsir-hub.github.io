<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
  <rect width="920" height="420" fill="#FBF8F1"/>
  <text x="460" y="36" font-size="20" font-weight="bold" fill="#3A3226" text-anchor="middle">图5：星际基地发射频率增长预测（2026–2040）</text>
  <text x="460" y="56" font-size="12.5" fill="#6B6255" text-anchor="middle">Figure 5: Projected Launch Frequency Growth (次/日)</text>

  <!-- axes: x 2026..2040, y 0..35 -->
  <line x1="90" y1="80" x2="90" y2="350" stroke="#8B7355" stroke-width="1.6"/>
  <line x1="90" y1="350" x2="870" y2="350" stroke="#8B7355" stroke-width="1.6"/>
  <text x="480" y="380" font-size="11.5" fill="#6B6255" text-anchor="middle">年份</text>
  <text x="40" y="215" font-size="11.5" fill="#6B6255" text-anchor="middle" transform="rotate(-90 40 215)">发射频率（次/日）</text>

  <!-- y scale 0..35 -> 350..80 (270px). 1 unit = 7.714px. tick every 5 -->
  <g font-size="11" fill="#6B6255" text-anchor="end">
    <text x="82" y="354">0</text>
    <text x="82" y="314">5</text>
    <text x="82" y="274">10</text>
    <text x="82" y="234">15</text>
    <text x="82" y="194">20</text>
    <text x="82" y="154">25</text>
    <text x="82" y="114">30</text>
  </g>
  <g stroke="#d8d0c0" stroke-dasharray="3 4">
    <line x1="90" y1="310" x2="870" y2="310"/>
    <line x1="90" y1="270" x2="870" y2="270"/>
    <line x1="90" y1="230" x2="870" y2="230"/>
    <line x1="90" y1="190" x2="870" y2="190"/>
    <line x1="90" y1="150" x2="870" y2="150"/>
  </g>

  <!-- x labels: years 2026..2040, x from 90..870 step ~55.7 -->
  <g font-size="11" fill="#6B6255" text-anchor="middle">
    <text x="90" y="368">2026</text>
    <text x="201" y="368">2029</text>
    <text x="313" y="368">2032</text>
    <text x="424" y="368">2035</text>
    <text x="536" y="368">2038</text>
    <text x="870" y="368">2040</text>
  </g>

  <!-- data points (year, value/day): 2026:0.5, 2029:1, 2031:3, 2033:10, 2035:30, 2038:30, 2040:30
       x: 2026->90, 2029->201, 2031->257, 2033->313, 2035->368, 2038->536, 2040->870
       y = 350 - value*7.714 -->
  <!-- 0.5 -> 346, 1 -> 342, 3 -> 327, 10 -> 273, 30 -> 118, 30 -> 118, 30 -> 118 -->
  <polyline points="90,346 201,342 257,327 313,273 368,118 536,118 870,118"
            fill="none" stroke="#52795F" stroke-width="3"/>
  <!-- area fill -->
  <polygon points="90,346 201,342 257,327 313,273 368,118 536,118 870,118 870,350 90,350"
           fill="#52795F" fill-opacity="0.12"/>
  <!-- dots -->
  <g fill="#52795F">
    <circle cx="90" cy="346" r="4.5"/>
    <circle cx="201" cy="342" r="4.5"/>
    <circle cx="257" cy="327" r="4.5"/>
    <circle cx="313" cy="273" r="4.5"/>
    <circle cx="368" cy="118" r="4.5"/>
    <circle cx="536" cy="118" r="4.5"/>
    <circle cx="870" cy="118" r="4.5"/>
  </g>
  <!-- value labels -->
  <g font-size="11.5" fill="#3A3226" text-anchor="middle">
    <text x="201" y="332">1</text>
    <text x="257" y="317">3</text>
    <text x="313" y="263">10</text>
    <text x="368" y="108">30</text>
    <text x="536" y="108">30</text>
    <text x="870" y="108">30</text>
  </g>

  <text x="460" y="410" font-size="10.5" fill="#8A8578" text-anchor="middle">依据正文时间线：2029 最早发射窗口 → 2030–2032 每周数次 → 2033–2035 日发射 30 次达成（预测值为规划口径，实际以 SpaceX 实现节奏为准）</text>
<text x="98%" y="98%" text-anchor="end" font-size="11" fill="#6B6255" font-family="serif" opacity="0.75">松朗制图</text>
</svg>
