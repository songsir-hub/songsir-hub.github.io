<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#8B7355"/></marker></defs>
<rect width="920" height="540" fill="#FBF8F1"/>
<text x="460" y="44" font-size="21" font-weight="bold" fill="#3A3226" text-anchor="middle">龙口莱山地景：城在山下，祠在山麓，山在城南</text>
<text x="460" y="67" font-size="13" fill="#6B6255" text-anchor="middle">自北向南剖面示意：黄县故城 → 归城 → 月主祠 → 莱山主峰</text>
<path d="M70,400 L850,400" stroke="#8B7355" stroke-width="2.0" fill="none"/>
<rect x="70" y="400" width="780" height="46" fill="#F3EADA" stroke="none"/>
<path d="M560,400 L700,215 L790,268 L850,400 Z" fill="#8FB39A" fill-opacity="0.45" stroke="#52795F" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M700,215 L748,268 L652,268 Z" fill="#FFFFFF" fill-opacity="0.55" stroke="none"/>
<text x="716" y="208" font-size="15" font-weight="bold" fill="#3A3226" text-anchor="middle">莱山主峰</text>
<text x="716" y="190" font-size="11.5" fill="#6B6255" text-anchor="middle">（之莱山 · 莱阴山）</text>
<rect x="596" y="330" width="74" height="34" rx="4" fill="#A98BB0" fill-opacity="0.85" stroke="#6E5480" stroke-width="2.2"/>
<text x="633" y="352" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">月主祠</text>
<text x="633" y="300" font-size="12.5" font-weight="bold" fill="#6E5480" text-anchor="middle">庙周家秦汉建筑基址</text>
<text x="633" y="318" font-size="11" fill="#6B6255" text-anchor="middle">（庙耩 · 莱山北麓）</text>
<path d="M633,330 L633,372" stroke="#6E5480" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<rect x="380" y="344" width="96" height="40" rx="4" fill="#EFE6CE" fill-opacity="0.75" stroke="#3A3226" stroke-width="2.2"/>
<text x="428" y="370" font-size="13.5" font-weight="bold" fill="#3A3226" text-anchor="middle">归城</text>
<text x="428" y="390" font-size="11" fill="#6B6255" text-anchor="middle">本书所推东莱中心</text>
<rect x="160" y="350" width="96" height="36" rx="4" fill="#FFFFFF" stroke="#4E463A" stroke-width="2.0"/>
<text x="208" y="374" font-size="13" font-weight="bold" fill="#4E463A" text-anchor="middle">黄县故城</text>
<text x="208" y="394" font-size="11" fill="#6B6255" text-anchor="middle">（今龙口黄城）</text>
<path d="M258,452 L378,452" stroke="#8B7355" stroke-width="1.6" fill="none"/>
<path d="M370.7,455.3 L378,452 L370.7,448.7" stroke="#8B7355" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M380,452 L596,452" stroke="#8B7355" stroke-width="1.6" fill="none"/>
<path d="M588.7,455.3 L596,452 L588.7,448.7" stroke="#8B7355" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<text x="318" y="470" font-size="11.5" fill="#6B6255" text-anchor="middle">约十二公里</text>
<text x="488" y="470" font-size="11.5" fill="#6B6255" text-anchor="middle">城南 · 遗址紧邻归城</text>
<rect x="700" y="350" width="84" height="30" rx="4" fill="#5E9BB8" fill-opacity="0.75" stroke="#3E7CA6" stroke-width="1.8"/>
<text x="742" y="370" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">窑址 · 行宫台</text>
<text x="742" y="394" font-size="10.8" fill="#6B6255" text-anchor="middle">建材专门烧造</text>
<rect x="70" y="486" width="780" height="30" rx="9" fill="#EFE6CE" fill-opacity="0.45" stroke="#8B7355" stroke-width="1.5"/>
<text x="460" y="506" font-size="13.5" font-weight="bold" fill="#3A3226" text-anchor="middle">族群圣山 · 政治中心 · 帝国祀典——三层落在同一个地理单元里</text>
<path d="M60,510 L860,510" stroke="#8B7355" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
<text x="60" y="530" font-size="11.5" fill="#6B6255" text-anchor="start">本图为地景关系示意，非实测剖面；诸书所记主峰海拔不一，待核，故图中不标具体高程。</text>
<text x="860" y="530" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
</svg>
