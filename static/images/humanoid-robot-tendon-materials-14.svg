<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="腱绳技术三阶段路线图">
  <rect width="800" height="300" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
    <line x1="60" y1="150" x2="740" y2="150" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="160" cy="150" r="12" fill="#185FA5"/>
    <circle cx="400" cy="150" r="12" fill="#7c3aed"/>
    <circle cx="640" cy="150" r="12" fill="#15a06a"/>
    <text x="160" y="188" font-size="13" fill="#185FA5" text-anchor="middle" font-weight="bold">2026–2028</text>
    <text x="400" y="188" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="bold">2028–2032</text>
    <text x="640" y="188" font-size="13" fill="#0f6b47" text-anchor="middle" font-weight="bold">2032 以后</text>

    <rect x="40" y="40" width="240" height="92" rx="10" fill="#eef6ff" stroke="#185FA5"/>
    <text x="160" y="64" font-size="13.5" fill="#185FA5" text-anchor="middle" font-weight="bold">腱绳主导灵巧手与远端关节</text>
    <text x="56" y="86" font-size="12" fill="#47607d">· 金属系稳固占据下肢重载</text>
    <text x="56" y="104" font-size="12" fill="#47607d">· 整机寿命：数周 → 数月</text>
    <text x="56" y="122" font-size="12" fill="#47607d">· 出现公开的寿命测试标准</text>

    <rect x="280" y="40" width="240" height="92" rx="10" fill="#f5f0ff" stroke="#7c3aed"/>
    <text x="400" y="64" font-size="13.5" fill="#6d28d9" text-anchor="middle" font-weight="bold">电机骨干 + 腱绳末端 + 局部传感化</text>
    <text x="296" y="86" font-size="12" fill="#5b4b8a">· 模组化交付成为主流</text>
    <text x="296" y="104" font-size="12" fill="#5b4b8a">· 传感化腱绳进入闭环力控</text>
    <text x="296" y="122" font-size="12" fill="#5b4b8a">· 供应商从「卖绳」转为「卖模组」</text>

    <rect x="520" y="40" width="240" height="92" rx="10" fill="#eaf6ef" stroke="#15a06a"/>
    <text x="640" y="64" font-size="13.5" fill="#0f6b47" text-anchor="middle" font-weight="bold">一体编织 / 打印的承重纤维网络</text>
    <text x="536" y="86" font-size="12" fill="#136b47">· 部分替代离散腱绳</text>
    <text x="536" y="104" font-size="12" fill="#136b47">· 消灭滑轮与端子两大失效源</text>
    <text x="536" y="122" font-size="12" fill="#136b47">· 首款量产结构件出现</text>

    <rect x="40" y="212" width="720" height="72" rx="10" fill="#fef6e7" stroke="#f0c078"/>
    <text x="60" y="236" font-size="13" fill="#a16207" font-weight="bold">证伪条件（写下来以便日后自检）</text>
    <text x="60" y="258" font-size="12.5" fill="#a16207">· 2028 年前整机寿命仍停留「数月」→ 灵巧手路线可能整体向连杆与直驱迁移</text>
    <text x="60" y="276" font-size="12.5" fill="#a16207">· 端子疲劳被系统性解决 → 金属系份额上移；改性 UHMWPE 做到 6 个月以上 → 金属系退回下肢基本盘</text>
  </g>
</svg>
