<svg viewBox="0 0 760 336" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="336" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">核心定律：应力按 1/z² 衰减，横向扩散半径约等于深度</text><text x="380" y="42" text-anchor="middle" font-size="11" fill="#7b8ca0">（弹性半空间 Boussinesq 解：σ ∝ 3P / 2πz²，扩散锥半角约 30°–45°）</text><path d="M200 58 L200 92" stroke="#c53030" stroke-width="3" marker-end="url(#ar4)"/><defs><marker id="ar4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c53030"/></marker></defs><text x="212" y="80" font-size="12" font-weight="700" fill="#c53030">集中力 P</text><line x1="120" y1="94" x2="280" y2="94" stroke="#123f6d" stroke-width="2.5"/><text x="88" y="98" font-size="10.5" fill="#47607d">皮肤表面</text><path d="M200 94 L96 274 L304 274 Z" fill="#e7f0fc" opacity="0.55"/><line x1="200" y1="94" x2="96" y2="274" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="200" y1="94" x2="304" y2="274" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="180" y1="128" x2="219" y2="128" stroke="#2f855a" stroke-width="1.5"/><rect x="316" y="110" width="146" height="36" rx="6" fill="#f0fff4" stroke="#cfe0f2"/><text x="328" y="124" font-size="11" font-weight="700" fill="#2f855a">z = 0.5 mm</text><text x="328" y="139" font-size="10" fill="#47607d">分辨率可达 0.5–1 mm</text><line x1="219" y1="128" x2="316" y2="128" stroke="#cfe0f2" stroke-dasharray="3 3"/><line x1="148" y1="184" x2="252" y2="184" stroke="#e0a92e" stroke-width="1.5"/><rect x="316" y="166" width="146" height="36" rx="6" fill="#fffbf2" stroke="#cfe0f2"/><text x="328" y="180" font-size="11" font-weight="700" fill="#e0a92e">z = 2 mm</text><text x="328" y="195" font-size="10" fill="#47607d">分辨率退化到 2–6 mm</text><line x1="252" y1="184" x2="316" y2="184" stroke="#cfe0f2" stroke-dasharray="3 3"/><line x1="115" y1="240" x2="284" y2="240" stroke="#c53030" stroke-width="1.5"/><rect x="316" y="222" width="146" height="36" rx="6" fill="#fff5f5" stroke="#cfe0f2"/><text x="328" y="236" font-size="11" font-weight="700" fill="#c53030">z = 5 mm</text><text x="328" y="251" font-size="10" fill="#47607d">只能测「有没有碰」</text><line x1="284" y1="240" x2="316" y2="240" stroke="#cfe0f2" stroke-dasharray="3 3"/><rect x="480" y="94" width="264" height="150" rx="12" fill="#f7fafc" stroke="#cfe0f2"/><text x="612" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#123f6d">由此得出的工程判据</text><text x="612" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c53030">分辨率下限 ≈ 埋深 d</text><text x="612" y="166" text-anchor="middle" font-size="10.5" fill="#47607d">（工程实际约 1d–3d）</text><line x1="496" y1="176" x2="728" y2="176" stroke="#cfe0f2"/><text x="496" y="196" font-size="10.5" fill="#47607d">要 1 mm 分辨率 → 埋深 ≤1 mm</text><text x="496" y="214" font-size="10.5" fill="#47607d">理想 0.3–0.5 mm</text><text x="496" y="234" font-size="10.5" fill="#c53030">但 0.3 mm 保护层扛不住磨损</text><rect x="16" y="272" width="728" height="52" rx="10" fill="#fffbf2" stroke="#f2e0bb"/><text x="380" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5d0c">电子皮肤的核心矛盾：分辨率要求埋得浅，可靠性要求埋得深</text><text x="380" y="312" text-anchor="middle" font-size="11" fill="#47607d">这个矛盾无法靠「换更好的传感器」解决 —— 只能靠局部减薄、模量梯度与应力集中结构、算法反卷积、可更换模块（FRU）四条路缓解</text></svg>
