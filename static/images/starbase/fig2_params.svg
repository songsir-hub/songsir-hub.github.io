<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
  <rect width="920" height="360" fill="#FBF8F1"/>
  <text x="460" y="36" font-size="20" font-weight="bold" fill="#3A3226" text-anchor="middle">图2：两大星际基地关键参数对比</text>
  <text x="460" y="56" font-size="12.5" fill="#6B6255" text-anchor="middle">Figure 2: Key Parameters of the Two Starbases</text>

  <!-- table header -->
  <rect x="40" y="78" width="840" height="40" fill="#8B7355"/>
  <text x="120" y="104" font-size="14" fill="#FBF8F1" text-anchor="middle">指标 / 项目</text>
  <text x="400" y="104" font-size="14" fill="#FBF8F1" text-anchor="middle">德州 Starbase（Boca Chica）</text>
  <text x="720" y="104" font-size="14" fill="#FBF8F1" text-anchor="middle">路州 Starbase（Louisiana）</text>

  <!-- rows -->
  <!-- row template: y base, height 42 -->
  <g font-size="13.5" fill="#3A3226">
    <!-- 1 基地规模 -->
    <rect x="40" y="118" width="840" height="42" fill="#ffffff" fill-opacity="0.55"/>
    <text x="60" y="144" font-weight="bold">基地规模 / Area</text>
    <text x="400" y="144" text-anchor="middle">博卡奇卡沿海滩涂（创始）</text>
    <text x="720" y="144" text-anchor="middle">12.5万英亩（约506 km²）</text>
    <!-- 2 投资 -->
    <rect x="40" y="160" width="840" height="42" fill="#FBF8F1"/>
    <text x="60" y="186" font-weight="bold">投资 / Investment</text>
    <text x="400" y="186" text-anchor="middle">未单列（历史累计）</text>
    <text x="720" y="186" text-anchor="middle">$100B（路州史上最大单笔）</text>
    <!-- 3 发射频率 -->
    <rect x="40" y="202" width="840" height="42" fill="#ffffff" fill-opacity="0.55"/>
    <text x="60" y="228" font-weight="bold">发射频率 / Launch Rate</text>
    <text x="400" y="228" text-anchor="middle">低频试验</text>
    <text x="720" y="228" text-anchor="middle">目标 30 次/天（最终十余塔）</text>
    <!-- 4 最早发射 -->
    <rect x="40" y="244" width="840" height="42" fill="#FBF8F1"/>
    <text x="60" y="270" font-weight="bold">最早发射 / First Launch</text>
    <text x="400" y="270" text-anchor="middle">已多次试飞（2023 起）</text>
    <text x="720" y="270" text-anchor="middle">规划 2029 年</text>
    <!-- 5 基础设施 -->
    <rect x="40" y="286" width="840" height="42" fill="#ffffff" fill-opacity="0.55"/>
    <text x="60" y="312" font-weight="bold">基础设施 / Ownership</text>
    <text x="400" y="312" text-anchor="middle">SpaceX 全资自建</text>
    <text x="720" y="312" text-anchor="middle">SpaceX 全资自建（路州）</text>
  </g>
  <!-- vertical column separators -->
  <line x1="300" y1="78" x2="300" y2="328" stroke="#c9c2b4" stroke-width="1"/>
  <line x1="600" y1="78" x2="600" y2="328" stroke="#c9c2b4" stroke-width="1"/>
  <line x1="40" y1="328" x2="880" y2="328" stroke="#8B7355" stroke-width="1.4"/>
  <text x="460" y="352" font-size="10.5" fill="#8A8578" text-anchor="middle">数据来源：Starbase 报告正文（路易斯安那 12.5 万英亩、$100B、30 次/天、2029 最早发射）</text>
<text x="98%" y="98%" text-anchor="end" font-size="11" fill="#6B6255" font-family="serif" opacity="0.75">松朗制图</text>
</svg>
