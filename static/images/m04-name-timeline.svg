<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" font-family="Songti SC, SimSun, serif">
<rect width="900" height="420" fill="#FBF8F1"/>
<text x="60" y="60" font-size="26" font-weight="bold" fill="#2E2820" letter-spacing="2">名号三层并行示意：族称、国号、自名</text>
<line x1="60" y1="82" x2="290" y2="82" stroke="#B5A98C" stroke-width="2"/>
<text x="60" y="118" font-size="15" fill="#6B6255">同一实体身上，三个名字分属不同层次，随政治情境显隐——不是先后改名。</text>
<rect x="60" y="150" width="780" height="64" rx="8" fill="#F2E9D4" stroke="#B5A98C"/>
<text x="84" y="176" font-size="17" font-weight="bold" fill="#2E2820">族称　莱</text>
<text x="84" y="200" font-size="13" fill="#6B6255">外人对海岱东部夷族的归类；恒在。齐系文献、前 690 年后的编年皆用。</text>
<rect x="60" y="228" width="780" height="64" rx="8" fill="#F2E9D4" stroke="#B5A98C"/>
<text x="84" y="254" font-size="17" font-weight="bold" fill="#2E2820">国号　纪</text>
<text x="84" y="278" font-size="13" fill="#6B6255">周室册封后的正式名号；西周至春秋前期行用，前 690 年“大去其国”后废。</text>
<rect x="60" y="306" width="780" height="64" rx="8" fill="#F2E9D4" stroke="#B5A98C"/>
<text x="84" y="332" font-size="17" font-weight="bold" fill="#2E2820">自名　己</text>
<text x="84" y="356" font-size="13" fill="#6B6255">铜器铭文自称，商末已见（益都侯城“己竝”）；铸器场合用，与族称、国号并行。</text>
<text x="60" y="400" font-size="11" fill="#6B6255">自制示意图，非编年标尺。作图：松朗</text>
</svg>