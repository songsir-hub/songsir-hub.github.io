<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
<rect width="980" height="540" fill="#FBF8F1"/>
<text x="34" y="42" font-size="22" font-weight="bold" fill="#3A3226">己 · 纪 · 㠱：见纽三字字形构件关系</text>
<text x="34" y="64" font-size="13" fill="#6B6255">三字都以"己"为声符（声纽皆 k-），区别只在装饰与辅佐部件——这是"同声同源"的字形层证据。摹绘示意，非原拓影印。</text>
<rect x="34" y="88" width="440.0" height="170" fill="#F3EADA" stroke="#C9BD9E" stroke-width="1.4" rx="8"/>
<text x="52" y="116" font-size="18" font-weight="bold" fill="#3A3226">"己"</text>
<text x="456.0" y="116" font-size="11.5" fill="#6B6255" text-anchor="end">见纽 k-</text>
<rect x="58.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="66.0" y="166" font-size="11" fill="#4E463A">甲骨文</text>
<g transform="translate(88.0,182) scale(1.5)"><path d="M0,0 L18,0 L18,2 L11,2 L11,28 L18,28 L18,30 L0,30 L0,28 L7,28 L7,2 L0,2 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="156.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="164.0" y="166" font-size="11" fill="#4E463A">金文</text>
<g transform="translate(186.0,182) scale(1.5)"><path d="M0,0 L20,0 L20,3 L12,3 L12,30 L20,30 L20,33 L0,33 L0,30 L8,30 L8,3 L0,3 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="254.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="262.0" y="166" font-size="11" fill="#4E463A">小篆</text>
<g transform="translate(284.0,182) scale(1.5)"><path d="M0,12 C0,4 8,0 14,0 C20,0 22,8 22,14 C22,22 18,28 12,30 C8,32 4,32 2,30 L2,28 C6,30 10,30 14,28 C18,26 20,22 20,16 C20,10 16,4 10,4 C8,4 4,6 2,10 L2,14 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="352.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="360.0" y="166" font-size="11" fill="#4E463A">楷书</text>
<g transform="translate(382.0,182) scale(1.5)"><path d="M4,4 L18,4 L18,8 L13,8 L13,28 L18,28 L18,32 L4,32 L4,28 L9,28 L9,8 L4,8 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<text x="52" y="240" font-size="11.5" fill="#6B6255">最简形；商代至春秋四百年稳定不变。</text>
<rect x="506.0" y="88" width="440.0" height="170" fill="#F3EADA" stroke="#C9BD9E" stroke-width="1.4" rx="8"/>
<text x="524.0" y="116" font-size="18" font-weight="bold" fill="#3A3226">"纪"</text>
<text x="928.0" y="116" font-size="11.5" fill="#6B6255" text-anchor="end">见纽 k-</text>
<rect x="530.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="538.0" y="166" font-size="11" fill="#4E463A">甲骨文</text>
<g transform="translate(560.0,182) scale(1.5)"><path d="M0,0 L10,0 L10,2 L4,2 L4,10 L10,10 L10,12 L0,12 L0,10 L2,10 L2,2 L0,2 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="628.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="636.0" y="166" font-size="11" fill="#4E463A">金文</text>
<g transform="translate(658.0,182) scale(1.5)"><path d="M0,0 L12,0 L12,3 L5,3 L5,12 L12,12 L12,15 L0,15 L0,12 L2,12 L2,3 L0,3 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="726.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="734.0" y="166" font-size="11" fill="#4E463A">小篆</text>
<g transform="translate(756.0,182) scale(1.5)"><path d="M0,4 C4,4 4,10 8,12 C12,14 12,18 8,22 C4,26 0,28 -2,30 L0,32 C2,30 6,28 10,24 C14,20 16,16 14,12 C12,8 8,6 4,8 L0,4 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="824.0" y="148" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="832.0" y="166" font-size="11" fill="#4E463A">楷书</text>
<g transform="translate(854.0,182) scale(1.5)"><path d="M4,4 L18,4 L18,7 L13,7 L13,14 L18,14 L18,17 L4,17 L4,14 L9,14 L9,7 L4,7 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<text x="524.0" y="240" font-size="11.5" fill="#6B6255">从"糸"从"己"；"糸"表世系绳贯，是装饰性增旁。</text>
<rect x="34" y="282" width="440.0" height="170" fill="#F3EADA" stroke="#C9BD9E" stroke-width="1.4" rx="8"/>
<text x="52" y="310" font-size="18" font-weight="bold" fill="#3A3226">"㠱"</text>
<text x="456.0" y="310" font-size="11.5" fill="#6B6255" text-anchor="end">见纽 k-</text>
<rect x="58.0" y="342" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="66.0" y="360" font-size="11" fill="#4E463A">甲骨文</text>
<g transform="translate(88.0,376) scale(1.5)"><path d="M0,0 L10,0 L10,2 L5,2 L5,12 L10,12 L10,14 L0,14 L0,12 L2,12 L2,2 L0,2 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="156.0" y="342" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="164.0" y="360" font-size="11" fill="#4E463A">金文</text>
<g transform="translate(186.0,376) scale(1.5)"><path d="M0,0 L12,0 L12,3 L5,3 L5,14 L12,14 L12,17 L0,17 L0,14 L2,14 L2,3 L0,3 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="254.0" y="342" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="262.0" y="360" font-size="11" fill="#4E463A">小篆</text>
<g transform="translate(284.0,376) scale(1.5)"><path d="M0,8 C0,4 6,0 12,0 C18,0 20,6 20,12 C20,18 14,24 8,28 C4,30 0,30 -2,28 L0,26 C2,28 6,28 10,26 C14,22 18,18 18,14 C18,8 14,4 10,4 C6,4 2,8 0,12 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<rect x="352.0" y="342" width="90.0" height="120" fill="#FFFFFF" stroke="#C9BD9E" stroke-width="0.8" rx="4"/>
<text x="360.0" y="360" font-size="11" fill="#4E463A">楷书</text>
<g transform="translate(382.0,376) scale(1.5)"><path d="M4,4 L18,4 L18,8 L13,8 L13,28 L18,28 L18,32 L4,32 L4,28 L9,28 L9,8 L4,8 Z" fill="#3A3226" stroke="#3A3226" stroke-width="0.5"/></g>
<text x="52" y="434" font-size="11.5" fill="#6B6255">从"己"从"攴／𢆚"；陈梦家、唐兰等主"㠱＝己＝纪"。</text>
<rect x="506.0" y="282" width="440.0" height="170" fill="#FFFFFF" stroke="#3F6B4E" stroke-width="1.6" rx="8"/>
<text x="524.0" y="310" font-size="18" font-weight="bold" fill="#3F6B4E">声系结论</text>
<text x="928.0" y="310" font-size="11.5" fill="#6B6255" text-anchor="end">全部归 k- 纽</text>
<text x="524.0" y="344" font-size="12.5" fill="#3A3226">"己""纪""㠱"三字互通实例数十例——同一族群在不同时期用</text>
<text x="524.0" y="364" font-size="12.5" fill="#3A3226">不同字自称。三家异说（王献唐主"㠱≠纪"）皆在三字群内部分歧，</text>
<text x="524.0" y="384" font-size="12.5" fill="#3A3226">一致在三字群外部分界——任何一派都不让"㠱"字越到"釐／来／莱"</text>
<text x="524.0" y="404" font-size="12.5" fill="#3A3226">那边去。换言之：</text>
<text x="524.0" y="426" font-size="14" fill="#3F6B4E" font-weight="bold">组内自由通假，组间绝壁互不越界。</text>
<text x="34" y="522" font-size="11.5" fill="#6B6255">字形依《殷周金文集成》《金文编》摹绘示意；正式引用请核对原拓。"纪"字繁体从"糸"己声，金文原作"己"，加旁为装饰演化。</text>
<text x="946" y="522" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
