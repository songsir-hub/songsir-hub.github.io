<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">六条工艺路线的定位：壁厚能力 × 批量性</text><rect x="96" y="44" width="620" height="206" fill="#fbfcfe" stroke="#cfe0f2"/><line x1="96" y1="147" x2="716" y2="147" stroke="#eef2f7"/><line x1="406" y1="44" x2="406" y2="250" stroke="#eef2f7"/><text x="406" y="268" text-anchor="middle" font-size="11" fill="#7b8ca0">批量性　→</text><text x="30" y="147" font-size="11" fill="#7b8ca0" transform="rotate(-90 30 147)">薄壁能力　→</text><circle cx="512" cy="68" r="11" fill="#2f855a" opacity="0.85"/><text x="528" y="72" font-size="13" font-weight="600" fill="#23303f">LSR 注塑 / 包胶</text><circle cx="492" cy="130" r="9" fill="#185FA5" opacity="0.85"/><text x="508" y="134" font-size="12" font-weight="600" fill="#23303f">印刷（卷对卷）</text><circle cx="448" cy="182" r="9" fill="#d97706" opacity="0.85"/><text x="464" y="186" font-size="12" font-weight="600" fill="#23303f">纺织基一体成型</text><circle cx="322" cy="74" r="9" fill="#185FA5" opacity="0.85"/><text x="338" y="78" font-size="12" font-weight="600" fill="#23303f">喷涂 / 浸涂</text><circle cx="186" cy="184" r="9" fill="#7b8ca0" opacity="0.85"/><text x="202" y="188" font-size="12" font-weight="600" fill="#23303f">模具浇注 RTV</text><circle cx="286" cy="122" r="9" fill="#8b5cf6" opacity="0.85"/><text x="302" y="126" font-size="12" font-weight="600" fill="#23303f">3D 打印（多材料）</text><text x="512" y="93" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f855a">量产唯一现实路线</text><text x="512" y="108" text-anchor="middle" font-size="10" fill="#47607d">超薄 0.3–0.5 mm · 公差 ±0.01–0.05 mm</text><rect x="16" y="292" width="728" height="30" rx="8" fill="#fff8ec" stroke="#f2e0bb"/><text x="380" y="311" text-anchor="middle" font-size="11.5" fill="#7c4a12">必踩的坑：铂金催化硅胶会被含硫、含氮、有机锡与未充分固化的 3D 打印树脂「毒化」而发粘 —— 混合工艺必须先做固化抑制试验</text></svg>
