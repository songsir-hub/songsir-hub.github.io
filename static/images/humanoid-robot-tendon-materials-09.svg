<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="碳纤维弯曲应变计算">
  <rect width="800" height="320" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
    <text x="170" y="30" font-size="14" fill="#1e4f8f" text-anchor="middle" font-weight="bold">几何：ε = r / (R + r)</text>
    <circle cx="170" cy="160" r="86" fill="#f1f6fc" stroke="#185FA5" stroke-width="3"/>
    <circle cx="170" cy="160" r="5" fill="#185FA5"/>
    <text x="170" y="205" font-size="12" fill="#185FA5" text-anchor="middle">R = 1.5 mm</text>
    <path d="M86 92 A 86 86 0 0 1 254 92" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <text x="170" y="72" font-size="12" fill="#b91c1c" text-anchor="middle">纤维（d=7 μm，r=3.5 μm）</text>
    <line x1="170" y1="160" x2="248" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="212" y="152" font-size="12" fill="#5b7086" text-anchor="middle">R</text>

    <text x="470" y="30" font-size="14" fill="#1e4f8f" text-anchor="middle" font-weight="bold">弯曲应变 vs 断裂伸长率</text>
    <text x="400" y="72" font-size="12.5" fill="#47607d">T700 断裂伸长率 2.1%</text>
    <rect x="400" y="80" width="360" height="26" rx="4" fill="#185FA5"/>
    <text x="752" y="98" font-size="12" fill="#ffffff" text-anchor="end">2.1%</text>

    <text x="400" y="132" font-size="12.5" fill="#47607d">M55J 断裂伸长率 0.8%（超高模牌号）</text>
    <rect x="400" y="140" width="137" height="26" rx="4" fill="#d97706"/>
    <text x="529" y="158" font-size="12" fill="#ffffff" text-anchor="end">0.8%</text>

    <text x="400" y="192" font-size="12.5" fill="#47607d">R0.5 mm 滑轮时的弯曲应变</text>
    <rect x="400" y="200" width="118" height="26" rx="4" fill="#ea8a1f"/>
    <text x="510" y="218" font-size="12" fill="#ffffff" text-anchor="end">0.69%</text>

    <text x="400" y="252" font-size="12.5" fill="#166534" font-weight="bold">R1.5 mm 滑轮时的弯曲应变</text>
    <rect x="400" y="260" width="40" height="26" rx="4" fill="#15a06a"/>
    <text x="450" y="278" font-size="12" fill="#0f6b47">0.23%　≈ 断裂伸长率的 1/9</text>

    <rect x="24" y="264" width="340" height="38" rx="8" fill="#eef6ff" stroke="#185FA5"/>
    <text x="194" y="288" font-size="12.5" fill="#185FA5" text-anchor="middle">静态上完全弯不断 —— 流行说法被证伪</text>
  </g>
</svg>
