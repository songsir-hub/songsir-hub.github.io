<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="316" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">人体皮肤是「外硬内软」的模量梯度结构</text><text x="119" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#123f6d">人体皮肤</text><rect x="24" y="66" width="190" height="26" rx="4" fill="#f0d9b5" stroke="#e8d5b0"/><text x="36" y="83" font-size="11.5" font-weight="600" fill="#8a5d0c">角质层</text><text x="222" y="82" font-size="10" fill="#a07830">约 100 μm</text><rect x="24" y="95" width="190" height="30" rx="4" fill="#f5e3c8" stroke="#e8d5b0"/><text x="36" y="114" font-size="11.5" font-weight="600" fill="#8a5d0c">表皮 epidermis</text><text x="222" y="113" font-size="10" fill="#a07830">约 95 μm　1–2 MPa</text><rect x="24" y="128" width="190" height="46" rx="4" fill="#fbeedb" stroke="#e8d5b0"/><text x="36" y="155" font-size="11.5" font-weight="600" fill="#8a5d0c">真皮 dermis</text><text x="222" y="154" font-size="10" fill="#a07830">1–1.4 mm　0.02–0.08 MPa</text><rect x="24" y="177" width="190" height="38" rx="4" fill="#fdf6ec" stroke="#e8d5b0"/><text x="36" y="200" font-size="11.5" font-weight="600" fill="#8a5d0c">皮下 hypodermis</text><text x="222" y="199" font-size="10" fill="#a07830">2–15 kPa</text><text x="119" y="234" text-anchor="middle" font-size="11" fill="#7b8ca0">总厚约 1–1.5 mm</text><path d="M362 150 L406 150" stroke="#185FA5" stroke-width="2" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#185FA5"/></marker></defs><text x="384" y="142" text-anchor="middle" font-size="10.5" fill="#185FA5">仿生</text><text x="578" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#123f6d">机器人分层皮肤（2026 量产方案）</text><rect x="412" y="66" width="332" height="38" rx="4" fill="#d9e8fb" stroke="#dbe7f4"/><text x="426" y="89" font-size="12.5" font-weight="700" fill="#123f6d">表皮层</text><text x="730" y="88" text-anchor="end" font-size="10" fill="#47607d">0–15 A　0.3–1.2 mm</text><rect x="412" y="107" width="332" height="52" rx="4" fill="#e7f0fc" stroke="#dbe7f4"/><text x="426" y="137" font-size="12.5" font-weight="700" fill="#123f6d">缓冲层</text><text x="730" y="136" text-anchor="end" font-size="10" fill="#47607d">20–40 A　0.5–2 mm</text><rect x="412" y="162" width="332" height="34" rx="4" fill="#f1f6fd" stroke="#dbe7f4"/><text x="426" y="183" font-size="12.5" font-weight="700" fill="#123f6d">基底层 / 界面</text><text x="730" y="182" text-anchor="end" font-size="10" fill="#47607d">0.1 mm 级　粘接·绝缘</text><text x="578" y="215" text-anchor="middle" font-size="11" fill="#7b8ca0">总厚约 1–2 mm（小鹏 IRON E-Skin 为 1.2 mm）</text><rect x="16" y="270" width="728" height="34" rx="8" fill="#fff8ec" stroke="#f2e0bb"/><text x="380" y="283" text-anchor="middle" font-size="11.5" fill="#7c4a12">关键推论一：像皮肤的不是「极软」，而是「薄硬皮 + 厚软垫」的模量梯度</text><text x="380" y="298" text-anchor="middle" font-size="11.5" fill="#7c4a12">关键推论二：人体总厚只有 1–1.5 mm，皮做到 3 mm 以上，即便模量匹配，力学响应也已经不像人</text></svg>
