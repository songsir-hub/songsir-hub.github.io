<g transform="translate(631.5,218.0) scale(0.86)" fill="none" stroke="#C07830" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-30 L0,34"/><path d="M-15,-14 Q0,-35 15,-14"/><path d="M-15,-14 L-11,1"/><path d="M-9,-18 L-4,1"/><path d="M15,-14 L11,1"/><path d="M9,-18 L4,1"/><path d="M-18,9 L18,9"/><path d="M-12,9 L-17,31"/><path d="M12,9 L17,31"/></g>
<text x="818.5" y="234.0" font-size="42" fill="#C07830" text-anchor="middle" font-weight="bold">來</text>
<text x="70" y="284" font-size="12.5" fill="#6B6255" text-anchor="start">象麦株之形：上穗、中茎、下叶与根</text>
<rect x="56" y="298" width="856" height="152" fill="#FFFDF7" stroke="#C9BFA8" stroke-width="1.4"/>
<text x="110.0" y="350" font-size="32" fill="#C07830" text-anchor="middle" font-weight="bold">麦</text>
<text x="110.0" y="376" font-size="12" fill="#6B6255" text-anchor="middle">来 + 夊</text>
<g transform="translate(257.5,354.0) scale(0.8)" fill="none" stroke="#C07830" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-40 L0,28"/><path d="M-7,-49 L0,-38 L7,-49"/><path d="M0,-38 L-19,-19"/><path d="M0,-27 L-20,-3"/><path d="M0,-38 L19,-19"/><path d="M0,-27 L20,-3"/><path d="M0,-9 L-17,4"/><path d="M0,-9 L17,4"/><path d="M0,28 L-16,40"/><path d="M0,28 L16,40"/></g><g transform="translate(257.5,354.0) scale(0.92)" fill="none" stroke="#C07830" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,42 Q0,35 14,42"/><path d="M0,38 L0,55"/><path d="M0,55 L-14,64"/><path d="M-2,45 L13,55"/></g>
