<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="腱绳六项性能要求">
  <rect width="800" height="340" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
    <!-- 强度 -->
    <rect x="24" y="40" width="228" height="118" rx="10" fill="#eef6ff" stroke="#185FA5" stroke-width="2"/>
    <text x="138" y="70" font-size="15" fill="#185FA5" text-anchor="middle" font-weight="bold">① 抗拉强度</text>
    <text x="138" y="94" font-size="12" fill="#47607d" text-anchor="middle">缆绳 ≥650 N</text>
    <text x="138" y="114" font-size="12" fill="#47607d" text-anchor="middle">3.5–4.0 GPa</text>
    <text x="138" y="140" font-size="12" fill="#166534" text-anchor="middle">✓ 已充分满足</text>

    <rect x="286" y="40" width="228" height="118" rx="10" fill="#fff5e8" stroke="#d97706" stroke-width="2"/>
    <text x="400" y="70" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">② 抗蠕变</text>
    <text x="400" y="94" font-size="12" fill="#7c4a12" text-anchor="middle">时间维度</text>
    <text x="400" y="114" font-size="12" fill="#7c4a12" text-anchor="middle">→ 零点漂移</text>
    <text x="400" y="140" font-size="12" fill="#b91c1c" text-anchor="middle">✗ 主要瓶颈</text>

    <rect x="548" y="40" width="228" height="118" rx="10" fill="#fff5e8" stroke="#d97706" stroke-width="2"/>
    <text x="662" y="70" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">③ 最小弯曲半径</text>
    <text x="662" y="94" font-size="12" fill="#7c4a12" text-anchor="middle">几何维度</text>
    <text x="662" y="114" font-size="12" fill="#7c4a12" text-anchor="middle">1–3 mm（传统 ≥5 mm）</text>
    <text x="662" y="140" font-size="12" fill="#b91c1c" text-anchor="middle">✗ 主要瓶颈</text>

    <rect x="24" y="180" width="228" height="118" rx="10" fill="#fff5e8" stroke="#d97706" stroke-width="2"/>
    <text x="138" y="210" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">④ 弯曲疲劳</text>
    <text x="138" y="234" font-size="12" fill="#7c4a12" text-anchor="middle">每日数千至上万次</text>
    <text x="138" y="254" font-size="12" fill="#7c4a12" text-anchor="middle">目标 100 万–1000 万次</text>
    <text x="138" y="280" font-size="12" fill="#b91c1c" text-anchor="middle">✗ 整机仅数周至数月</text>

    <rect x="286" y="180" width="228" height="118" rx="10" fill="#fff5e8" stroke="#d97706" stroke-width="2"/>
    <text x="400" y="210" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">⑤ 低摩擦</text>
    <text x="400" y="234" font-size="12" fill="#7c4a12" text-anchor="middle">界面维度</text>
    <text x="400" y="254" font-size="12" fill="#7c4a12" text-anchor="middle">涂层摩擦系数 &lt;0.08</text>
    <text x="400" y="280" font-size="12" fill="#b91c1c" text-anchor="middle">✗ 污染力矩估算</text>

    <rect x="548" y="180" width="228" height="118" rx="10" fill="#fff5e8" stroke="#d97706" stroke-width="2"/>
    <text x="662" y="210" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">⑥ 线径公差</text>
    <text x="662" y="234" font-size="12" fill="#7c4a12" text-anchor="middle">界面维度</text>
    <text x="662" y="254" font-size="12" fill="#7c4a12" text-anchor="middle">±0.005 mm</text>
    <text x="662" y="280" font-size="12" fill="#b91c1c" text-anchor="middle">✗ 影响张力一致性</text>
  </g>
  <text x="400" y="325" font-size="13" fill="#5b7086" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">结论：换更强的纤维，只解决六项中的一项</text>
</svg>
