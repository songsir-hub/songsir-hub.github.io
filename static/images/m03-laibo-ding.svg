<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="莱伯作旅鼎及铭文摹本">
  <title>莱伯作旅鼎及铭文摹本</title>
  <desc>图14-1 西周早期莱伯作旅鼎（黄县莱阴，今龙口鲁家沟出土）器形线描与铭文摹本。铭 33 字，记“惟公太保来伐反夷年……公锡旅贝十朋”，末缀族徽“来”（＝莱）。器主自铭“莱伯”，为胶东迄今最早自铭“莱”字铜器。</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#faf8f4"/>

  <text x="60" y="52" font-size="22" font-weight="600" fill="#2a2418" font-family="PingFang SC, Microsoft YaHei, sans-serif">莱伯作旅鼎</text>
  <text x="60" y="78" font-size="14" fill="#7a6a5a" font-family="PingFang SC, Microsoft YaHei, sans-serif">西周早期（成王前后）· 黄县莱阴（今龙口市石良镇鲁家沟）出土 · 胶东迄今最早自铭“莱”字铜器</text>

  <!-- ============ 左：器形线描 ============ -->
  <g transform="translate(80,130)">
    <text x="140" y="0" text-anchor="middle" font-size="17" font-weight="600" fill="#2a2418" font-family="PingFang SC, Microsoft YaHei, sans-serif">器形</text>
    <g transform="translate(0,44)">
      <!-- 双立耳 -->
      <path d="M56 96 L40 76 Q34 68, 42 60 L56 52" fill="none" stroke="#5a4e3a" stroke-width="6" stroke-linecap="round"/>
      <path d="M224 96 L240 76 Q246 68, 238 60 L224 52" fill="none" stroke="#5a4e3a" stroke-width="6" stroke-linecap="round"/>
      <!-- 口沿 -->
      <path d="M48 96 Q140 74, 232 96 L228 114 Q140 94, 52 114 Z" fill="#e8e0d0" stroke="#5a4e3a" stroke-width="2.8"/>
      <!-- 腹部 -->
      <path d="M52 114 Q140 94, 228 114 Q234 178, 204 226 Q140 248, 76 226 Q46 178, 52 114 Z" fill="#f5f0e6" stroke="#5a4e3a" stroke-width="3"/>
      <!-- 纹饰带（弦纹 + 窃曲纹） -->
      <path d="M56 130 Q140 112, 224 130" fill="none" stroke="#8a7a6a" stroke-width="2"/>
      <path d="M54 142 Q140 124, 226 142" fill="none" stroke="#8a7a6a" stroke-width="1.6"/>
      <path d="M58 156 Q140 140, 222 156" fill="none" stroke="#8a7a6a" stroke-width="1.2"/>
      <!-- 饕餮纹示意 -->
      <g stroke="#a09080" stroke-width="1.2" fill="none">
        <path d="M92 186 Q104 176, 116 186 M164 186 Q176 176, 188 186"/>
        <circle cx="104" cy="196" r="3" fill="#a09080"/>
        <circle cx="176" cy="196" r="3" fill="#a09080"/>
        <path d="M116 190 Q140 200, 164 190"/>
      </g>
      <!-- 铭文区示意 -->
      <rect x="124" y="176" width="32" height="30" rx="2" fill="#f8f4ec" stroke="#a09080" stroke-width="1"/>
      <text x="140" y="198" text-anchor="middle" font-size="14" fill="#3a2e1e" font-family="KaiTi, STKaiti, serif">莱</text>
      <!-- 三足 -->
      <path d="M86 226 Q78 258, 70 284 Q68 294, 78 296 L92 296 Q100 294, 98 284 Q92 254, 98 226 Z" fill="#ede6d8" stroke="#5a4e3a" stroke-width="2.2"/>
      <path d="M194 226 Q202 258, 210 284 Q212 294, 202 296 L188 296 Q180 294, 182 284 Q188 254, 182 226 Z" fill="#ede6d8" stroke="#5a4e3a" stroke-width="2.2"/>
      <path d="M132 232 Q132 260, 134 286 Q135 296, 145 296 L155 296 Q163 294, 160 284 Q152 258, 148 232 Z" fill="#ede6d8" stroke="#5a4e3a" stroke-width="2.2"/>
    </g>
    <g transform="translate(276,60)">
      <line x1="0" y1="0" x2="0" y2="296" stroke="#a09080" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#a09080" stroke-width="1.4"/>
      <line x1="-5" y1="296" x2="5" y2="296" stroke="#a09080" stroke-width="1.4"/>
      <text x="8" y="152" font-size="14" fill="#7a6a5a" font-family="PingFang SC, Microsoft YaHei, sans-serif">缩尺示意</text>
    </g>
  </g>

  <!-- ============ 右：铭文摹本 ============ -->
  <g transform="translate(470,130)">
    <text x="320" y="0" text-anchor="middle" font-size="17" font-weight="600" fill="#2a2418" font-family="PingFang SC, Microsoft YaHei, sans-serif">铭文 33 字（摹本）</text>

    <rect x="0" y="26" width="640" height="330" rx="10" fill="#3a342a" stroke="#8a7a6a" stroke-width="2"/>

    <!-- 铭文行（示意排布，5 行） -->
    <g fill="#e8e0cc" font-family="KaiTi, STKaiti, serif" text-anchor="middle">
      <g opacity="0.55">
        <text x="40" y="76" font-size="26">惟</text><text x="82" y="76" font-size="26">公</text><text x="124" y="76" font-size="26">太</text><text x="166" y="76" font-size="26">保</text><text x="208" y="76" font-size="26">来</text><text x="250" y="76" font-size="26">伐</text><text x="292" y="76" font-size="26">反</text><text x="334" y="76" font-size="26">夷</text>
      </g>
      <g opacity="0.55">
        <text x="40" y="126" font-size="26">年</text><text x="82" y="126" font-size="26">▤</text><text x="124" y="126" font-size="26">▤</text><text x="166" y="126" font-size="26">▤</text><text x="208" y="126" font-size="26">▤</text><text x="250" y="126" font-size="26">▤</text><text x="292" y="126" font-size="26">▤</text>
      </g>
      <g opacity="0.55">
        <text x="40" y="176" font-size="26">▤</text><text x="82" y="176" font-size="26">▤</text><text x="124" y="176" font-size="26">▤</text><text x="166" y="176" font-size="26">公</text><text x="208" y="176" font-size="26">锡</text><text x="250" y="176" font-size="26">旅</text><text x="292" y="176" font-size="26">贝</text><text x="334" y="176" font-size="26">十</text><text x="376" y="176" font-size="26">朋</text>
      </g>
      <g opacity="0.55">
        <text x="40" y="226" font-size="26">▤</text><text x="82" y="226" font-size="26">▤</text><text x="124" y="226" font-size="26">▤</text><text x="166" y="226" font-size="26">▤</text><text x="208" y="226" font-size="26">▤</text><text x="250" y="226" font-size="26">▤</text><text x="292" y="226" font-size="26">▤</text><text x="334" y="226" font-size="26">▤</text>
      </g>
      <!-- 族徽“来” -->
      <g opacity="0.9">
        <text x="40" y="296" font-size="30" fill="#ffe8b0">族徽</text>
        <text x="150" y="302" font-size="42" fill="#ffe8b0">来</text>
        <text x="220" y="296" font-size="20" fill="#e8e0cc">（＝莱）</text>
      </g>
    </g>

    <rect x="0" y="372" width="640" height="72" rx="8" fill="#f4f0e6" stroke="#e0d8c8" stroke-width="1"/>
    <text x="18" y="400" font-size="15" fill="#3a2e1e" font-family="PingFang SC, Microsoft YaHei, sans-serif">铭文记旅从召公（太保）“伐反夷”，战后受赐贝十朋，因作此鼎。</text>
    <text x="18" y="428" font-size="14" fill="#8a2a1a" font-family="PingFang SC, Microsoft YaHei, sans-serif">器主自铭“莱伯”，文末族徽“来”与“莱”同字异写。</text>
  </g>

  <!-- 底部：意义条 -->
  <g transform="translate(60,640)">
    <rect x="0" y="0" width="1080" height="76" rx="10" fill="#ffffff" stroke="#e0d8c8" stroke-width="1"/>
    <text x="24" y="30" font-size="15" fill="#3a2e1a" font-family="PingFang SC, Microsoft YaHei, sans-serif">年代坐标：西周早期（成王前后）——距前 690 年纪侯大去其国已逾三百年，远早于任何可设想的“莱国东迁”。</text>
    <text x="24" y="56" font-size="14" fill="#4a3e2a" font-family="PingFang SC, Microsoft YaHei, sans-serif">王献唐《黄县㠱器》曾误释族徽为“华”；1976 年日照崮河崖出土莱伯鬲后，陈梦家、唐兰“莱伯”之释获独立印证。</text>
  </g>

  <text x="60" y="748" font-size="12" fill="#a09080" font-family="PingFang SC, Microsoft YaHei, sans-serif">据《黄县㠱器》及《殷周金文集成》著录信息摹绘；器物图版受版权保护，此处为示意性线描。</text>
</svg>
