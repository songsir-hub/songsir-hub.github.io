<text x="30" y="42" font-size="25" font-weight="700" fill="#1B3A6B">图1　“AI检测”误伤实录：被打成机器写的，全是纯人工作品</text>
<text x="30" y="70" font-size="16" fill="#555555">以下均为作者本人手写的作品，且多数写于AI问世之前</text>
