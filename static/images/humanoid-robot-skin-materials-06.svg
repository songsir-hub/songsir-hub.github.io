<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="300" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">三条流行说法的定量证伪</text><rect x="16" y="40" width="232" height="242" rx="12" fill="#fbfcfe" stroke="#cfe0f2"/><text x="28" y="64" font-size="12.5" font-weight="700" fill="#7b8ca0">流行：硅胶阻碍散热</text><text x="28" y="84" font-size="13" font-weight="700" fill="#c53030">量级上不成立</text><text x="28" y="105" font-size="9.5" fill="#47607d">硅胶 2 mm</text><rect x="96" y="94" width="30" height="14" rx="3" fill="#93c5fd"/><text x="132" y="105" font-size="10" font-weight="700" fill="#185FA5">0.0067 K/W</text><text x="28" y="127" font-size="9.5" fill="#47607d">空气 1 mm</text><rect x="96" y="116" width="94" height="14" rx="3" fill="#f6ad55"/><text x="196" y="127" font-size="10" font-weight="700" fill="#e0a92e">0.026 K/W</text><text x="28" y="145" font-size="9.5" fill="#7b8ca0">单位 K/W　按 1.5 m²、2 mm 与 1 mm 厚计</text><line x1="28" y1="154" x2="236" y2="154" stroke="#cfe0f2"/><text x="28" y="172" font-size="10.5" fill="#47607d">200 W 发热经 1.5 m² 皮肤</text><text x="28" y="188" font-size="10.5" fill="#47607d">导出仅约 1.3 K 温升</text><text x="28" y="204" font-size="10.5" fill="#47607d">真正的瓶颈是贴合气隙</text><text x="28" y="220" font-size="10.5" fill="#47607d">解法是「贴得住」</text><text x="28" y="240" font-size="10.5" font-weight="700" fill="#c53030">不是换导热材料</text><rect x="264" y="40" width="232" height="242" rx="12" fill="#fbfcfe" stroke="#cfe0f2"/><text x="276" y="64" font-size="12.5" font-weight="700" fill="#7b8ca0">流行：关节处皮肤会被拉断</text><text x="276" y="84" font-size="13" font-weight="700" fill="#c53030">应变比极限低两个数量级</text><text x="276" y="108" font-size="14" font-weight="700" fill="#123f6d">ε ≈ t / (2R)</text><text x="276" y="130" font-size="10.5" fill="#47607d">指关节 R≈10 mm</text><text x="484" y="130" text-anchor="end" font-size="10.5" font-weight="700" fill="#185FA5">8%–12%</text><text x="276" y="147" font-size="10.5" fill="#47607d">肘/膝 R≈35 mm</text><text x="484" y="147" text-anchor="end" font-size="10.5" font-weight="700" fill="#185FA5">4%–5%</text><text x="276" y="164" font-size="10.5" fill="#47607d">腰颈 R≈80 mm</text><text x="484" y="164" text-anchor="end" font-size="10.5" font-weight="700" fill="#185FA5">1.5%–2.5%</text><line x1="276" y1="181" x2="484" y2="181" stroke="#cfe0f2"/><text x="276" y="197" font-size="10.5" font-weight="700" fill="#2f855a">硅胶断裂伸长率 300%–1000%</text><text x="276" y="215" font-size="10.5" fill="#47607d">真实难题是：</text><text x="276" y="231" font-size="10.5" fill="#47607d">① 褶皱堆积与夹肉</text><text x="276" y="247" font-size="10.5" fill="#47607d">② 屈曲疲劳（非拉伸）</text><text x="276" y="263" font-size="10.5" fill="#47607d">③ 与骨架脱粘</text><rect x="512" y="40" width="232" height="242" rx="12" fill="#fbfcfe" stroke="#cfe0f2"/><text x="524" y="64" font-size="12.5" font-weight="700" fill="#7b8ca0">流行：越软越像人</text><text x="524" y="84" font-size="13" font-weight="700" fill="#c53030">人体其实「拉不了那么长」</text><rect x="524" y="96" width="60" height="16" rx="3" fill="#f6ad55"/><text x="592" y="108" font-size="10" fill="#47607d">人体皮肤 30%–70%</text><rect x="524" y="120" width="208" height="16" rx="3" fill="#93c5fd"/><text x="524" y="152" font-size="10" fill="#47607d">硅胶 300%–1000%（十倍以上）</text><line x1="524" y1="162" x2="732" y2="162" stroke="#cfe0f2"/><path d="M528 268 q14 -24 34 -26 q24 -2 34 18" fill="none" stroke="#185FA5" stroke-width="2.5"/><text x="604" y="258" font-size="10.5" fill="#47607d">人体：J 形曲线</text><text x="604" y="273" font-size="10" fill="#7b8ca0">（小变形软、大变形硬）</text><text x="524" y="180" font-size="10.5" fill="#47607d">该仿的不是「软」，是：</text><text x="524" y="195" font-size="10.5" fill="#47607d">① 薄硬皮 + 厚软垫的梯度</text><text x="524" y="210" font-size="10.5" fill="#47607d">② 大变形段的 J 形硬化</text><text x="524" y="225" font-size="10.5" fill="#47607d">③ 厚度逼近 1–1.5 mm</text></svg>
