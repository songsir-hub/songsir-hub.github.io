<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,'宋体',serif">
  <rect width="920" height="420" fill="#FBF8F1"/>
  <text x="460" y="36" font-size="20" font-weight="bold" fill="#3A3226" text-anchor="middle">图3：全球主要航天港发射频率对比</text>
  <text x="460" y="56" font-size="12.5" fill="#6B6255" text-anchor="middle">Figure 3: Annual Launch Frequency Comparison (次/年, 含目标值)</text>

  <!-- axis -->
  <line x1="80" y1="90" x2="80" y2="360" stroke="#8B7355" stroke-width="1.6"/>
  <line x1="80" y1="360" x2="860" y2="360" stroke="#8B7355" stroke-width="1.6"/>
  <text x="470" y="388" font-size="11.5" fill="#6B6255" text-anchor="middle">年发射次数（次/年）</text>

  <!-- y ticks 0..35 -->
  <g font-size="11" fill="#6B6255" text-anchor="end">
    <line x1="76" y1="360" x2="80" y2="360" stroke="#8B7355"/><text x="72" y="364">0</text>
    <line x1="76" y1="282" x2="80" y2="282" stroke="#8B7355"/><text x="72" y="286">10</text>
    <line x1="76" y1="204" x2="80" y2="204" stroke="#8B7355"/><text x="72" y="208">20</text>
    <line x1="76" y1="126" x2="80" y2="126" stroke="#8B7355"/><text x="72" y="130">30</text>
  </g>
  <!-- dashed gridlines -->
  <g stroke="#d8d0c0" stroke-dasharray="3 4">
    <line x1="80" y1="282" x2="860" y2="282"/>
    <line x1="80" y1="204" x2="860" y2="204"/>
    <line x1="80" y1="126" x2="860" y2="126"/>
  </g>

  <!-- bars (scale: 7.8px per unit; 10->78, 20->156, 30->234; y baseline 360) -->
  <!-- 1 德州 10-15: use 15 top=360-117=243 -->
  <rect x="120" y="243" width="120" height="117" fill="#8FB39A"/>
  <text x="180" y="233" font-size="13" font-weight="bold" fill="#3A3226" text-anchor="middle">10–15</text>
  <text x="180" y="382" font-size="12" fill="#3A3226" text-anchor="middle">德州(博卡奇卡)</text>

  <!-- 2 范登堡 20-30: use 30 top=360-234=126 -->
  <rect x="270" y="126" width="120" height="234" fill="#A9CBE4"/>
  <text x="330" y="116" font-size="13" font-weight="bold" fill="#3A3226" text-anchor="middle">20–30</text>
  <text x="330" y="382" font-size="12" fill="#3A3226" text-anchor="middle">范登堡</text>

  <!-- 3 肯尼迪 ~15: top=360-117=243 -->
  <rect x="420" y="243" width="120" height="117" fill="#A9CBE4"/>
  <text x="480" y="233" font-size="13" font-weight="bold" fill="#3A3226" text-anchor="middle">≈15</text>
  <text x="480" y="382" font-size="12" fill="#3A3226" text-anchor="middle">肯尼迪(高峰)</text>

  <!-- 4 拜科努尔 ~15: top=243 -->
  <rect x="570" y="243" width="120" height="117" fill="#A9CBE4"/>
  <text x="630" y="233" font-size="13" font-weight="bold" fill="#3A3226" text-anchor="middle">≈15</text>
  <text x="630" y="382" font-size="12" fill="#3A3226" text-anchor="middle">拜科努尔</text>

  <!-- 5 路州 目标30/天 = 10950/年 -> mark as off-scale with note -->
  <rect x="720" y="90" width="120" height="270" fill="#E8A65C" fill-opacity="0.55"/>
  <text x="780" y="80" font-size="13.5" font-weight="bold" fill="#C07830" text-anchor="middle">30/天</text>
  <text x="780" y="382" font-size="12" font-weight="bold" fill="#C07830" text-anchor="middle">路州(目标)</text>

  <text x="460" y="410" font-size="10.5" fill="#8A8578" text-anchor="middle">注：路州目标 30 次/天 ≈ 10,950 次/年，远超传统航天港（条形按图中断，仅示意量级）；数据源自正文发射频率表</text>
<text x="98%" y="98%" text-anchor="end" font-size="11" fill="#6B6255" font-family="serif" opacity="0.75">松朗制图</text>
</svg>
