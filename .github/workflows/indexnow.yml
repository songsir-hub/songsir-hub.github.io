# IndexNow 自动提交（Bing + Yandex + Seznam）
# 触发：Hugo 构建部署成功后自动执行
#
# 工作原理：
#   1. 构建 Hugo 站点，生成 sitemap.xml
#   2. 从仓库根目录读取 IndexNow key 文件（64 位 hex，内容为 key 本身）
#   3. 将 URL 提交到 Bing / Yandex / Seznam 的 IndexNow 端点
#
# 前置条件：
#   - 仓库根目录有 {INDEXNOW_KEY}.txt 文件（内容 = 64 位 hex key）
#   - key 文件会被 Hugo 构建复制到站点根目录
#   - 仓库 Secrets 中配置 INDEXNOW_KEY（可选，工作流会自动检测）
name: IndexNow Submission

on:
  workflow_run:
    workflows: ["Deploy Hugo site to Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  indexnow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build site
        run: hugo --minify

      - name: Extract URLs from sitemap
        id: extract
        run: |
          if [ -f public/sitemap.xml ]; then
            URLS=$(grep -oP '<loc>\K[^<]+' public/sitemap.xml | python3 -c "
            import sys, json
            urls = [l.strip() for l in sys.stdin if l.strip()]
            print(json.dumps(urls))
            ")
            COUNT=$(echo "$URLS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
            echo "urls=$URLS" >> $GITHUB_OUTPUT
            echo "Extracted $COUNT URLs from sitemap"
          else
            echo "urls=[]" >> $GITHUB_OUTPUT
            echo "WARNING: public/sitemap.xml not found, skipping"
          fi

      - name: Detect IndexNow key
        id: getkey
        run: |
          # 方法 1：从仓库根目录找 .txt 文件（内容为 64 位 hex key）
          KEY_FILE=$(find . -maxdepth 1 -name '*.txt' ! -name 'robots*' 2>/dev/null | head -1)

          # 方法 2：从 static/ 目录找
          if [ -z "$KEY_FILE" ]; then
            KEY_FILE=$(find static/ -maxdepth 1 -name '*.txt' ! -name 'robots*' 2>/dev/null | head -1)
          fi

          # 方法 3：从 Secrets 读取
          if [ -z "$KEY_FILE" ] && [ -n "${{ secrets.INDEXNOW_KEY }}" ]; then
            KEY="${{ secrets.INDEXNOW_KEY }}"
            echo "Using INDEXNOW_KEY from GitHub Secrets"
          elif [ -n "$KEY_FILE" ]; then
            KEY=$(cat "$KEY_FILE")
            echo "Key file: $KEY_FILE"
          else
            KEY=""
            echo "WARNING: No IndexNow key found (checked root .txt, static/ .txt, and secrets)"
          fi

          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "key_file=$KEY_FILE" >> $GITHUB_OUTPUT

          # 验证 key 格式（应为 64 位 hex）
          if [ -n "$KEY" ]; then
            if echo "$KEY" | grep -qE '^[a-f0-9]{64}$'; then
              echo "Key format valid (64 hex chars)"
            else
              echo "WARNING: Key does not look like a 64-char hex string"
            fi
          fi

      - name: Submit to Bing IndexNow
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: ${{ github.repository_owner }}.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          # 分批提交，每批最多 1000 条
          batch_size = 1000
          total = 0
          for i in range(0, len(urls), batch_size):
              chunk = urls[i:i+batch_size]
              body = {"host": host, "key": key, "urlList": chunk}
              req = urllib.request.Request(
                  "https://www.bing.com/indexnow",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.loads(resp.read().decode())
                      rid = result.get('bingRequestId', 'N/A')
                      print(f"Bing: HTTP {resp.status}, batch {i//batch_size+1}, {len(chunk)} URLs, RequestID={rid}")
                      total += len(chunk)
              except urllib.error.HTTPError as e:
                  print(f"Bing: HTTP {e.code}, batch {i//batch_size+1}: {e.read().decode()[:200]}")
                  total += len(chunk)
              except Exception as e:
                  print(f"Bing: Error - {e}")
                  total += len(chunk)
          print(f"Bing: Total {total}/{len(urls)} URLs submitted")
          PY

      - name: Submit to Yandex
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: ${{ github.repository_owner }}.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          batch_size = 1000
          total = 0
          for i in range(0, len(urls), batch_size):
              chunk = urls[i:i+batch_size]
              body = {"host": host, "key": key, "urlList": chunk}
              req = urllib.request.Request(
                  "https://yandex.com/indexnow",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Yandex: HTTP {resp.status}, batch {i//batch_size+1}, {len(chunk)} URLs")
                      total += len(chunk)
              except urllib.error.HTTPError as e:
                  print(f"Yandex: HTTP {e.code}, batch {i//batch_size+1}: {e.read().decode()[:200]}")
                  total += len(chunk)
              except Exception as e:
                  print(f"Yandex: Error - {e}")
                  total += len(chunk)
          print(f"Yandex: Total {total}/{len(urls)} URLs submitted")
          PY

      - name: Submit to Seznam
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: ${{ github.repository_owner }}.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          batch_size = 1000
          total = 0
          for i in range(0, len(urls), batch_size):
              chunk = urls[i:i+batch_size]
              body = {"host": host, "key": key, "urlList": chunk}
              req = urllib.request.Request(
                  "https://search.seznam.cz/indexnow",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Seznam: HTTP {resp.status}, batch {i//batch_size+1}, {len(chunk)} URLs")
                      total += len(chunk)
              except urllib.error.HTTPError as e:
                  print(f"Seznam: HTTP {e.code}, batch {i//batch_size+1}: {e.read().decode()[:200]}")
                  total += len(chunk)
              except Exception as e:
                  print(f"Seznam: Error - {e}")
                  total += len(chunk)
          print(f"Seznam: Total {total}/{len(urls)} URLs submitted")
          PY

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo ""
          echo "=== IndexNow Submission Summary ==="
          echo "Key source: ${{ steps.getkey.outputs.key_file || 'secrets.INDEXNOW_KEY' }}"
          echo "URLs extracted: $(echo '${{ steps.extract.outputs.urls }}' | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo '0')"
          echo "Note: Google does NOT support IndexNow. For Google, submit sitemap manually via Search Console."
          echo "========================================"
