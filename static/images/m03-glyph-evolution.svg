<g transform="translate(631.5,352.0) scale(0.74)" fill="none" stroke="#C07830" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-30 L0,34"/><path d="M-15,-14 Q0,-35 15,-14"/><path d="M-15,-14 L-11,1"/><path d="M-9,-18 L-4,1"/><path d="M15,-14 L11,1"/><path d="M9,-18 L4,1"/><path d="M-18,9 L18,9"/><path d="M-12,9 L-17,31"/><path d="M12,9 L17,31"/></g><g transform="translate(631.5,352.0) scale(0.92)" fill="none" stroke="#C07830" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-14,42 Q0,35 14,42"/><path d="M0,38 L0,55"/><path d="M0,55 L-14,64"/><path d="M-2,45 L13,55"/></g>
<text x="818.5" y="386.0" font-size="42" fill="#C07830" text-anchor="middle" font-weight="bold">麦</text>
<text x="70" y="436" font-size="12.5" fill="#6B6255" text-anchor="start">「来」下加「夊」（脚），《说文》所谓「天所来也」</text>
<rect x="56" y="450" width="856" height="152" fill="#FFFDF7" stroke="#C9BFA8" stroke-width="1.4"/>
<text x="110.0" y="502" font-size="32" fill="#6E9450" text-anchor="middle" font-weight="bold">莱</text>
<text x="110.0" y="528" font-size="12" fill="#6B6255" text-anchor="middle">艸 + 来</text>
<circle cx="257.5" cy="516.0" r="26" fill="none" stroke="#9A9186" stroke-width="2.4" stroke-dasharray="6 5"/><line x1="238.5" y1="497.0" x2="276.5" y2="535.0" stroke="#9A9186" stroke-width="2.4"/><text x="257.5" y="556.0" font-size="12" fill="#9A9186" text-anchor="middle">卜辞无此形</text>
<circle cx="444.5" cy="516.0" r="26" fill="none" stroke="#9A9186" stroke-width="2.4" stroke-dasharray="6 5"/><line x1="425.5" y1="497.0" x2="463.5" y2="535.0" stroke="#9A9186" stroke-width="2.4"/><text x="444.5" y="556.0" font-size="12" fill="#9A9186" text-anchor="middle">金文无此形</text>
<g transform="translate(631.5,528.0) scale(0.72)" fill="none" stroke="#6E9450" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-30 L0,34"/><path d="M-15,-14 Q0,-35 15,-14"/><path d="M-15,-14 L-11,1"/><path d="M-9,-18 L-4,1"/><path d="M15,-14 L11,1"/><path d="M9,-18 L4,1"/><path d="M-18,9 L18,9"/><path d="M-12,9 L-17,31"/><path d="M12,9 L17,31"/></g><g transform="translate(631.5,528.0) scale(1.0)" fill="none" stroke="#6E9450" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-21,-54 L-21,-32"/><path d="M-28,-44 L-14,-44"/><path d="M3,-54 L3,-32"/><path d="M-4,-44 L10,-44"/></g>
<text x="818.5" y="538.0" font-size="42" fill="#6E9450" text-anchor="middle" font-weight="bold">莱</text>
<text x="70" y="588" font-size="12.5" fill="#6B6255" text-anchor="start">草字头加「来」声：藜、荒田、除草</text>
<line x1="164" y1="106" x2="164" y2="602" stroke="#C9BFA8" stroke-width="1.4"/>
<line x1="351" y1="106" x2="351" y2="602" stroke="#C9BFA8" stroke-width="1.4"/>
<line x1="538" y1="106" x2="538" y2="602" stroke="#C9BFA8" stroke-width="1.4"/>
<line x1="725" y1="106" x2="725" y2="602" stroke="#C9BFA8" stroke-width="1.4"/>
<rect x="56" y="632" width="856" height="58" rx="8" fill="#F2EAD8" stroke="#C9BFA8" stroke-width="1.6"/>
<text x="74" y="656" font-size="14" fill="#3A3226" text-anchor="start" font-weight="bold">关键事实：先秦卜辞与铜器上从未出现过艸头的「莱」。</text>
<text x="74" y="678" font-size="13" fill="#6B6255" text-anchor="start">莱国之名的那个字，在金文里写作「釐」或「来」——「莱」是后起的形声写法。</text>
<text x="912" y="690" font-size="11.5" fill="#6B6255" text-anchor="end">作图：松朗</text>
