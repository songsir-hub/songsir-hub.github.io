<svg viewBox="0 0 760 286" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="286" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">全身包覆的两笔账：重量与热阻</text><text x="190" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#123f6d">① 皮肤自重（可算）</text><text x="60" y="74" font-size="11.5" fill="#47607d" font-weight="400">表面积 A ≈ 1.5–1.9 m²</text><text x="60" y="92" font-size="11.5" fill="#47607d" font-weight="400">厚度 t ≈ 2 mm</text><text x="60" y="110" font-size="11.5" fill="#47607d" font-weight="400">密度 ρ ≈ 1.07–1.10 g/cm³</text><text x="60" y="128" font-size="11.5" fill="#47607d" font-weight="400"></text><text x="60" y="146" font-size="11.5" fill="#c53030" font-weight="400">m = A × t × ρ ≈ 3.2–4.2 kg</text><text x="60" y="164" font-size="11.5" fill="#47607d" font-weight="400"></text><text x="60" y="182" font-size="11.5" fill="#47607d" font-weight="400">加缓冲层与传感层后</text><text x="60" y="200" font-size="11.5" fill="#47607d" font-weight="400">整套皮肤系统 > 5 kg</text><rect x="60" y="222" width="260" height="34" rx="8" fill="#fff5f5" stroke="#fed7d7"/><text x="190" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">对 60–70 kg 整机是 7%–8% 自重</text><line x1="380" y1="60" x2="380" y2="266" stroke="#cfe0f2" stroke-dasharray="4 4"/><text x="570" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#123f6d">② 散热代价（可算）</text><text x="440" y="76" font-size="11.5" fill="#47607d">硅胶热导率 k ≈ 0.2 W/(m·K)</text><text x="440" y="96" font-size="11.5" fill="#47607d">热阻 R = t / (k × A)</text><text x="440" y="120" font-size="12.5" font-weight="700" fill="#185FA5">R ≈ 0.0067 K/W</text><text x="440" y="144" font-size="11.5" fill="#47607d">200 W 全量导出 → ΔT ≈ 1.3 K</text><line x1="440" y1="156" x2="700" y2="156" stroke="#cfe0f2"/><text x="440" y="176" font-size="11.5" font-weight="700" fill="#e0a92e">对照：1 mm 空气层 R ≈ 0.026 K/W</text><text x="440" y="196" font-size="11.5" fill="#47607d">是硅胶层的约 4 倍</text><rect x="440" y="206" width="260" height="52" rx="8" fill="#fffbf2" stroke="#f2e0bb"/><text x="456" y="224" font-size="11" fill="#8a5d0c">结论：硅胶层本身几乎不是瓶颈</text><text x="456" y="242" font-size="11" fill="#8a5d0c">散热的正确解法是「贴得住」</text><text x="456" y="258" font-size="11" fill="#8a5d0c">（结构贴合 + 界面导热 + 局部风道）</text><rect x="16" y="272" width="728" height="8" rx="4" fill="#eef4fb"/></svg>
