<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="新概念英语点读学习">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a3d"/>
      <stop offset="0.55" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0f3a5c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d78a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装饰圆点 -->
  <circle cx="1080" cy="110" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="560" r="120" fill="#ffffff" opacity="0.04"/>
  <circle cx="1010" cy="520" r="60" fill="url(#gold)" opacity="0.18"/>

  <!-- 左侧：书 + 音波 -->
  <g filter="url(#soft)">
    <rect x="120" y="170" width="230" height="300" rx="14" fill="#f7f4ec" stroke="#d9a441" stroke-width="3"/>
    <rect x="150" y="210" width="170" height="12" rx="6" fill="#164e63"/>
    <rect x="150" y="236" width="150" height="12" rx="6" fill="#164e63" opacity="0.7"/>
    <rect x="150" y="262" width="160" height="12" rx="6" fill="#164e63" opacity="0.5"/>
    <text x="235" y="410" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#d9a441" text-anchor="middle">NCE</text>
  </g>
  <!-- 音波 -->
  <g fill="url(#gold)">
    <rect x="372" y="270" width="10" height="60" rx="5"/>
    <rect x="392" y="250" width="10" height="100" rx="5"/>
    <rect x="412" y="300" width="10" height="30" rx="5"/>
    <rect x="432" y="240" width="10" height="120" rx="5"/>
    <rect x="452" y="280" width="10" height="50" rx="5"/>
    <rect x="472" y="260" width="10" height="90" rx="5"/>
    <rect x="492" y="300" width="10" height="30" rx="5"/>
  </g>

  <!-- 右侧：标题与副标题 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="560" y="290" font-size="58" font-weight="700" fill="#ffffff">新概念英语</text>
    <text x="560" y="360" font-size="40" font-weight="700" fill="url(#gold)">点读学习</text>
    <line x1="562" y1="392" x2="1030" y2="392" stroke="url(#gold)" stroke-width="2"/>
    <text x="560" y="430" font-size="24" fill="#cfe3ef">全四册 · 课文朗读 · 单句点读 · 中英对照</text>
    <text x="560" y="470" font-size="24" fill="#cfe3ef">1997 版 / 1985 版 · 响应式 · 无需安装</text>
  </g>

  <!-- 落款水印（篆风印章） -->
  <g transform="translate(1058,536)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#b5301f"/>
    <text x="60" y="52" font-family="'STKaiti','KaiTi',serif" font-size="30" fill="#fff" text-anchor="middle">松朗</text>
    <text x="60" y="94" font-family="'STKaiti','KaiTi',serif" font-size="30" fill="#fff" text-anchor="middle">制</text>
  </g>
  <text x="940" y="600" font-family="'PingFang SC',sans-serif" font-size="15" fill="#9fb8c7" text-anchor="end">松朗制造 · 博雅小筑</text>
</svg>
