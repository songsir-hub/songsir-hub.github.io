<svg viewBox="0 0 760 288" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="286" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">触觉不是一个能力，是四个层次 —— 且指标互相冲突</text><rect x="16" y="44" width="500" height="40" rx="6" fill="#fce7c8" stroke="#cfe0f2"/><circle cx="42" cy="64" r="13" fill="#185FA5"/><text x="42" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">L4</text><text x="64" y="69" font-size="12.5" font-weight="700" fill="#123f6d">材质与热</text><text x="176" y="69" font-size="11" fill="#47607d">软硬、热导、材质类别、接近觉</text><text x="504" y="69" text-anchor="end" font-size="10.5" fill="#7b8ca0">模态数量 · 解耦能力</text><rect x="16" y="90" width="500" height="40" rx="6" fill="#fbeedb" stroke="#cfe0f2"/><circle cx="42" cy="110" r="13" fill="#185FA5"/><text x="42" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">L3</text><text x="64" y="115" font-size="12.5" font-weight="700" fill="#123f6d">滑移与纹理</text><text x="176" y="115" font-size="11" fill="#47607d">相对滑动、表面微结构</text><text x="504" y="115" text-anchor="end" font-size="10.5" fill="#7b8ca0">带宽 ≥100 Hz · 信噪比</text><rect x="16" y="136" width="500" height="40" rx="6" fill="#e7f0fc" stroke="#cfe0f2"/><circle cx="42" cy="156" r="13" fill="#185FA5"/><text x="42" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">L2</text><text x="64" y="161" font-size="12.5" font-weight="700" fill="#123f6d">力矢量</text><text x="176" y="161" font-size="11" fill="#47607d">法向力、切向力、力矩</text><text x="504" y="161" text-anchor="end" font-size="10.5" fill="#7b8ca0">量程 · 分辨率 · 串扰 · 迟滞</text><rect x="16" y="182" width="500" height="40" rx="6" fill="#d9e8fb" stroke="#cfe0f2"/><circle cx="42" cy="202" r="13" fill="#185FA5"/><text x="42" y="206" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">L1</text><text x="64" y="207" font-size="12.5" font-weight="700" fill="#123f6d">接触检测</text><text x="176" y="207" font-size="11" fill="#47607d">碰到了没有、碰在哪里</text><text x="504" y="207" text-anchor="end" font-size="10.5" fill="#7b8ca0">空间分辨率（taxel 间距）</text><text x="16" y="244" font-size="10.5" fill="#7b8ca0">越往上，对带宽与模态的要求越高；且 L2 要大量程、L3 要高灵敏 —— 物理上冲突</text><line x1="528" y1="44" x2="528" y2="270" stroke="#cfe0f2" stroke-dasharray="4 4"/><text x="642" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#123f6d">按部位分配（而非全身全栈）</text><rect x="540" y="50" width="204" height="38" rx="6" fill="#d9e8fb" stroke="#cfe0f2"/><text x="552" y="74" font-size="11.5" font-weight="700" fill="#123f6d">指尖 / 指腹</text><text x="732" y="74" text-anchor="end" font-size="10.5" fill="#47607d">L1–L4 全栈</text><rect x="540" y="94" width="204" height="38" rx="6" fill="#e7f0fc" stroke="#cfe0f2"/><text x="552" y="118" font-size="11.5" font-weight="700" fill="#123f6d">手掌</text><text x="732" y="118" text-anchor="end" font-size="10.5" fill="#47607d">L1–L3</text><rect x="540" y="138" width="204" height="38" rx="6" fill="#f1f6fd" stroke="#cfe0f2"/><text x="552" y="162" font-size="11.5" font-weight="700" fill="#123f6d">前臂 / 小腿</text><text x="732" y="162" text-anchor="end" font-size="10.5" fill="#47607d">L1–L2</text><rect x="540" y="182" width="204" height="38" rx="6" fill="#f7fafc" stroke="#cfe0f2"/><text x="552" y="206" font-size="11.5" font-weight="700" fill="#123f6d">躯干 / 背部</text><text x="732" y="206" text-anchor="end" font-size="10.5" fill="#47607d">L1（接触检测）</text><rect x="540" y="228" width="204" height="42" rx="8" fill="#fffbf2" stroke="#f2e0bb"/><text x="642" y="248" text-anchor="middle" font-size="10.5" fill="#8a5d0c">全身全栈 = 为不存在的</text><text x="642" y="263" text-anchor="middle" font-size="10.5" fill="#8a5d0c">分辨率需求付费</text></svg>
