# IndexNow 自动提交（Bing + Yandex + Seznam + Naver）
# 触发：Hugo 构建部署成功后自动执行
name: IndexNow Submission

on:
  workflow_run:
    workflows: ["Deploy Hugo site to Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  indexnow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build site
        run: hugo --minify

      - name: Extract URLs
        id: extract
        run: |
          URLS=$(grep -oP '<loc>\K[^<]+' public/sitemap.xml 2>/dev/null | python3 -c "
          import sys, json
          urls = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps(urls))
          ")
          echo "urls=$URLS" >> $GITHUB_OUTPUT
          COUNT=$(echo "$URLS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "Extracted $COUNT URLs"

      - name: Get IndexNow key from site
        id: getkey
        run: |
          # 从站点根目录获取 key 文件（文件名 = 任意 .txt，内容为 64 位 hex）
          KEY_FILE=$(ls /home/runner/work/*/*/*.txt 2>/dev/null | head -1)
          if [ -n "$KEY_FILE" ]; then
            KEY=$(cat "$KEY_FILE")
            echo "key=$KEY" >> $GITHUB_OUTPUT
            echo "Key file: $KEY_FILE"
          else
            # 尝试从构建后的 public/ 目录
            KEY_FILE=$(find public -name '*.txt' 2>/dev/null | head -1)
            if [ -n "$KEY_FILE" ]; then
              KEY=$(cat "$KEY_FILE")
              echo "key=$KEY" >> $GITHUB_OUTPUT
            else
              echo "key=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Submit to Bing
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: songsir-hub.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          body = {"host": host, "key": key, "urlList": urls[:100]}
          req = urllib.request.Request(
              "https://www.bing.com/indexnow",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read().decode())
                  print(f"Bing: HTTP {resp.status}, submitted {len(urls[:100])} URLs")
                  if 'bingRequestId' in result:
                      print(f"Request ID: {result['bingRequestId']}")
          except urllib.error.HTTPError as e:
              print(f"Bing: HTTP {e.code}: {e.read().decode()[:200]}")

      - name: Submit to Yandex
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: songsir-hub.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          body = {"host": host, "key": key, "urlList": urls[:100]}
          req = urllib.request.Request(
              "https://yandex.com/indexnow",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Yandex: HTTP {resp.status}, submitted {len(urls[:100])} URLs")
          except urllib.error.HTTPError as e:
              print(f"Yandex: HTTP {e.code}: {e.read().decode()[:200]}")

      - name: Submit to Seznam
        if: ${{ steps.getkey.outputs.key != '' && steps.extract.outputs.urls != '[]' }}
        continue-on-error: true
        env:
          KEY: ${{ steps.getkey.outputs.key }}
          HOST: songsir-hub.github.io
          URLS: ${{ steps.extract.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host = os.environ['HOST']
          key = os.environ['KEY']
          urls = json.loads(os.environ['URLS'])
          body = {"host": host, "key": key, "urlList": urls[:100]}
          req = urllib.request.Request(
              "https://search.seznam.cz/indexnow",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Seznam: HTTP {resp.status}, submitted {len(urls[:100])} URLs")
          except urllib.error.HTTPError as e:
              print(f"Seznam: HTTP {e.code}: {e.read().decode()[:200]}")
