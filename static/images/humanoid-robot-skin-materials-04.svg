<svg viewBox="0 0 760 268" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="268" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">皮肤不是被「拉断」的，是被「撕开」的</text><text x="190" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#123f6d">拉伸断裂（实验室测法）</text><rect x="90" y="66" width="200" height="46" rx="4" fill="#d9e8fb" stroke="#dbe7f4"/><text x="190" y="94" text-anchor="middle" font-size="11.5" fill="#47607d">哑铃试样 · 均匀受力</text><path d="M120 66 L120 52" stroke="#185FA5" stroke-width="2" marker-end="url(#a2)"/><path d="M260 66 L260 52" stroke="#185FA5" stroke-width="2" marker-end="url(#a2)"/><defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#185FA5"/></marker></defs><text x="190" y="132" text-anchor="middle" font-size="11.5" fill="#47607d">测得：拉伸强度 1–7 MPa</text><text x="190" y="150" text-anchor="middle" font-size="11" fill="#7b8ca0">伸长率 300%–1000%</text><rect x="60" y="162" width="260" height="34" rx="8" fill="#f5f8fb" stroke="#cfe0f2"/><text x="190" y="183" text-anchor="middle" font-size="11" fill="#47607d">这两个数字都不决定皮肤何时破</text><text x="570" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">撕裂扩展（真实失效）</text><rect x="440" y="66" width="260" height="48" rx="3" fill="#d9e8fb" stroke="#dbe7f4"/><path d="M440 66 L482 90 L440 114 Z" fill="#ffffff" stroke="#c53030" stroke-width="1.5"/><circle cx="482" cy="90" r="5" fill="#c53030"/><text x="488" y="78" font-size="10.5" fill="#c53030">楔尖：应力集中</text><path d="M487 90 q10 -7 20 0 q10 7 20 0 q10 -7 20 0 q10 7 20 0" fill="none" stroke="#c53030" stroke-width="2.5"/><text x="570" y="130" text-anchor="middle" font-size="10.5" fill="#c53030">1 mm 长的切口 → 反复弯折下向右扩展</text><text x="570" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c53030">真实失效模式：撕裂扩展，不是整体拉断</text><rect x="440" y="162" width="260" height="34" rx="8" fill="#fff5f5" stroke="#fed7d7"/><text x="570" y="183" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c53030">真正该看的是撕裂强度（kN/m）</text><text x="380" y="222" text-anchor="middle" font-size="11.5" fill="#47607d">参考值：Ecoflex 00-30 约 6.65 kN/m（Die B）　·　Dragon Skin 10 为 17.9 kN/m（Die B）</text><rect x="16" y="234" width="728" height="26" rx="8" fill="#fffbf2" stroke="#f2e0bb"/><text x="380" y="251" text-anchor="middle" font-size="11.5" fill="#8a5d0c">选型提示：只看邵氏硬度选型是错的 —— 同硬度的不同配方，撕裂强度可差一倍以上</text></svg>
