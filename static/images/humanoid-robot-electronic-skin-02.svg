<svg viewBox="0 0 760 322" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="322" fill="#ffffff"/><text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#123f6d">九条传感机理按「能否测静态力」分成三组</text><rect x="16" y="42" width="234" height="248" rx="12" fill="#f0fff4" stroke="#cfe0f2"/><rect x="16" y="42" width="234" height="4" rx="2" fill="#2f855a"/><text x="30" y="66" font-size="12.5" font-weight="700" fill="#2f855a">可测静态 · 天然三轴</text><rect x="30" y="90" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="42" y="111" font-size="11.5" font-weight="700" fill="#123f6d">磁弹性 / 霍尔</text><text x="42" y="129" font-size="10" fill="#47607d">天然三轴，抗过载，迟滞小</text><rect x="30" y="150" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="42" y="171" font-size="11.5" font-weight="700" fill="#123f6d">FBG 光纤光栅</text><text x="42" y="189" font-size="10" fill="#47607d">波分复用少引线，全抗 EMI</text><rect x="30" y="210" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="42" y="231" font-size="11.5" font-weight="700" fill="#123f6d">视触觉（GelSight 类）</text><text x="42" y="249" font-size="10" fill="#47607d">空间分辨率最高，需相机与算力</text><rect x="263" y="42" width="234" height="248" rx="12" fill="#f2f7fd" stroke="#cfe0f2"/><rect x="263" y="42" width="234" height="4" rx="2" fill="#185FA5"/><text x="277" y="66" font-size="12.5" font-weight="700" fill="#123f6d">可测静态 · 标量或需结构解耦</text><rect x="277" y="90" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="289" y="111" font-size="11.5" font-weight="700" fill="#123f6d">压阻 / 电阻</text><text x="289" y="129" font-size="10" fill="#47607d">最简、最便宜、最易印刷量产</text><rect x="277" y="150" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="289" y="171" font-size="11.5" font-weight="700" fill="#123f6d">电容 / 离电型</text><text x="289" y="189" font-size="10" fill="#47607d">灵敏度高，但怕寄生电容与串扰</text><rect x="277" y="210" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="289" y="231" font-size="11.5" font-weight="700" fill="#123f6d">气压 / 液压腔</text><text x="289" y="249" font-size="10" fill="#47607d">极柔顺，响应慢</text><rect x="510" y="42" width="234" height="248" rx="12" fill="#fff5f5" stroke="#cfe0f2"/><rect x="510" y="42" width="234" height="4" rx="2" fill="#c53030"/><text x="524" y="66" font-size="12.5" font-weight="700" fill="#c53030">原理上不能测静态力</text><rect x="524" y="90" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="536" y="111" font-size="11.5" font-weight="700" fill="#123f6d">压电（PVDF 等）</text><text x="536" y="129" font-size="10" fill="#47607d">τ=RC，低频截止约 1 Hz</text><rect x="524" y="150" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="536" y="171" font-size="11.5" font-weight="700" fill="#123f6d">摩擦电（TENG）</text><text x="536" y="189" font-size="10" fill="#47607d">自供能，但绝对标定极难</text><rect x="524" y="210" width="206" height="52" rx="8" fill="#ffffff" stroke="#cfe0f2"/><text x="536" y="231" font-size="11.5" font-weight="700" fill="#123f6d">——</text><text x="536" y="249" font-size="10" fill="#47607d">二者只能做滑移/纹理/敲击</text><rect x="16" y="298" width="728" height="18" rx="6" fill="#f5f8fb" stroke="#cfe0f2"/><text x="380" y="311" text-anchor="middle" font-size="10.5" fill="#47607d">混合方案是必然：静态通道（压阻/电容/霍尔）+ 动态通道（压电/TENG）—— 正好对应人体的 SA / FA 双通道</text></svg>
