# 搜索引擎收录 + 公众号侵权监控（每天两次，北京时间 8:00 和 20:00）
name: Search & Plagiarism Monitor

on:
  schedule:
    - cron: '0 0 * * *'   # 8:00 UTC+8
    - cron: '0 12 * * *'  # 20:00 UTC+8
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check Baidu/Google index + WeChat plagiarism
        run: |
          HOST="songsir-hub.github.io"
          ISSUES=()

          # 1. 检查 Baidu 收录
          BAIDU=$(curl -s "https://www.baidu.com/s?wd=site:$HOST" --max-time 30 2>/dev/null || echo "")
          if echo "$BAIDU" | grep -q "没有找到"; then
            ISSUES+=("百度未收录任何 $HOST 页面")
          fi

          # 2. 检查 Google 收录（通过 r.jina.ai 代理，绕过国内限制）
          GOOGLE=$(curl -s "https://r.jina.ai/https://www.google.com/search?q=site:$HOST" --max-time 30 2>/dev/null || echo "")
          if [ -z "$GOOGLE" ] || echo "$GOOGLE" | grep -q "No results found"; then
            ISSUES+=("Google 未收录任何 $HOST 页面")
          fi

          # 3. 检查公众号侵权
          # 搜索关键词：博雅小筑 文章标题（取前几个文章标题）
          POSTS=$(curl -s "https://$HOST/sitemap.xml" | grep -oP '(?<=<loc>).*?(?=</loc>)' | grep '/posts/' | head -5)
          for URL in $POSTS; do
            # 从 URL 提取 slug
            SLUG=$(echo "$URL" | sed 's|.*/posts/||; s|/||')
            # 在百度搜索文章标题 + "博雅小筑"
            BSEARCH=$(curl -s "https://www.baidu.com/s?wd=${SLUG}%20博雅小筑" --max-time 15 2>/dev/null || echo "")
            if [ -n "$BSEARCH" ] && ! echo "$BSEARCH" | grep -q "没有找到"; then
              # 找到结果，检查是否有非官方域名
              FOUND_DOMAINS=$(echo "$BSEARCH" | grep -oP 'https?://[a-zA-Z0-9.-]+\.[a-z]{2,}' | grep -v "$HOST" | sort -u | head -5)
              if [ -n "$FOUND_DOMAINS" ]; then
                ISSUES+=("文章 '$SLUG' 在百度搜索中发现了非官方域名: $(echo $FOUND_DOMAINS | tr '\n' ' '))
              fi
            fi
          done

          # 汇总
          if [ ${#ISSUES[@]} -eq 0 ]; then
            echo "✓ 所有监控项通过"
          else
            echo "::error::发现 ${#ISSUES[@]} 个监控项需要关注:"
            for issue in "${ISSUES[@]}"; do
              echo "  ✗ $issue"
            done
            exit 1
          fi
