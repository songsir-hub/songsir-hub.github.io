<text x="480" y="46" font-size="25" fill="#3A3226" text-anchor="middle" font-weight="bold">来 · 麦 · 莱：三个字的字形演化与部件关系</text>
<text x="480" y="74" font-size="12.5" fill="#6B6255" text-anchor="middle">甲骨文 → 金文 → 小篆 → 楷书　（摹绘示意，非原拓影印；正式引用请核《甲骨文编》《金文编》《说文解字》）</text>
<rect x="56" y="106" width="856" height="40" fill="#F2EAD8" stroke="#C9BFA8" stroke-width="1.6"/>
<text x="257.5" y="132" font-size="15" fill="#3A3226" text-anchor="middle" font-weight="bold">甲骨文</text>
<text x="444.5" y="132" font-size="15" fill="#3A3226" text-anchor="middle" font-weight="bold">金文</text>
<text x="631.5" y="132" font-size="15" fill="#3A3226" text-anchor="middle" font-weight="bold">小篆</text>
<text x="818.5" y="132" font-size="15" fill="#3A3226" text-anchor="middle" font-weight="bold">楷书</text>
<rect x="56" y="146" width="856" height="152" fill="#FFFDF7" stroke="#C9BFA8" stroke-width="1.4"/>
<text x="110.0" y="198" font-size="32" fill="#C07830" text-anchor="middle" font-weight="bold">来</text>
<text x="110.0" y="224" font-size="12" fill="#6B6255" text-anchor="middle">本义：小麦</text>
